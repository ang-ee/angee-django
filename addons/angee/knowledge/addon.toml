# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.knowledge"
description = "A markdown-first knowledge base — vaults of pages with versioned markdown bodies"
keywords = ["knowledge", "rag", "embeddings"]
category = "Data"
depends_on = ["angee.iam", "angee.messaging", "angee.tags", "angee.provenance"]
dependencies = [
  "markdown-it-py>=4.2",
]

[[migrations]]
name = "retire_creation_keys"
app_label = "knowledge"
module = "runtime_migrations.retire_creation_keys"

[resources]
demo = [
  { path = "resources/demo/010_knowledge.vault.yaml", depends_on = "iam:resources/demo/010_iam.user.yaml", adopt = ["owner", "name"] },
  { path = "resources/demo/020_knowledge.page.yaml", depends_on = "resources/demo/010_knowledge.vault.yaml", adopt = ["vault", "title"] },
  { path = "resources/demo/030_knowledge.markdown_page.yaml", depends_on = "resources/demo/020_knowledge.page.yaml", adopt = ["vault", "title"] },
]
