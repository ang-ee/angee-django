build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-projects"
version = "3.0.0"
description = "Bounded projects, milestones, and the platform's one human-action task table."
keywords = ["projects", "milestones", "tasks", "planning"]
dependencies = ["angee-base>=3,<4", "angee-iam>=3,<4", "angee-integrate>=3,<4", "angee-knowledge>=3,<4", "angee-messaging>=3,<4", "angee-parties>=3,<4", "angee-provenance>=3,<4", "angee-scheduling>=3,<4", "angee-storage>=3,<4", "angee-tags>=3,<4", "angee-timeline>=3,<4", "angee-web>=3,<4", "django-compose>=0.1.0.dev1,<0.2"]

[project.entry-points]
"angee.addons" = {"angee.projects" = "angee.projects"}

[tool.angee]

[[tool.angee.resources.master]]
path = "master/010_projects.activitytype.yaml"
adopt = "key"

[[tool.angee.resources.demo]]
path = "demo/010_projects.project.yaml"
depends_on = "iam:demo/010_iam.user.yaml"

[[tool.angee.resources.demo]]
path = "demo/020_projects.milestone.yaml"
depends_on = "demo/010_projects.project.yaml"

[[tool.angee.resources.demo]]
path = "demo/030_projects.task.yaml"
depends_on = ["demo/010_projects.project.yaml", "demo/020_projects.milestone.yaml"]

[[tool.angee.resources.demo]]
path = "demo/031_projects.task.yaml"
depends_on = "demo/030_projects.task.yaml"

[tool.angee.platform]
category = "Productivity"

[tool.hatch.metadata]
allow-direct-references = true
