build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-storage-integrate-iphone"
version = "3.0.0"
description = "iPhone backups exposed as external storage Mounts"
keywords = ["iphone", "backup", "storage", "mounts"]
dependencies = ["angee-storage-integrate>=3,<4", "angee-storage>=3,<4", "angee-integrate>=3,<4", "angee-integrate-iphone>=3,<4", "angee-web>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.storage_integrate_iphone" = "angee.storage_integrate_iphone"}

[tool.angee]
category = "Integration"
