# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.parties"
description = "Contacts — people and organizations, their circles, relationships, addresses, and directory sync"
keywords = ["parties", "contacts", "crm"]
category = "Data"
depends_on = ["angee.provenance", "angee.graphql", "angee.iam", "angee.integrate", "angee.storage", "angee.tags"]
dependencies = [
  "django-countries>=9,<10",
  "phonenumbers>=9.0",
  "pycountry>=26,<27",
]

[[migrations]]
name = "directory_sync_status"
app_label = "parties"
module = "runtime_migrations.directory_sync_status"

# The statement cutover chain. Manifest order is the in-app order; the guards
# decide the composer round, which orders the chain across addons: the preflight
# first, then schema, folds, and the retirements last.
[[migrations]]
name = "preflight_party_folds"
app_label = "parties"
module = "runtime_migrations.preflight_party_folds"

[[migrations]]
name = "party_statement_schema"
app_label = "parties"
module = "runtime_migrations.party_statement_schema"

[[migrations]]
name = "party_aspect_schema"
app_label = "parties"
module = "runtime_migrations.party_aspect_schema"

[[migrations]]
name = "fold_party_handle_statements"
app_label = "parties"
module = "runtime_migrations.fold_party_handle_statements"

[[migrations]]
name = "fold_party_aspects"
app_label = "parties"
module = "runtime_migrations.fold_party_aspects"

[[migrations]]
name = "circle_member_decisions"
app_label = "parties"
module = "runtime_migrations.circle_member_decisions"

[[migrations]]
name = "retire_party_handle"
app_label = "parties"
module = "runtime_migrations.retire_party_handle"

[[migrations]]
name = "retire_party_carriers"
app_label = "parties"
module = "runtime_migrations.retire_party_carriers"

[resources]
install = [
  { path = "resources/install/010_provenance.rule.yaml", adopt = "key" },
  { path = "resources/install/020_statement_source_grants.yaml", kind = "grants", depends_on = ["resources/install/010_provenance.rule.yaml"] },
]
master = [
  { path = "resources/master/010_parties.relationshipkind.yaml", adopt = "slug" },
]
