build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-base"
version = "3.0.0"
description = "Django model, identity and permission foundation"
keywords = ["models", "identity", "permissions"]
dependencies = ["cryptography>=44", "django-sqids>=0.1", "django-zed-rebac>=0.30.0", "sqids>=0.4.1", "django-choices-field @ git+https://github.com/ang-ee/django-choices-field.git@b02c1488660d0bf1f4483d2e73bc842b41b70632", "jsonschema[format-nongpl]>=4.26", "pydantic>=2.13", "referencing>=0.37", "django-compose>=0.1.0.dev0,<0.2", "django>=6.1.2,<6.2", "django-yamlconf>=1.5.0", "django-environ>=0.12", "sentry-sdk>=2.71.0", "psycopg[binary,pool]>=3.2"]
requires-python = ">=3.14"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.GPL"]

[project.optional-dependencies]
testing = ["pytest>=8", "pytest-django>=4.8", "tomlkit>=0.13", "packaging>=24"]

[project.entry-points]
"angee.addons" = {"angee.base" = "angee.base"}

[tool.angee]

[tool.angee.platform]
category = "Foundation"
[tool.hatch.metadata]
allow-direct-references = true
