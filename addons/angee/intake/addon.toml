[addon]
name = "angee.intake"
description = "External-request evidence captured onto project tasks and projects."
keywords = ["intake", "requests", "needs", "triage", "customers"]
category = "Productivity"
depends_on = [
  "angee.iam",
  "angee.decisions",
  "angee.messaging",
  "angee.parties",
  "angee.projects",
  "angee.work",
]

[[migrations]]
name = "need_single_target"
app_label = "intake"
module = "runtime_migrations.need_single_target"

[[migrations]]
name = "need_access_decision"
app_label = "intake"
module = "runtime_migrations.need_access_decision"

[resources]
master = []
demo = [
  { path = "resources/demo/010_messaging.channel.yaml", depends_on = ["integrate:resources/master/010_integrate.vendor.yaml", "iam:resources/demo/010_iam.user.yaml", "work:resources/demo/010_work.queue.yaml"] },
  { path = "resources/demo/020_intake.need.yaml", depends_on = ["work:resources/demo/020_projects.task.yaml", "projects:resources/demo/010_projects.project.yaml"] },
]
