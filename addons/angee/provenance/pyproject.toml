build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-provenance"
version = "3.0.0"
description = "Changesets attributing canonical record history to its actor and origin"
keywords = ["provenance", "history"]
dependencies = ["angee-base>=3,<4", "angee-graphql>=3,<4", "angee-timeline>=3,<4", "angee-web>=3,<4", "django-simple-history @ git+https://github.com/ang-ee/django-simple-history.git@406461d07597b6fd3448f175817851da04d42818", "django-compose @ git+https://github.com/ang-ee/django-compose.git@c7e61d587a91adeba8d26e9551e6c1ffc2dd6ddb"]

[project.entry-points]
"angee.addons" = {"angee.provenance" = "angee.provenance"}

[tool.angee]

[tool.angee.platform]
category = "Data"

[tool.hatch.metadata]
allow-direct-references = true
