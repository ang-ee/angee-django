build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-knowledge-integrate-notion"
version = "3.0.0"
description = "Notion API connections for knowledge vaults"
keywords = ["knowledge", "notion", "integration"]
dependencies = ["angee-base>=3,<4", "angee-knowledge>=3,<4", "angee-integrate>=3,<4", "angee-web>=3,<4", "markdown-it-py>=4.2"]

[project.entry-points]
"angee.addons" = {"angee.knowledge_integrate_notion" = "angee.knowledge_integrate_notion"}

[tool.angee]

[[tool.angee.resources.master]]
path = "master/010_integrate.vendor.yaml"
adopt = "slug"

[tool.angee.platform]
category = "Integration"
