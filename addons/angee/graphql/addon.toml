# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see angee/addons.py (AddonContract).
[addon]
name = "angee.graphql"
description = "The GraphQL runtime — schema buckets, auto-CRUD, subscriptions, and SDL"
keywords = ["graphql", "schema", "api"]
category = "Foundation"
depends_on = ["angee.base", "channels"]
schemas = "sharing.schemas"
dependencies = [
  "channels>=4.0",
  "channels-redis>=4.2",
  "django-zed-rebac[strawberry-django] @ git+https://github.com/ang-ee/django-zed-rebac.git@0ecf18a3cb9d187b66fe6aee3b3b5b78954a10f9",
  "pydantic>=2.13",
  "strawberry-django-aggregates @ git+https://github.com/ang-ee/strawberry-django-aggregates.git@587fc099ae1db69c618f9d0d38d6dc1deec63142",
  "strawberry-django-hasura @ git+https://github.com/ang-ee/strawberry-django-hasura.git@ac5559f367e575da55db7d2267df271490a3a50b",
  # The GraphQL addon owns the fork pin as a direct reference so every composed
  # host receives the same source through its generated addons group; repeating
  # uv.sources tables in each consumer/template would split that ownership.
  "strawberry-graphql @ git+https://github.com/ang-ee/strawberry.git@e4fa3198f704d81b3ca96b6dcac75420c5fee516",
  "strawberry-graphql-django>=0.86.7",
]
