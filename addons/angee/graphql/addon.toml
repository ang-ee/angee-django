# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.graphql"
description = "The GraphQL runtime — schema buckets, auto-CRUD, subscriptions, and SDL"
keywords = ["graphql", "schema", "api"]
category = "Foundation"
depends_on = ["angee.base", "channels"]
schemas = "sharing.schemas"
dependencies = [
  "channels>=4.0",
  "channels-redis>=4.2",
  "django-zed-rebac[strawberry-django]>=0.18.2",
  "strawberry-django-aggregates>=0.12.0",
  "strawberry-django-hasura>=0.11.0",
  # The GraphQL addon owns the fork pin as a direct reference so every composed
  # host receives the same source through its generated addons group; repeating
  # uv.sources tables in each consumer/template would split that ownership.
  "strawberry-graphql @ git+https://github.com/ang-ee/strawberry.git@273bf0456d914d4df535222c4cbae73dff46a376",
  "strawberry-graphql-django>=0.89.2",
]
