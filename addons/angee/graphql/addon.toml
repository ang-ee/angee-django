# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.graphql"
description = "The GraphQL runtime — schema buckets, auto-CRUD, subscriptions, and SDL"
keywords = ["graphql", "schema", "api"]
category = "Foundation"
depends_on = ["angee", "channels"]
schemas = "records.schemas"
dependencies = [
  "channels>=4.0",
  "channels-redis>=4.2",
  # The core wheel pins the exact django-zed-rebac release; this addon only adds
  # the extra, so a core bump never contradicts a host's generated group.
  "django-zed-rebac[strawberry-django]>=0.27.0",
  "strawberry-django-aggregates @ git+https://github.com/ang-ee/strawberry-django-aggregates.git@0f374854d19b2709b6d77ae872090ab2a751f1dc",
  "strawberry-django-hasura>=0.14.0",
  # The GraphQL addon owns the fork pin as a direct reference so every composed
  # host receives the same source through its generated addons group; repeating
  # uv.sources tables in each consumer/template would split that ownership.
  "strawberry-graphql @ git+https://github.com/ang-ee/strawberry.git@273bf0456d914d4df535222c4cbae73dff46a376",
  "strawberry-graphql-django @ git+https://github.com/ang-ee/strawberry-django.git@5da69857d12c8a0fd09b78ee930741f3550c8bb0",
]
