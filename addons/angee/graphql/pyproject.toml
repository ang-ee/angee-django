build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-graphql"
version = "3.0.0"
description = "The GraphQL runtime — schema buckets, auto-CRUD, subscriptions, and SDL"
keywords = ["graphql", "schema", "api"]
dependencies = ["angee-base>=3,<4", "sentry-sdk>=2.71.0", "pydantic>=2.13", "graphql-core>=3.3.1,<3.4", "channels>=4.0", "channels-redis>=4.2", "django-zed-rebac[strawberry-django] @ git+https://github.com/ang-ee/django-zed-rebac.git@f43f0773f2c2a86a6882aeb1b46b34b8c19a0d13", "strawberry-django-aggregates @ git+https://github.com/ang-ee/strawberry-django-aggregates.git@0f374854d19b2709b6d77ae872090ab2a751f1dc", "strawberry-django-hasura @ git+https://github.com/ang-ee/strawberry-django-hasura.git@4e1c2da2bcbbc90cc586fef3db8d70f5cd6ccfc0", "strawberry-graphql @ git+https://github.com/ang-ee/strawberry.git@273bf0456d914d4df535222c4cbae73dff46a376", "strawberry-graphql-django @ git+https://github.com/ang-ee/strawberry-django.git@091238ecd4ae07798ef12e9eb24281540da41ced", "angee-server>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.graphql" = "angee.graphql"}

[tool.angee]

[tool.angee.graphql]
schema = "records.schemas"

[tool.angee.platform]
category = "Foundation"
[tool.hatch.metadata]
allow-direct-references = true
