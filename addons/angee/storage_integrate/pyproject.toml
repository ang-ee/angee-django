build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-storage-integrate"
version = "3.0.0"
description = "External storage mounts synchronized through integration bridges"
keywords = ["storage", "integrate", "mounts"]
dependencies = ["angee-base>=3,<4", "angee-storage>=3,<4", "angee-integrate>=3,<4", "angee-web>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.storage_integrate" = "angee.storage_integrate"}

[tool.angee]
category = "Integration"

[[tool.angee.resources.master]]
path = "master/010_integrate.vendor.yaml"
adopt = "slug"
