build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-tags"
version = "3.0.0"
description = "Polymorphic tags: a shared vocabulary attachable to any row."
keywords = ["tags", "labels", "taxonomy", "polymorphic"]
dependencies = ["angee-base>=3,<4", "angee-provenance>=3,<4", "angee-iam>=3,<4", "angee-resources>=3,<4", "angee-graphql>=3,<4", "angee-web>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.tags" = "angee.tags"}

[tool.angee]

[tool.angee.resources]
demo = ["demo/010_tags.tag.yaml"]

[tool.angee.platform]
category = "Foundation"
