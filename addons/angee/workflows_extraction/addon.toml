# Angee addon manifest. The declarative contract hatch-angee compiles.
[addon]
name = "angee.workflows_extraction"
description = "Schema-validated document extraction evidence and workflow step"
keywords = ["workflows", "extraction", "documents", "evidence"]
category = "Workflows"
depends_on = ["angee.workflows", "angee.workflows_agents", "angee.agents", "angee.storage", "angee.messaging", "django.contrib.contenttypes"]
dependencies = [
  "jsonschema>=4.26",
  "pypdfium2>=4.30",
  "pillow>=11.0",
]

[resources]
install = [
  { path = "resources/install/100_workflows.workflow.yaml", publish = true },
  { path = "resources/install/101_workflows.step.yaml", depends_on = "resources/install/100_workflows.workflow.yaml" },
  { path = "resources/install/102_workflows.edge.yaml", depends_on = "resources/install/101_workflows.step.yaml" },
]
