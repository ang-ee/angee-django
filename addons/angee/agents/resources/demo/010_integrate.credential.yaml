# HMAC key from which each provisioned demo agent's own bearer to the platform's
# internal MCP server is derived. `MCPServer.bearer_for()` mints a per-agent
# `<agent sqid>.<hmac>` from this credential's `secret_value()`; the base `angee.mcp`
# verifier parses that bearer and resolves it back to the named agent. Provisioning syncs
# each agent's derived bearer to the operator store via `mcp_secrets()`; the raw secret
# below never reaches a container.
- xref: cred_mcp_angee
  user: iam.user_admin
  kind: static_token
  name: angee-mcp-bearer
  material: '{"api_key": "demo-mcp-bearer-token"}'
