# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.agents"
description = "AI agents — the inference provider/model catalogue and the runtimes agents run on"
keywords = ["agents", "ai", "inference"]
category = "Agents"
depends_on = ["angee.integrate", "angee.integrate_vcs", "angee.operator", "angee.mcp"]
dependencies = ["pydantic-ai-slim>=2.13"]

[[migrations]]
name = "vcs_models_cutover"
app_label = "agents"
module = "runtime_migrations.vcs_models_cutover"

[[migrations]]
name = "live_tool_backing"
app_label = "agents"
module = "runtime_migrations.live_tool_backing"
compatible_source_sha256 = ["b061c4d07be484f5e1bda84d90a4b9ef5f536bcc3338b28ec7bf5f3654d43117"]

[[migrations]]
name = "role_subject_relations"
app_label = "agents"
module = "runtime_migrations.role_subject_relations"

[resources]
demo = [
  { path = "resources/demo/010_integrate.credential.yaml", depends_on = "iam:resources/demo/010_iam.user.yaml", adopt = ["user", "name"] },
  { path = "resources/demo/020_agents.mcpserver.yaml", depends_on = "resources/demo/010_integrate.credential.yaml", adopt = "name" },
]
