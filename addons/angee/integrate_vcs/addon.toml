# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.integrate_vcs"
description = "VCS bridges, repository inventory, sources, and templates"
keywords = ["integrations", "vcs", "repositories"]
category = "Integration"
depends_on = ["angee.integrate"]

[[migrations]]
name = "vcs_bridge_sync_status"
app_label = "integrate_vcs"
module = "runtime_migrations.vcs_bridge_sync_status"
