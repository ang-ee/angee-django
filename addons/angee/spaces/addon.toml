# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.spaces"
description = "Shared groups with canonical rosters, role-derived access, and group threads"
keywords = ["spaces", "groups", "rosters", "roles"]
category = "Data"
depends_on = ["angee.iam", "angee.parties", "angee.messaging"]

[[migrations]]
fresh_history = "baseline"
name = "thread_groups"
app_label = "messaging"
module = "runtime_migrations.thread_groups"

[[migrations]]
fresh_history = "baseline"
name = "live_relation_backing"
app_label = "spaces"
module = "runtime_migrations.live_relation_backing"
