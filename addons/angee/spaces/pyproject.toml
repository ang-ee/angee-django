build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-spaces"
version = "3.0.0"
description = "Shared groups with canonical rosters, role-derived access, and group threads"
keywords = ["spaces", "groups", "rosters", "roles"]
dependencies = ["angee-base>=3,<4", "angee-iam>=3,<4", "angee-parties>=3,<4", "angee-messaging>=3,<4", "angee-knowledge>=3,<4", "angee-web>=3,<4", "django-compose>=0.1.0.dev1,<0.2"]

[project.entry-points]
"angee.addons" = {"angee.spaces" = "angee.spaces"}

[tool.angee]

[tool.angee.platform]
category = "Data"

[tool.hatch.metadata]
allow-direct-references = true
