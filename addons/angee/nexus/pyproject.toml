build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-nexus"
version = "3.0.0"
description = "Relationship intelligence — interaction rollups, gravity/fading, and the cross-channel person timeline over parties and messaging"
keywords = ["nexus", "contacts", "relationships", "timeline"]
dependencies = ["angee-base>=3,<4", "angee-parties>=3,<4", "angee-messaging>=3,<4", "angee-spaces>=3,<4", "angee-posts>=3,<4", "angee-timeline>=3,<4", "angee-jobs>=3,<4", "angee-web>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.nexus" = "angee.nexus"}

[tool.angee]
category = "Data"
