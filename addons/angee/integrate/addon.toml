# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.integrate"
description = "The integration substrate — OAuth connections, credentials, and the bridge/capability runtime"
keywords = ["integrations", "oauth", "connections"]
category = "Integration"
depends_on = ["angee.iam", "angee.resources", "angee.jobs", "angee.graphql", "angee.provenance"]
dependencies = [
  # Authlib's OAuth2Client is an httpx2 client from 1.8.0; earlier releases build it
  # on httpx, which cannot drive integrate's httpx2 PinnedTransport.
  "authlib>=1.8.0",
  "deepdiff>=9.1.0",
  # httpcore2 is bounded and named directly: integrate.http subclasses its SyncBackend
  # and swaps the ConnectionPool's network backend for the SSRF pin, so the pin owns
  # httpcore2's API. httpx2 is bounded to the verified range for the same reason.
  "httpcore2>=2.10,<3",
  "httpx2>=2.10,<3",
  "jsonpatch>=1.34",
  "qrcode[pil]>=8.2",
]

[[migrations]]
name = "record_link_target_names"
app_label = "integrate"
module = "runtime_migrations.record_link_target_names"

[[migrations]]
name = "integration_concrete_type"
app_label = "integrate"
module = "runtime_migrations.integration_concrete_type"

[[migrations]]
name = "record_link_history_state"
app_label = "integrate"
module = "runtime_migrations.record_link_history_state"

[[migrations]]
name = "record_sync_state"
app_label = "integrate"
module = "runtime_migrations.record_sync_state"

[[migrations]]
name = "fold_record_sync_history"
app_label = "integrate"
module = "runtime_migrations.fold_record_sync_history"

[[migrations]]
name = "retire_record_sync_stores"
app_label = "integrate"
module = "runtime_migrations.retire_record_sync_stores"

[[migrations]]
name = "retire_record_sync_hash_bases"
app_label = "integrate"
module = "runtime_migrations.retire_record_sync_hash_bases"

[[migrations]]
name = "record_link_failure_status"
app_label = "integrate"
module = "runtime_migrations.record_link_failure_status"

[[migrations]]
name = "sync_stream_authoritative"
app_label = "integrate"
module = "runtime_migrations.sync_stream_authoritative"

[resources]
master = [
  { path = "resources/master/010_integrate.vendor.yaml", adopt = "slug" },
]
install = [
  { path = "resources/install/010_integrate.oauthclient.yaml", adopt = ["slug", "environment"] },
]
