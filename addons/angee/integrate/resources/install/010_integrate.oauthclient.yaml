# OAuth registration seeds (install tier). Model inferred from the
# `integrate.oauthclient` filename; adopted by (slug, environment) so a pre-existing
# row is linked, not duplicated. Public clients omit client secrets; confidential
# registrations acquire app credentials from host settings. The OIDC login policy
# (issuer/JWKS) for the login-capable providers is owned and seeded by
# the iam_integrate_oidc addon, not here.
- xref: oauth_gemini
  slug: gemini
  environment: prod
  display_name: Google Gemini
  icon: google
  client_id: 681255809395-oo8ft2oprdrnp9e3aqf6av3hmdib135j.apps.googleusercontent.com
  authorize_endpoint: https://accounts.google.com/o/oauth2/v2/auth
  token_endpoint: https://oauth2.googleapis.com/token
  discovery_url: https://accounts.google.com/.well-known/openid-configuration
  # Clear the former v2 profile override; discovery supplies the preset's OIDC profile.
  userinfo_endpoint: ""
  is_enabled: true
  supports_pkce: true
  supports_refresh: true
  scopes_catalogue:
    - https://www.googleapis.com/auth/cloud-platform
    - https://www.googleapis.com/auth/userinfo.email
    - https://www.googleapis.com/auth/userinfo.profile
  default_scopes:
    - https://www.googleapis.com/auth/cloud-platform
    - https://www.googleapis.com/auth/userinfo.email
    - https://www.googleapis.com/auth/userinfo.profile
  authorize_params:
    access_type: offline
  external_id_claim: sub
  email_claim: email
  display_name_claim: name
  avatar_url_claim: picture
- xref: oauth_grok
  slug: grok
  environment: prod
  display_name: Grok
  icon: grok
  client_id: b1a00492-073a-47ea-816f-4c329264a828
  authorize_endpoint: https://auth.x.ai/oauth2/authorize
  token_endpoint: https://auth.x.ai/oauth2/token
  is_enabled: false
  supports_pkce: true
  supports_refresh: true
  scopes_catalogue:
    - openid
    - profile
    - email
    - offline_access
    - grok-cli:access
    - api:access
  default_scopes:
    - openid
    - profile
    - email
    - offline_access
    - grok-cli:access
    - api:access
  authorize_params:
    plan: generic
  external_id_claim: sub
  email_claim: email
  display_name_claim: name
  avatar_url_claim: picture
