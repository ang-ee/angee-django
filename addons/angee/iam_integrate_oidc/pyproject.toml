build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-iam-integrate-oidc"
version = "3.0.0"
description = "OIDC single sign-on — login and account linking over any OpenID Connect provider"
keywords = ["oidc", "login", "sso"]
dependencies = ["angee-iam>=3,<4", "angee-integrate>=3,<4", "angee-parties>=3,<4", "angee-web>=3,<4", "pyjwt[crypto]>=2.12", "django-compose==0.1.0.dev1"]

[project.entry-points]
"angee.addons" = {"angee.iam_integrate_oidc" = "angee.iam_integrate_oidc"}

[tool.angee]

[[tool.angee.resources.install]]
path = "install/010_integrate.oauthclient.yaml"
adopt = ["slug", "environment"]

[[tool.angee.resources.demo]]
path = "demo/010_integrate.oauthclient.yaml"
adopt = ["slug", "environment"]

[tool.angee.platform]
category = "Integration"

[tool.hatch.metadata]
allow-direct-references = true
