[addon]
name = "angee.uom"
description = "Units of measure: a category tree of convertible units with per-unit rounding."
keywords = ["uom", "units", "measure", "conversion"]
category = "Foundation"
depends_on = ["angee.iam", "angee.resources", "angee.graphql"]

[resources]
master = [
  "resources/master/010_uom.uomcategory.yaml",
  { path = "resources/master/020_uom.uom.yaml", depends_on = "resources/master/010_uom.uomcategory.yaml" },
]

[[migrations]]
app_label = "uom"
name = "native_catalogue_shared_readers"
module = "runtime_migrations.native_catalogue_shared_readers"

[[migrations]]
app_label = "uom"
name = "canonical_shared_reader_ids"
module = "runtime_migrations.canonical_shared_reader_ids"
