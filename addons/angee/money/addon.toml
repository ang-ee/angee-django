[addon]
name = "angee.money"
description = "Currencies, dated exchange rates, and money semantics (rounding + conversion)."
keywords = ["money", "currency", "exchange-rate", "iso-4217"]
category = "Foundation"
depends_on = ["angee.iam", "angee.resources", "angee.graphql"]

[resources]
master = [{ path = "resources/master/010_money.currency.yaml", adopt = "code" }]
demo = [
  { path = "resources/demo/020_money.currencyrate.yaml", depends_on = "resources/master/010_money.currency.yaml" },
]

[[migrations]]
fresh_history = "baseline"
app_label = "money"
name = "contextual_currency_rates"
module = "runtime_migrations.contextual_currency_rates"

[[migrations]]
fresh_history = "baseline"
app_label = "money"
name = "canonical_shared_reader_ids"
module = "runtime_migrations.canonical_shared_reader_ids"
