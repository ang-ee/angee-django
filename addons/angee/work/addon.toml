[addon]
name = "angee.work"
description = "Operational queues, named stages, cycles, and triage folded into project tasks."
keywords = ["work", "queues", "stages", "cycles", "triage", "planning"]
category = "Productivity"
depends_on = [
  "angee.base",
  "angee.iam",
  "angee.jobs",
  "angee.messaging",
  "angee.projects",
  "angee.sequence",
  "angee.spaces",
  "angee.web",
]

[[migrations]]
name = "stage_public_identity"
app_label = "resources"
module = "runtime_migrations.stage_public_identity"

[[migrations]]
name = "stage_fractional_position"
app_label = "work"
module = "runtime_migrations.stage_fractional_position"

[resources]
master = []
demo = [
  { path = "resources/demo/010_work.queue.yaml", depends_on = "iam:resources/demo/010_iam.user.yaml" },
  { path = "resources/demo/012_work.stage.yaml", depends_on = "resources/demo/010_work.queue.yaml", adopt = ["queue", "name"] },
  { path = "resources/demo/015_work.cycle.yaml", depends_on = "resources/demo/012_work.stage.yaml" },
  { path = "resources/demo/020_projects.task.yaml", depends_on = ["resources/demo/015_work.cycle.yaml", "projects:resources/demo/031_projects.task.yaml"] },
]
