build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-work"
version = "3.0.0"
description = "Operational queues, named stages, cycles, and triage folded into project tasks."
keywords = ["work", "queues", "stages", "cycles", "triage", "planning"]
dependencies = ["angee-base>=3,<4", "angee-iam>=3,<4", "angee-jobs>=3,<4", "angee-messaging>=3,<4", "angee-projects>=3,<4", "angee-sequence>=3,<4", "angee-spaces>=3,<4", "angee-web>=3,<4", "django-compose==0.1.0.dev1"]

[project.entry-points]
"angee.addons" = {"angee.work" = "angee.work"}

[tool.angee]

[[tool.angee.resources.demo]]
path = "demo/010_work.queue.yaml"
depends_on = "iam:demo/010_iam.user.yaml"

[[tool.angee.resources.demo]]
path = "demo/012_work.stage.yaml"
depends_on = "demo/010_work.queue.yaml"
adopt = ["queue", "name"]

[[tool.angee.resources.demo]]
path = "demo/015_work.cycle.yaml"
depends_on = "demo/012_work.stage.yaml"

[[tool.angee.resources.demo]]
path = "demo/020_projects.task.yaml"
depends_on = ["demo/015_work.cycle.yaml", "projects:demo/031_projects.task.yaml"]

[tool.angee.platform]
category = "Productivity"

[tool.hatch.metadata]
allow-direct-references = true
