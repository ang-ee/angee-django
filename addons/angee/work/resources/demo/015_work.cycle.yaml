  # generates the next windows on close, unnamed and empty. Seeding them with
  # the dates the cadence already computes (two-week windows following cycle 1)
  # means `adopt` links those rows rather than creating a fifth, and gives them
  # names and work so the cycle story has a screen to stand on. Cycle 4 is left
