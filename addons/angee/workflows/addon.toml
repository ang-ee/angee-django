# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.workflows"
description = "Workflow definitions, steps, edges, and triggers"
keywords = ["workflows", "automation", "orchestration"]
category = "Workflows"
depends_on = ["angee.iam", "angee.jobs"]
dependencies = [
  "croniter>=6.0",
]

[[migrations]]
name = "workflow_stable_key"
app_label = "workflows"
module = "runtime_migrations.workflow_stable_key"

[[migrations]]
name = "workflow_identity"
app_label = "workflows"
module = "runtime_migrations.workflow_identity"

[[migrations]]
name = "decision_target"
app_label = "workflows"
module = "runtime_migrations.decision_target"

[[migrations]]
name = "workflow_integration_sync_purpose"
app_label = "workflows"
module = "runtime_migrations.workflow_integration_sync_purpose"

[[migrations]]
name = "workflow_integration_sync_origin"
app_label = "workflows"
module = "runtime_migrations.workflow_integration_sync_origin"
