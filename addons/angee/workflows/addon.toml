# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.workflows"
description = "Workflow definitions, steps, edges, and triggers"
keywords = ["workflows", "automation", "orchestration"]
category = "Workflows"
depends_on = ["angee.iam", "angee.jobs", "angee.resources"]
dependencies = [
  "croniter>=6.0",
  "jsonschema>=4.26",
  "referencing>=0.37",
]

[[migrations]]
name = "optional_states_nullable"
app_label = "workflows"
module = "runtime_migrations.optional_states_nullable"
