# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.workflows"
description = "Immutable workflow graphs and actor-scoped execution"
keywords = ["workflows", "automation", "orchestration"]
category = "Workflows"
depends_on = ["angee.iam", "angee.jobs", "angee.resources", "angee.graphql", "angee.decisions"]

# Runs first: a pre-rebuild history is retired whole, so the cutovers below never match it.
[[migrations]]
name = "retire_pre_rebuild"
app_label = "workflows"
module = "runtime_migrations.retire_pre_rebuild"

[[migrations]]
name = "independent_decisions"
app_label = "workflows"
module = "runtime_migrations.independent_decisions"
# The released guard also matched pre-rebuild histories it cannot transform; its copies stay valid.
compatible_source_sha256 = ["7c5e604170aa65aeddba0e35a17b1fd919d76b3106a8654e4f5b415e0a95e4bd"]

[[migrations]]
name = "current_execution"
app_label = "workflows"
module = "runtime_migrations.current_execution"
