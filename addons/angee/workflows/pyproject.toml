build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-workflows"
version = "3.0.0"
description = "Immutable workflow graphs and actor-scoped execution"
keywords = ["workflows", "automation", "orchestration"]
dependencies = ["angee-base>=3,<4", "angee-iam>=3,<4", "angee-jobs>=3,<4", "angee-resources>=3,<4", "angee-graphql>=3,<4", "angee-decisions>=3,<4", "angee-provenance>=3,<4", "angee-timeline>=3,<4", "angee-web>=3,<4", "django-compose>=0.1.0.dev1,<0.2"]

[project.entry-points]
"angee.addons" = {"angee.workflows" = "angee.workflows"}

[tool.angee]

[tool.angee.platform]
category = "Workflows"

[tool.hatch.metadata]
allow-direct-references = true
