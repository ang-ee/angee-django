build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-integrate-iphone"
version = "3.0.0"
description = "Dependency-free reader for unencrypted Apple-device backups"
keywords = ["apple", "iphone", "backup"]
dependencies = ["django-angee>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.integrate_iphone" = "angee.integrate_iphone"}

[tool.angee]
category = "Integration"
