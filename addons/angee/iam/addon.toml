# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.iam"
description = "Identity, the swappable user model, and the REBAC permission hub"
keywords = ["identity", "rebac", "auth"]
category = "Foundation"
depends_on = ["angee.resources", "angee.graphql", "axes", "django.contrib.auth", "django.contrib.sessions"]
dependencies = [
  "django-axes>=8.0",
]

[[migrations]]
name = "normalize_person_emails"
app_label = "iam"
module = "runtime_migrations.normalize_person_emails"
# The released body raised in applies() on a new stack's history; its copies stay valid.
compatible_source_sha256 = ["7da79f37fc8a1b17f705391aa1921ab7f1c129b356d54fe3a4625dff920d66ea"]

[resources]
demo = [
  { path = "resources/demo/010_iam.user.yaml", adopt = "username" },
  { path = "resources/demo/030_iam.admin_grant.yaml", kind = "grants" },
]
