build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-theme-carbon"
version = "3.0.0"
description = "A crisp, square-edged enterprise theme for Angee"
keywords = ["theme", "appearance", "carbon"]
dependencies = ["angee-web>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.theme_carbon" = "angee.theme_carbon"}

[tool.angee]
category = "User interface"
