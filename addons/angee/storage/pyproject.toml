build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-storage"
version = "3.0.0"
description = "Drives, folders, and content-addressed files with chunked uploads"
keywords = ["storage", "files", "drives"]
dependencies = ["angee-base>=3,<4", "angee-iam>=3,<4", "angee-resources>=3,<4", "angee-graphql>=3,<4", "angee-tags>=3,<4", "angee-provenance>=3,<4", "angee-web>=3,<4", "python-magic>=0.4.27"]

[project.entry-points]
"angee.addons" = {"angee.storage" = "angee.storage"}

[tool.angee]
category = "Data"

[[tool.angee.resources.master]]
path = "master/010_storage.mimetype.yaml"
adopt = "mime_type"

[[tool.angee.resources.install]]
path = "install/010_storage.backend.yaml"
adopt = "slug"

[[tool.angee.resources.install]]
path = "install/020_storage.drive.yaml"
adopt = "slug"
