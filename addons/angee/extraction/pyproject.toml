build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-extraction"
version = "3.0.0"
description = "Immutable document evidence, profiles, and inference"
keywords = ["extraction", "documents", "evidence"]
dependencies = ["angee-base>=3,<4", "angee-decisions>=3,<4", "angee-agents>=3,<4", "angee-storage>=3,<4", "angee-messaging>=3,<4", "angee-graphql>=3,<4", "angee-provenance>=3,<4", "jsonpointer>=3.1", "pypdfium2>=4.30", "pillow>=11.0", "django-angee>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.extraction" = "angee.extraction"}

[tool.angee]
category = "Data"
