# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.messaging"
description = "Threads, messages, and channel bridges that ingest and deliver mail and social conversations"
keywords = ["messaging", "channels", "chat"]
category = "Data"
# django.contrib.postgres backs the Fragment full-text SearchVectorField/GinIndex.
depends_on = ["angee.iam", "angee.parties", "angee.integrate", "angee.resources", "angee.storage", "angee.tags", "django.contrib.contenttypes", "django.contrib.postgres"]
dependencies = [
  "django-anymail>=15.1",
]

[resources]
master = [{ path = "resources/master/010_messaging.activitytype.yaml", adopt = "key" }]

[[migrations]]
name = "follower_party"
app_label = "messaging"
module = "runtime_migrations.follower_party"

[[migrations]]
name = "notification_read_at"
app_label = "messaging"
module = "runtime_migrations.notification_read_at"

[[migrations]]
name = "owner_column"
app_label = "messaging"
module = "runtime_migrations.owner_column"

[[migrations]]
name = "channel_ownerless"
app_label = "messaging"
module = "runtime_migrations.channel_ownerless"

[[migrations]]
name = "activity_type_key"
app_label = "messaging"
module = "runtime_migrations.activity_type_key"

[[migrations]]
name = "channel_sync_status"
app_label = "messaging"
module = "runtime_migrations.channel_sync_status"

[[migrations]]
name = "message_trash"
app_label = "messaging"
module = "runtime_migrations.message_trash"
