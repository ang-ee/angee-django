# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.messaging"
description = "Threads, messages, and channel bridges that ingest and deliver mail and social conversations"
keywords = ["messaging", "channels", "chat"]
category = "Data"
# django.contrib.postgres backs the Fragment full-text SearchVectorField/GinIndex.
depends_on = ["angee.timeline", "angee.provenance", "angee.iam", "angee.parties", "angee.integrate", "angee.resources", "angee.storage", "angee.tags", "django.contrib.contenttypes", "django.contrib.postgres"]
dependencies = [
  "django-anymail>=15.1",
  # Classify Anymail's chained HTTP-ESP transport failures (email delivery).
  "requests>=2.32",
  "urllib3>=2.2",
]

[[migrations]]
name = "retire_creation_keys"
app_label = "messaging"
module = "runtime_migrations.retire_creation_keys"

[resources]
install = [
  { path = "resources/install/030_provenance.rule.yaml", adopt = "key" },
  { path = "resources/install/040_source_identity_grants.yaml", kind = "grants", depends_on = ["resources/install/030_provenance.rule.yaml"] },
]
master = []
# Activity types moved to angee.projects. On a stack without it, the drop guard lets
# the catalog rows messaging's resource files seeded go with the removed model.
retired_models = ["messaging.ActivityType"]
