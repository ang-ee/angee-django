# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.mcp"
description = "An MCP server at /mcp — exposes addon tools to agents over authenticated StreamableHTTP"
keywords = ["mcp", "tools"]
category = "Agents"
depends_on = ["angee.base", "angee.iam", "angee.provenance"]
dependencies = [
  "fastmcp>=3.4.7,<4",
  "mcp>=1.2",
]

[mcp]
tools = "mcp_tools.register"
