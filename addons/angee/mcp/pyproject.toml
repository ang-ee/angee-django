build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-mcp"
version = "3.0.0"
description = "An MCP server at /mcp — exposes addon tools to agents over authenticated StreamableHTTP"
keywords = ["mcp", "tools"]
dependencies = ["angee-base>=3,<4", "angee-iam>=3,<4", "angee-provenance>=3,<4", "fastmcp>=3.4.7,<4", "mcp>=1.2", "angee-server>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.mcp" = "angee.mcp"}

[tool.angee]

[tool.angee.platform]
category = "Agents"
