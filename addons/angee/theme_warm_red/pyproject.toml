build-system = { requires = ["hatch-angee>=1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-theme-warm-red"
version = "3.0.0"
description = "A warm red visual theme for Angee"
keywords = ["theme", "appearance", "red"]
dependencies = ["angee-web>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.theme_warm_red" = "angee.theme_warm_red"}

[tool.angee]
category = "User interface"
