# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "angee.platform"
description = "The admin console — schema/addon explorer, the marketplace board, and contributed sections"
keywords = ["console", "admin", "explorer"]
category = "Platform"
depends_on = ["angee.base", "angee.iam", "angee.resources", "angee.web"]
dependencies = [
  # Comment/format-preserving YAML round-trip: the AddonInstaller's settings.yaml
  # INSTALLED_APPS install/disable edit (pyyaml round-trips lose comments/layout).
  "ruamel.yaml>=0.18",
]
