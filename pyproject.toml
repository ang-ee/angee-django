angee-theme-carbon = {workspace = true}
angee-theme-fyltr = {workspace = true}
angee-theme-ledger = {workspace = true}
angee-theme-midnight = {workspace = true}
angee-theme-stock = {workspace = true}
angee-theme-warm-red = {workspace = true}
angee-timeline = {workspace = true}
angee-uom = {workspace = true}
angee-web = {workspace = true}
angee-work = {workspace = true}
angee-workflows = {workspace = true}
angee-workflows-agents = {workspace = true}
angee-workflows-extraction = {workspace = true}
angee-workflows-integrate = {workspace = true}
angee-workflows-messaging = {workspace = true}
angee-workflows-parties = {workspace = true}
angee-workflows-posts = {workspace = true}
example-notes = {workspace = true}
