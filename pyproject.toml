[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "LICENSE", "LICENSE.GPL"]

[tool.pytest.ini_options]
markers = ["shared_inputs: reads inputs across the composed host or repository"]
cache_dir = ".pytest_cache"
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "src/angee/resources/tests"]
pythonpath = ["src", "examples/src", "."]
addopts = "-ra --strict-markers --import-mode=importlib -p no:randomly"

[tool.ruff]
line-length = 120
target-version = "py314"
cache-dir = ".ruff_cache"
src = ["src", "examples/src"]
exclude = [
  ".angee",
  ".git",
  ".mypy_cache",
  ".reference",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "node_modules",
  # Generated runtime is emitted output, not source: concrete models and
  # Django-authored migrations live here. The composer owns its shape; lint
  # the abstract sources instead.
  "**/runtime",
  # Addon test hosts (angee.base.testing.host) are emitted output too.
  ".test-hosts",
  # Materialized addon migration sources are pinned by digest and immutable.
  # Addon migration templates (compose_migrations/) are source and stay checked.
  "**/runtime_migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

# Import boundaries, checked by `lint-imports`. Imports inside functions and
# TYPE_CHECKING blocks count; `ignore_imports` names each admitted importer.
[tool.importlinter]
root_packages = ["angee", "django_compose", "rebac"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Base serving entrypoints stay vendor-free"
type = "forbidden"
as_packages = false
source_modules = ["angee.base", "angee.base.conf", "angee.base.addons", "angee.server"]
forbidden_modules = [
  "anthropic", "anymail", "authlib", "axes", "channels_redis", "croniter", "cryptg", "dateutil", "discord",
  "fastmcp", "httpcore", "httpcore2", "httpx", "httpx2", "imapclient", "import_export", "jwt", "magic",
  "mailparser_reply", "markdown_it", "mcp", "neonize", "openai", "phonenumbers", "pydantic", "pydantic_ai",
  "qrcode", "ruamel", "slack_sdk", "strawberry", "strawberry_django", "strawberry_django_aggregates",
  "strawberry_django_hasura", "tablib", "telethon", "vobject",
]

[[tool.importlinter.contracts]]
name = "GraphQL wire contracts stay projection-free"
type = "forbidden"
as_packages = false
source_modules = ["angee.graphql", "angee.graphql.data", "angee.graphql.data.contracts"]
forbidden_modules = [
  "angee.graphql.data.metadata", "angee.graphql.data.resource_fields", "angee.graphql.data.hasura",
  "angee.money", "angee.money.**", "strawberry",
]

[[tool.importlinter.contracts]]
name = "Record pointers reach only the identity model contract"
type = "forbidden"
as_packages = false
source_modules = ["angee.base", "angee.base.refs", "angee.base.models", "angee.base.models.identity"]
forbidden_modules = ["angee.base.models.**"]
ignore_imports = ["angee.base.refs -> angee.base.models.identity"]

[[tool.importlinter.contracts]]
name = "Integrate does not import workflows"
type = "forbidden"
source_modules = ["angee.integrate"]
forbidden_modules = [
  "angee.workflows", "angee.workflows_agents", "angee.workflows_extraction", "angee.workflows_integrate",
  "angee.workflows_messaging", "angee.workflows_parties", "angee.workflows_posts",
]

[[tool.importlinter.contracts]]
name = "Checklists do not import workflows"
type = "forbidden"
source_modules = ["angee.checklists"]
forbidden_modules = [
  "angee.workflows", "angee.workflows_agents", "angee.workflows_extraction", "angee.workflows_integrate",
  "angee.workflows_messaging", "angee.workflows_parties", "angee.workflows_posts",
]

[[tool.importlinter.contracts]]
name = "Web forms and messaging meet only in their bridge"
type = "forbidden"
source_modules = ["angee.messaging", "angee.intake"]
forbidden_modules = ["angee.webforms", "angee.webforms_messaging"]

[[tool.importlinter.contracts]]
name = "Messaging does not import message templates"
type = "forbidden"
source_modules = ["angee.messaging"]
forbidden_modules = ["angee.messaging_templates"]

[[tool.importlinter.contracts]]
name = "Web forms do not import messaging, intake or the bridge"
type = "forbidden"
source_modules = ["angee.webforms"]
forbidden_modules = ["angee.messaging", "angee.intake", "angee.webforms_messaging"]
ignore_imports = [
  # The bare test host has one concrete model per app label, so a donor that extends webforms.Form can be
  # folded only into that module's Form; this one edge is the fold, and nothing wider is excused.
  "angee.webforms.testing.models -> angee.webforms_messaging.models",
]

[[tool.importlinter.contracts]]
name = "OAuth and its vendor presets do not import the login addon"
type = "forbidden"
source_modules = ["angee.integrate", "angee.integrate_google"]
forbidden_modules = ["angee.iam_integrate_oidc"]

[[tool.importlinter.contracts]]
name = "IAM does not import its emailed sign-in"
type = "forbidden"
source_modules = ["angee.iam"]
forbidden_modules = ["angee.iam_messaging"]

[[tool.importlinter.contracts]]
name = "Serving modules never import build owners"
type = "forbidden"
as_packages = false
allow_indirect_imports = true
source_modules = ["angee.**"]
forbidden_modules = [
  "angee.*.build", "angee.base.typing", "angee.provenance.typing",
  "django_compose.build", "django_compose.model_composition", "django_compose.rendering",
]
ignore_imports = [
  "angee.*.build -> django_compose.**",
  "angee.base.testing.permissions -> angee.base.build",
  "angee.base.testing.permissions -> django_compose.**",
  "angee.graphql.sdl -> django_compose.model_composition",  # TYPE_CHECKING only
]

[[tool.importlinter.contracts]]
name = "Foundation stays below every capability addon"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["angee.base"]
forbidden_modules = ["angee.*"]

[[tool.importlinter.contracts]]
name = "Production sources do not import test support"
type = "forbidden"
as_packages = false
allow_indirect_imports = true
source_modules = ["angee.**"]
forbidden_modules = ["tests", "angee.*.testing", "angee.*.testing.**", "html5lib"]
ignore_imports = [
  "angee.*.tests.** -> angee.*.testing",
  "angee.*.tests.** -> angee.*.testing.**",
  "angee.*.tests.** -> tests",
  "angee.*.testing -> angee.*.testing.**",
  "angee.*.testing.** -> angee.*.testing",
  "angee.*.testing.** -> angee.*.testing.**",
]

[[tool.importlinter.contracts]]
name = "Addon app configs do not subclass the foundation config"
type = "forbidden"
as_packages = false
allow_indirect_imports = true
source_modules = ["angee.*.apps"]
forbidden_modules = ["angee.base.apps"]

[tool.mypy]
plugins = ["angee.base.typing", "angee.provenance.typing"]
python_version = "3.14"
cache_dir = ".mypy_cache"
explicit_package_bases = true
files = ["src/angee"]
ignore_missing_imports = true
mypy_path = ["src", ".mypy_cache"]
warn_unused_ignores = true
# Materialized addon migrations are digest-pinned executable artifacts, like the
# Ruff boundary above; integrity and execution tests validate their bodies.
# Addon migration templates (compose_migrations/) are typed source and checked.
exclude = ["(^|/)runtime_migrations/"]

[[tool.mypy.overrides]]
module = ["simple_history.*", "django_sqids.*"]
# Historical runtime classes inherit native bases from these unmarked packages.
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["*.runtime_migrations.*"]
# Integrity tests still import typed Migration contracts. Preserve those types
# and caller diagnostics without re-checking immutable historical source bodies.
follow_imports = "silent"

[tool.vulture]
paths = ["src/angee", "examples/src", "tests"]
exclude = [
  "*/runtime/*",
]
ignore_names = [
  "*_table",
  "*_tables",
]
min_confidence = 80

[tool.django-stubs]
django_settings_module = "tests.typing_settings"
