[build-system]
requires = [
  # hatch-angee supports older hatchling releases, but PEP 639 license-files
  # metadata requires hatchling 1.27 or newer.
  "hatchling>=1.27",
  "hatch-angee>=0.2.3",
]
build-backend = "hatch_angee.build"

[project]
name = "django-angee"
version = "0.2.0"
description = "Thin Django composition primitives for Angee applications."
readme = "README.md"
authors = [{ name = "Alexis Yushin", email = "alexis@apexive.com" }]
keywords = ["addons", "agentic-applications", "asgi", "composition", "django"]
# PEP 639 deprecates License classifiers when `license` is an SPDX expression;
# the expression below is the single machine-readable owner of license identity.
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
# LGPLv3 is drafted as additional permissions on top of GPLv3, so both texts ship:
# LICENSE is the Lesser additional permissions, LICENSE.GPL the GPLv3 they extend.
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.GPL"]
requires-python = ">=3.14"
# `dynamic = ["entry-points"]` and the build hooks are injected by the hatch-angee
# build backend (build-backend above) — see [tool.hatch-angee] below.
dependencies = [
  "celery[redis]>=5.5",
  "channels>=4.0",
  "cryptography>=44",
  "django-reversion>=5.1",
  "django-simple-history>=3.7",
  "django-sqids>=0.1",
  "django-zed-rebac>=0.15.2",
  # <6.1: Django 6.1 adds fetch_mode to Model.from_db and django-zed-rebac's
  # override does not accept it yet; lift the cap when rebac supports 6.1.
  "django>=6.0,<6.1",
  "hatch-angee>=0.2.3",
  "django-choices-field>=4.0.0",
  "django-yamlconf>=1.5.0",
  "django-environ>=0.12",
  # ASGI server: serves the composed app and addon-contributed channels WebSocket
  # and HTTP mounts. uvicorn sends the ASGI lifespan that runs mount lifespans;
  # [standard] adds WebSocket and --reload support for dev.
  "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/ang-ee/angee-django"
Documentation = "https://docs.angee.ai"
Changelog = "https://github.com/ang-ee/angee-django/blob/main/CHANGELOG.md"
Issues = "https://github.com/ang-ee/angee-django/issues"

[project.optional-dependencies]
# Wheel extras are reserved for core-owned deployment variants. Addon-owned
# dependencies come from each composed addon's addon.toml and are projected by
# `manage.py angee build` into the host's generated dependency group.

# Postgres driver only — installed by the runtime image's `--extra postgres` and by
# the self-contained local stack. psycopg 3 is the driver Django 6's
# django.db.backends.postgresql uses when DATABASE_URL points at Postgres (the
# stack env supplies the URL; angee/compose/settings.py maps it, SQLite floor
# otherwise).
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
  # Test-only: channels.testing imports daphne (ChannelsLiveServerTestCase). It is
  # not a runtime dependency — Angee serves with uvicorn (see [project.dependencies]).
  "daphne>=4.0",
  "faker>=30.0",
  # Source-addon tests import django.contrib.postgres field types even when the
  # test database is SQLite; the former base wrapper selected the core extra.
  "psycopg[binary]>=3.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-django>=4.8",
  "ruff>=0.15.12",
  "vulture>=2.16",
]

# GENERATED by angee build from the enabled addons' manifests — do not edit
addons = [
    "anthropic>=0.109.2",
    "authlib>=1.7.2",
    "channels-redis>=4.2",
    "channels>=4.0",
    "croniter>=6.0",
    "django-anymail>=15.1",
    "django-axes>=8.0",
    "django-import-export>=4.3",
    "django-zed-rebac[strawberry-django]>=0.15.2",
    "fastmcp>=3.4.2,<4",
    "httpcore>=1.0,<2",
    "httpx>=0.28.1,<0.29",
    "imapclient>=3.1.0",
    "mail-parser-reply>=1.36",
    "markdown-it-py>=4.2",
    "mcp>=1.2",
    "openai>=2.43.0",
    "phonenumbers>=9.0",
    "pydantic-ai-slim>=2.13",
    "pydantic-ai-slim[anthropic]>=2.13",
    "pydantic-ai-slim[mcp]>=2.13",
    "pydantic-ai-slim[openai]>=2.13",
    "pydantic>=2.13",
    "pyjwt[crypto]>=2.12",
    "python-dateutil>=2.9",
    "python-magic>=0.4.27",
    "pyyaml>=6",
    "qrcode[pil]>=8.2",
    "ruamel.yaml>=0.18",
    "slack-sdk>=3.43.0",
    "strawberry-django-aggregates>=0.11.0",
    "strawberry-django-hasura>=0.9.0",
    "strawberry-graphql @ git+https://github.com/ang-ee/strawberry.git@e4fa3198f704d81b3ca96b6dcac75420c5fee516",
    "strawberry-graphql-django>=0.86.7",
    "tablib>=3",
    "vobject>=0.9.9",
]

[tool.uv]
default-groups = ["dev", "addons"]

# No [tool.uv] cache-dir here: a CWD-relative cache-dir mints a stray
# `.angee/caches/uv` wherever uv runs (slots, worktrees, the stack root under
# --project). The rendered stack host pins its own stack-owned cache; every
# other invocation uses uv's default per-user cache.

[tool.hatch-angee]
# This repository publishes the framework core only. Folder addons remain
# in-repo source content and must never generate wheel seams or entry points.
addon-discovery = []

[tool.hatch.build.targets.wheel]
# The distribution contains the framework core only. Folder addons are provided
# by sibling source repositories and discovered from explicit addon directories.
packages = ["angee"]
dev-mode-dirs = ["."]
artifacts = [
  "angee/**/*.csv",
  "angee/**/*.pyi",
  "angee/**/*.typed",
  "angee/**/*.yaml",
  "angee/**/*.zed",
]
# The web/ sources are added by hatch-angee's addon-sources hook (the single source
# of truth for them), so keep hatchling's default walk out of them — otherwise a
# package the walk *does* pick up would be added twice. node_modules is never a
# Python package, so this also drops the dependency tree the broad artifacts above
# would otherwise force-include from web/*/node_modules.
exclude = [
  "**/node_modules",
]

# Build machinery is hatch-angee, via its build backend (no per-repo hook code or
# tables). The framework's shared React packages live in the angee-react repo
# and are consumed through the stack's pnpm workspace, not this wheel.

[tool.hatch.build.targets.sdist]
only-include = [
  "AGENTS.md",
  "CHANGELOG.md",
  "LICENSE",
  "LICENSE.GPL",
  "README.md",
  "angee",
  "docs",
  "pyproject.toml",
  "tests",
  "uv.lock",
]

[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "addons/angee/resources/tests"]
pythonpath = [".", "addons", "examples/addons"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py314"
cache-dir = ".ruff_cache"
src = [".", "addons", "examples/addons"]
exclude = [
  ".angee",
  ".git",
  ".mypy_cache",
  ".reference",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "node_modules",
  # Generated runtime is emitted output, not source: concrete models and
  # Django-authored migrations live here. The composer owns its shape; lint
  # the abstract sources instead.
  "**/runtime",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
cache_dir = ".mypy_cache"
explicit_package_bases = true
files = ["angee", "addons/angee"]
ignore_missing_imports = true
mypy_path = [".", "addons"]
warn_unused_ignores = true

[tool.vulture]
paths = ["angee", "addons/angee", "examples/addons", "tests"]
exclude = [
  "*/runtime/*",
]
ignore_names = [
  "*_table",
  "*_tables",
]
min_confidence = 80
