postgres = ["psycopg[binary,pool]>=3.2"]

[dependency-groups]
dev = [
    "angee-base[testing]==3.0.0",
    "daphne>=4.0",
    "django-zed-rebac[caveats]>=0.38.0,<0.39",
    "faker>=30.0",
    "hypothesis>=6.100",
    "html5lib>=1.1,<2",
    "import-linter>=2.1",
    "grimp>=3.19",
    "iniconfig>=2.3",
    "psycopg[binary,pool]>=3.2",
    "angee-django-stubs[compatible-mypy]==6.1.2.post3",
    "angee-mypy==2.1.0",
    "angee-server[profiling]==3.0.0",
    "pytest>=9",
    "pytest-django>=4.8",
    "pytest-randomly>=3.16",
    "pytest-xdist>=3.6",
    "ruff>=0.15.12",
    "vulture>=2.16",
    "pytest-split>=0.11",
    "tomlkit>=0.13",
    "example-notes==3.0.0",
    "example-theme==3.0.0",
    "tests-blankchoices==3.0.0",
]


[tool.uv]
default-groups = ["dev"]

# No [tool.uv] cache-dir here: a CWD-relative cache-dir mints a stray
# `.angee/caches/uv` wherever uv runs (slots, worktrees, the stack root under
# --project). The rendered stack host pins its own stack-owned cache; every
# other invocation uses uv's default per-user cache.

[tool.uv.workspace]
members = ["src/angee/*", "examples/src/example/*", "tests/blankchoices"]

