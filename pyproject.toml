hatch-angee = {workspace = true}
tests-blankchoices = {workspace = true}
django-compose = {path = "../django-compose", editable = true}
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "LICENSE", "LICENSE.GPL"]

[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "addons/angee/resources/tests"]
pythonpath = ["addons", "examples/addons", "."]
addopts = "-ra --strict-markers --import-mode=importlib -p no:randomly"

[tool.ruff]
line-length = 120
target-version = "py314"
cache-dir = ".ruff_cache"
src = ["addons", "examples/addons", "tools/hatch-angee/src"]
exclude = [
  ".angee",
  ".git",
  ".mypy_cache",
  ".reference",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "node_modules",
  # Generated runtime is emitted output, not source: concrete models and
  # Django-authored migrations live here. The composer owns its shape; lint
  # the abstract sources instead.
  "**/runtime",
  # Materialized addon migration sources are pinned by digest and immutable.
  "**/runtime_migrations",
  "**/compose_migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
plugins = ["angee.base.typing", "angee.provenance.typing"]
python_version = "3.14"
cache_dir = ".mypy_cache"
explicit_package_bases = true
files = ["addons/angee"]
ignore_missing_imports = true
mypy_path = [".mypy_cache/typing_stubs", "addons", ".mypy_cache"]
warn_unused_ignores = true
# Historical addon migrations are digest-pinned executable artifacts, like the
# Ruff boundary above; integrity and execution tests validate their bodies.
exclude = ["(^|/)(runtime_migrations|compose_migrations)/"]

[[tool.mypy.overrides]]
module = ["*.runtime_migrations.*", "*.compose_migrations.*"]
# Integrity tests still import typed Migration contracts. Preserve those types
# and caller diagnostics without re-checking immutable historical source bodies.
follow_imports = "silent"

[tool.vulture]
paths = ["addons/angee", "examples/addons", "tests"]
exclude = [
  "*/runtime/*",
]
ignore_names = [
  "*_table",
  "*_tables",
]
min_confidence = 80

[tool.django-stubs]
django_settings_module = "tests.typing_settings"
