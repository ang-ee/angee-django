_meta:
  model: workflows.Workflow
rows:
  - xref: note_publish
    fields:
      key: note-publish
      name: Note publication
      description: Validate and publish a ready note.
      subject_model: notes.note
      publish: true
      draft:
        nodes:
          validate:
            step: note_validate_publication
            # Human review belongs between these nodes once the decisions layer lands.
            next: {needs_review: publish}
          publish:
            step: note_publish
        results:
          - {from: publish}
