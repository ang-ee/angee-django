_meta:
  model: workflows.Step
rows:
  - xref: note_publish_entry
    fields:
      workflow: notes.note_publish_approval
      key: entry
      name: Validate note
      step_class: note_validate_publication
      config: {}
      is_entry: true
      position:
        x: 0
        y: 0
  - xref: note_publish_gate
    fields:
      workflow: notes.note_publish_approval
      key: approval
      name: Approval gate
      step_class: gate
      config:
        policy: one_done
        action: approve-note-publish
        slots:
          - assignee: angee/role:admin#member
        decision_schema:
          type: object
          required: [action]
          properties:
            action:
              type: string
              enum: [approve, reject, escalate]
              options:
                - {value: approve, label: Publish note, verdict: COMPLETE}
                - {value: reject, label: Reject publication, verdict: REJECT}
                - {value: escalate, label: Escalate review, verdict: ESCALATE}
          oneOf:
            - type: object
              required: [action]
              properties: {action: {const: approve}}
              additionalProperties: false
            - type: object
              required: [action]
              properties: {action: {const: reject}}
              additionalProperties: false
            - type: object
              required: [action]
              properties: {action: {const: escalate}}
              additionalProperties: false
      join_rule: all_success
      is_entry: false
      position:
        x: 280
        y: 0
  - xref: note_publish_finalize
    fields:
      workflow: notes.note_publish_approval
      key: finalize
      name: Publish note
      step_class: note_publish
      config: {}
      join_rule: all_success
      is_entry: false
      position:
        x: 560
        y: 0
