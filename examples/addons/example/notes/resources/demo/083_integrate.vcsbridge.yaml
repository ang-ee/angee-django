# The local-template VCS bridge. `config.local_root` is resolved against BASE_DIR
# (the stack root) by LocalVCSBackend; the angee-templates source cache is the
# checkout where templates/ lives.
- xref: vcs_local_templates
  owner: iam.user_admin
  vendor: notes.vendor_local
  backend_class: local
  credential: notes.cred_local_templates
  lifecycle: connected
  config:
    local_root: "sources/angee-templates"
    local_name: angee-templates
