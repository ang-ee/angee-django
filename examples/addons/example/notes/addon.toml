# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see hatch-angee's native AddonManifest.
[addon]
name = "example.notes"
description = "A notes example — the minimal consumer addon the example project composes"
keywords = ["notes", "example"]
category = "Example"
depends_on = ["angee.iam", "angee.integrate", "angee.iam_integrate_oidc", "angee.agents", "angee.agents_integrate_anthropic", "angee.mcp", "angee.messaging", "angee.decisions", "angee.workflows"]
dependencies = ["faker>=30.0"]

[resources]
master = [
  { path = "resources/master/010_integrate.vendor.yaml", adopt = "slug" },
  { path = "resources/master/081_integrate.vendor.yaml", adopt = "slug" },
]
demo = [
  { path = "resources/demo/020_notes.note.yaml", depends_on = "iam:resources/demo/010_iam.user.yaml" },
  { path = "resources/demo/080_integrate.credential.yaml", depends_on = "iam:resources/demo/010_iam.user.yaml", adopt = ["user", "name"] },
  { path = "resources/demo/083_integrate_vcs.vcsbridge.yaml", depends_on = ["resources/demo/080_integrate.credential.yaml", "resources/master/081_integrate.vendor.yaml"] },
  { path = "resources/demo/084_integrate_vcs.repository.yaml", depends_on = "resources/demo/083_integrate_vcs.vcsbridge.yaml", adopt = ["vcs_bridge", "name"] },
  { path = "resources/demo/085_integrate_vcs.source.yaml", depends_on = "resources/demo/084_integrate_vcs.repository.yaml" },
  { path = "resources/demo/094_integrate_vcs.template.yaml", depends_on = "resources/demo/085_integrate_vcs.source.yaml", adopt = ["source", "path"] },
  { path = "resources/demo/095_agents.agent.yaml", depends_on = ["resources/demo/094_integrate_vcs.template.yaml", "agents:resources/demo/020_agents.mcpserver.yaml", "agents_integrate_anthropic:resources/demo/040_agents.inferencemodel.yaml"] },
  { path = "resources/demo/100_workflows.workflow.yaml", adopt = "key" },
  { path = "resources/demo/110_workflows.trigger.yaml", depends_on = "resources/demo/100_workflows.workflow.yaml" },
]

[[migrations]]
name = "owner_column"
app_label = "notes"
module = "runtime_migrations.owner_column"
