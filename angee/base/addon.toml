# Angee addon manifest. The declarative contract hatch-angee compiles into
# the package's [project] + entry points; see angee/addons.py (AddonContract).
[addon]
name = "angee.base"
description = "The model toolkit every addon builds on — abstract models, mixins, fields, and REBAC-aware managers"
keywords = ["models", "toolkit", "orm"]
category = "Foundation"
depends_on = ["angee.compose", "django.contrib.contenttypes", "rebac", "reversion", "simple_history"]
dependencies = [
  "cryptography>=44",
  "django-choices-field>=4.0.0",
  "django-reversion>=5.1",
  "django-simple-history>=3.7",
  "django-sqids>=0.1",
  "django-zed-rebac[strawberry-django]>=0.14",
]
