[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hatch-angee"
version = "1.0.1"
description = "Hatchling layout defaults for in-place Angee addon distributions."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Angee, Inc.", email = "hi@angee.ai" }]
keywords = ["hatch", "hatchling", "build", "plugin", "angee", "addons"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Hatch",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["hatchling>=1.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "angee-mypy==2.1.0",
    "editables>=0.3",
]

[project.urls]
Homepage = "https://github.com/ang-ee/hatch-angee"
Issues = "https://github.com/ang-ee/hatch-angee/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hatch_angee"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["build/", "dist/"]

# hatchling ships no type information for its plugin interfaces.
[[tool.mypy.overrides]]
module = ["hatchling.*"]
ignore_missing_imports = true

# Tests build throwaway addon trees and assert on them; the per-test
# annotation ceremony adds churn without catching bugs. Keep value checks on.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
