[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.14"
strict = true
cache_dir = ".test-db/mypy-provenance-engine"
explicit_package_bases = true
mypy_path = ["src"]

[tool.django-stubs]
django_settings_module = "tests.provenance_engine.settings"

[[tool.mypy.overrides]]
module = ["simple_history.*", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "angee.provenance.history",
    "angee.provenance.engine.statements",
]
allow_subclassing_any = true
