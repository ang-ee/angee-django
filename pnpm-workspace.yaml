packages:
  # The shared React libraries live in the sibling angee-react checkout
  # (sources/<name> stack layout); this workspace links them cross-root, the
  # accepted stack-layout-relative pattern. The addon web fragments and the
  # example host stay in-repo.
  - "../angee-react/app"
  - "../angee-react/ui"
  - "../angee-react/refine"
  - "../angee-react/metadata"
  - "../angee-react/e2e"
  - "../angee-base/addons/angee/*/web"
  - "../angee-messaging-bridges/addons/angee/*/web"
  - "examples/*/e2e"
  - "examples/*/web"
  - "../angee-examples/addons/*/*/web"
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true
