_min_copier_version: "9.0"
_subdirectory: template
_templates_suffix: .jinja
# The stack overlays into the project root (ANGEE_ROOT=.), but the PROJECT owns the
# canonical .copier-answers.yml (rendered by the chained projects/web). The stack
# keeps its OWN answers file so it never clobbers the project's.
_answers_file: .copier-answers.stack.yml
_preserve_symlinks: true

_message_after_copy: |
  Framework-dev stack rendered — the root folder IS the stack and a project host
  (ANGEE_ROOT=.). Runtime mode: "{{ runtime_mode }}".

  - process (default): Django, Celery, Vite, and Storybook run as local processes;
    {% if postgres_mode == "external" or redis_mode == "external" %}bundled Postgres and Redis run as containers with published ports; external ones are servers this stack does not run.{% else %}Postgres and Redis run as containers with published ports.{% endif %}
  - docker: Django, Celery, Vite, Storybook, Playwright{% if postgres_mode == "external" %}{% else %}, Postgres{% endif %}{% if redis_mode == "external" %}{% else %}, and Redis{% endif %} run as
    containers; the operator daemon remains host-local and orchestrates Docker.{% if postgres_mode == "external" %} PostgreSQL: {{ postgres_host }}:{{ postgres_port }}/{{ postgres_db }} as {{ postgres_user }} (set db-password to that role's password).{% endif %}{% if redis_mode == "external" %} Redis: {{ redis_host }}:{{ redis_port }} (databases {{ redis_db }} and {{ redis_broker_db }}).{% endif %}

  1. Bring it up. `angee dev` materializes the declared source caches, cuts the
     `src` workspace (the consolidated framework plus optional external addon
     worktrees), runs the dependency/provision/codegen lifecycle, and boots:
       angee dev
  2. Point an external CLI shell at the tokenized local operator (run from this
     root; `angee secret reveal` reads the stack's secrets backend):
       export ANGEE_OPERATOR_URL=http://127.0.0.1:{{ operator_port }}
       export ANGEE_OPERATOR_TOKEN="$(angee secret reveal operator-token)"

  App (process): http://localhost:{{ ui_port }}
  {% if ingress_domain == "localhost" %}
  App (docker):  http://<host>:{{ ui_port }}
  Playwright MCP (docker): http://localhost:{{ edge_port }}/playwright-mcp/mcp
  Browser server (docker): ws://localhost:{{ edge_port }}/playwright-server/
  {% else %}
  UX (docker): https://{{ ingress_domain }}/
  Agents: wss://{{ ingress_domain }}/<service>/
  Playwright MCP (docker): https://{{ ingress_domain }}/playwright-mcp/mcp
  Browser server route (docker): https://{{ ingress_domain }}/playwright-server/
  Browser WebSocket clients use wss://{{ ingress_domain }}/playwright-server/.
  {% endif %}
  The Playwright endpoints are edge-routed with forward-auth; mint a route token
  via `angee token` before connecting.

  Frame: the framework source lives in workspaces/src/angee/ — see its AGENTS.md.

_angee:
  schema: 1
  kind: stack
  name: dev
  include_root: "../.."  # pins templates/ in chain snapshots, so ../../_shared/ includes resolve
  description: >-
    The framework-dev stack: the root folder IS the stack AND the project host
    (ANGEE_ROOT=.). It chains the `projects/web` project template to scaffold
    the host (manage.py, settings.yaml, pyproject, addons, web), then overlays a
    process- or Docker-mode manifest against the framework source slot and the
    optional external slots its `src` workspace materializes under
    workspaces/src/. `angee dev` owns the whole bring-up: caches, the src
    workspace cut, dependency installation, provision/codegen, and boot.
    PostgreSQL and Redis are bundled as per-stack containers by default;
    `postgres_mode: external` and `redis_mode: external` point the stack at
    servers it does not run.
  inputs:
    operator_image:
      type: str
      default: "ghcr.io/ang-ee/angee-operator:latest"
      help: Operator daemon image for Docker-mode stacks (the daemon runs as a container over the docker socket).
    runtime_mode:
      type: str
      default: process
      choices: [process, docker]
      help: Run framework application services as local processes or Docker containers.
    serve_mode:
      type: str
      default: development
      choices: [development, production]
      validator: '{% if serve_mode == "production" and runtime_mode == "process" %}Production serving requires runtime_mode: docker.{% endif %}'
      help: Serve with live reload or with multiple Django workers and a built SPA.
    serve_workers:
      type: int
      default: 0
      validator: '{% if serve_workers != 0 and serve_workers < 2 %}Use 0 for CPU count or at least 2 workers.{% endif %}'
      help: Django ASGI worker count in production mode; 0 uses CPU count (minimum 2).
    db_pool_max_size:
      type: int
      default: 2
      validator: '{% if db_pool_max_size < 1 %}Pool size must be positive.{% endif %}'
      help: Maximum PostgreSQL connections per Django worker in production mode.
    db_pool_timeout:
      type: int
      default: 5
      validator: '{% if db_pool_timeout < 1 %}Pool wait timeout must be positive.{% endif %}'
      help: Seconds a request waits for a free PostgreSQL connection.
    caddy_image:
      type: str
      default: "caddy:2.9-alpine"
      help: Image serving the built SPA in production mode.
    django_image:
      type: str
      default: "ghcr.io/ang-ee/django-angee-base:latest"
      help: Image used by Docker-mode Django and Celery services.
    node_image:
      type: str
      default: "node:22-bookworm-slim"
      help: Image used by Docker-mode frontend and Storybook services.
    playwright_image:
      type: str
      default: "mcr.microsoft.com/playwright:v1.62.1-noble"
      help: Playwright browser-server image pinned to the @angee/e2e lock version.
    playwright_mcp_image:
      type: str
      default: "mcr.microsoft.com/playwright/mcp:v0.0.76"
      help: Playwright MCP image pinned to the repo's @playwright/mcp version.
    ingress_domain:
      type: str
      default: localhost
      help: Public DNS name serves the UX through the Caddy edge at https://<name> with automatic Let's Encrypt TLS on host ports 443/80; localhost keeps plain local HTTP on edge_port.
    ingress_aliases:
      type: str
      default: ""
      help: Comma-separated further public host names the edge serves as the same site as ingress_domain, each with its own certificate (e.g. "ap.example.com,crm.example.com").
  # Chain the project template first so the stack overlays a real host, then this
  # template adds only the stack overlay (angee.yaml, settings/workspace files).
  # The ref is relative to THIS template's directory; downstream it can pin a
  # remote ref, e.g. github.com/ang-ee/angee-django//templates/projects/web?ref=<tag>.
  chain:
    - template: ../../projects/web
      inputs:
        project_name: "${inputs.project_name}"
        web_path: "${inputs.web_path}"
        addon_namespace: "${inputs.addon_namespace}"
        addon_installer_backend: operator
        include_operator_installer: true
        addons_profile: "${inputs.addons_profile}"
        include_arp: "${inputs.include_arp}"
        framework_workspace: true
        appearance_theme_id: "${inputs.appearance_theme_id}"
        appearance_color_scheme: "${inputs.appearance_color_scheme}"
        appearance_options: "${inputs.appearance_options}"
        # The rendered pyproject resolves django-angee editable from the same
        # slot the stack's processes run, so `uv run manage.py` works bare from
        # the stack root with no --project flag.
        framework_source_path: "${inputs.framework_path}"

project_name:
  type: str
  default: app
  help: >-
    Machine name of the project host; also the chained project's name and the
    namespace of every workspace branch this stack cuts (`<project_name>/<workspace>`).
    Give each stack on a machine or a shared fork its own name.

# Directory + import namespace for this project's own consumer addons (addons/<ns>/,
# referenced in INSTALLED_APPS as <ns>.<app>). Must be a valid Python identifier.
# Copier-go does not evaluate Jinja defaults before chain-input substitution, so
# keep this concrete; override it alongside `project_name` for custom projects.
addon_namespace:
  type: str
  default: app
  help: Import namespace for this project's consumer addons; a valid Python identifier.

project_path:
  type: path
  default: "."
  help: Path to the project host root. The project IS the stack root (`.`) — the chained projects/web template renders it there. Absolute paths are accepted and kept as-is for an externally-scaffolded host.

# Machine-wide home for the git source caches, shared by every stack on the
# machine so one clone per repository serves all of them (`<sources_home>/<repo>`).
# A plain string, not a path input: the operator resolves a relative value against
# ANGEE_ROOT and an absolute one verbatim. Empty keeps the classic per-stack
# caches under sources/.
sources_home:
  type: str
  default: ""
  help: Absolute directory holding one shared git cache per repository (e.g. ~/Work/sources, spelled out); empty = per-stack caches under sources/.

framework_path:
  type: path
  default: "workspaces/src/angee"
  help: Path to the consolidated angee source slot — the editable framework checkout the rendered pyproject resolves and the stack's `framework` source points at. Default is the src workspace slot `angee dev` materializes.

web_path:
  type: str
  default: "web"
  help: Path to the project's Vite web package, relative to `project_path`. Its package owns the `dev` and `codegen` scripts for the composed project's generated GraphQL operation types.

runtime_mode:
  type: str
  default: process
  choices: [process, docker]
  help: Run framework application services as local processes or Docker containers.

# PostgreSQL: `bundled` runs a pgvector container per stack; `external` points
# the stack at a server it does not run (no postgres service, port lease, or
# pgdata), and `db-password` becomes a required secret holding postgres_user's
# server password. templates/README.md has the shared-server procedure.
postgres_mode:
  type: str
  default: bundled
  choices: [bundled, external]
  help: Bundled runs this stack's own pgvector container; external connects to a server another owner runs.

# Copier validators are advisory in operator renders; the docker-mode host is guidance.
postgres_host:
  type: str
  default: "127.0.0.1"
  validator: '{% if postgres_mode == "external" and runtime_mode == "docker" %}{% if postgres_host == "127.0.0.1" or postgres_host == "localhost" %}Containers cannot reach a loopback host; use an address they can reach, such as host.docker.internal.{% endif %}{% endif %}'
  help: External only; the server host as this stack's processes or containers reach it (bracket IPv6 literals).

postgres_db:
  type: str
  default: angee
  help: Database name.

postgres_user:
  type: str
  default: angee
  help: Role name; the db-password secret is this role's password.

# Redis: `bundled` runs a Redis container per stack; `external` points the stack
# at a server it does not run (no redis service or port lease). Stacks sharing one
# server need their own redis_db / redis_broker_db pair, or Celery queues collide.
# The rendered URLs carry no password.
redis_mode:
  type: str
  default: bundled
  choices: [bundled, external]
  help: Bundled runs this stack's own Redis container; external connects to a server another owner runs.

redis_host:
  type: str
  default: "127.0.0.1"
  validator: '{% if redis_mode == "external" and runtime_mode == "docker" %}{% if redis_host == "127.0.0.1" or redis_host == "localhost" %}Containers cannot reach a loopback host; use an address they can reach, such as host.docker.internal.{% endif %}{% endif %}'
  help: External only; the server host as this stack's processes or containers reach it (bracket IPv6 literals).

redis_db:
  type: int
  default: 0
  help: Redis database for the cache and the Channels layer.

redis_broker_db:
  type: int
  default: 1
  help: Redis database for the Celery broker; keep it distinct from redis_db.

# Sentry error reporting. An empty DSN (the default) renders nothing: Django
# never starts the SDK and the SPA never loads it. sentry_dsn becomes SENTRY_DSN
# for every Python service; sentry_web_dsn becomes VITE_SENTRY_DSN for the
# frontend dev server and build, so a production SPA picks it up at build time.
sentry_dsn:
  type: str
  default: ""
  help: Sentry DSN for Django, Celery and management commands; empty disables backend error reporting.

sentry_web_dsn:
  type: str
  default: ""
  help: Sentry DSN for the React SPA; empty keeps the browser SDK unloaded.

serve_mode:
  type: str
  default: development
  choices: [development, production]
  validator: '{% if serve_mode == "production" and runtime_mode == "process" %}Production serving requires runtime_mode: docker.{% endif %}'
  help: Serve with live reload or with multiple Django workers and a built SPA.

serve_workers:
  type: int
  default: 0
  validator: '{% if serve_workers != 0 and serve_workers < 2 %}Use 0 for CPU count or at least 2 workers.{% endif %}'
  help: Django ASGI worker count in production mode; 0 uses CPU count (minimum 2).

db_pool_max_size:
  type: int
  default: 2
  validator: '{% if db_pool_max_size < 1 %}Pool size must be positive.{% endif %}'
  help: Maximum PostgreSQL connections per Django worker in production mode.

db_pool_timeout:
  type: int
  default: 5
  validator: '{% if db_pool_timeout < 1 %}Pool wait timeout must be positive.{% endif %}'
  help: Seconds a request waits for a free PostgreSQL connection.

caddy_image:
  type: str
  default: "caddy:2.9-alpine"
  help: Image serving the built SPA in production mode.

django_image:
  type: str
  default: "ghcr.io/ang-ee/django-angee-base:latest"
  help: Image used by Docker-mode Django and Celery services.

node_image:
  type: str
  default: "node:22-bookworm-slim"
  help: Image used by Docker-mode frontend and Storybook services.

playwright_image:
  type: str
  default: "mcr.microsoft.com/playwright:v1.62.1-noble"
  help: Playwright browser-server image pinned to the @angee/e2e lock version.

playwright_mcp_image:
  type: str
  default: "mcr.microsoft.com/playwright/mcp:v0.0.76"
  help: Playwright MCP image pinned to the repo's @playwright/mcp version.

ingress_domain:
  type: str
  default: localhost
  help: Public DNS name serves the UX through the Caddy edge at https://<name> with automatic Let's Encrypt TLS on host ports 443/80; localhost keeps plain local HTTP on edge_port.

ingress_aliases:
  type: str
  default: ""
  help: Comma-separated further public host names the edge serves as the same site as ingress_domain, each with its own certificate (e.g. "ap.example.com,crm.example.com").

# Which addon roster the host composes. `base` renders the consumer scaffold
# (base addons only); `full` renders the whole platform composition — every
# base addon plus the messaging bridges and the notes example — and declares
# the external bridges source repo so the stack materializes it.
addons_profile:
  type: str
  default: base
  choices:
    - base
    - full
  help: Addon roster for the host — base (consumer scaffold) or full (the whole platform composition incl. external bridges + in-tree examples).

appearance_theme_id:
  type: str
  default: angee.stock
  help: Stable ID of the installed host-default theme; empty selects the intrinsic base look.

appearance_color_scheme:
  type: str
  default: system
  choices:
    - system
    - light
    - dark
  help: Host-default color-scheme preference.

appearance_options:
  type: str
  default: ""
  help: Optional JSON object with `version` and `value` for the configured host theme; empty uses the theme defaults.

# Stack source name for the src workspace's private work-state slot. Empty (the
# default) renders no work-state wiring — a clean-machine stack must not depend
# on a private repository. Framework maintainers set this together with
# work_state_repo: the pair declares the git source AND binds it at `.work/`.
work_state_source:
  type: str
  default: ""
  help: Stack source name for the src workspace's private work-state slot; empty = no work-state.

# Location of the private work-state repo backing the `.work/` slot. The source is
# declared only when BOTH work_state_source (the name) and work_state_repo (this
# location) are set; either one empty leaves the stack with no work-state source.
# This is what makes the work-state source template-owned — supply it at init with
# `--input work_state_repo=git@github.com:you/your-work.git` instead of hand-editing
# angee.yaml's sources block after render.
work_state_repo:
  type: str
  default: ""
  help: Git repo URL for the work-state source named by work_state_source; empty = declare no work-state source.

work_state_ref:
  type: str
  default: main
  help: Mainline ref for the work-state source clone.

# Opt-in: arpee, the ARP product (a clean-room Odoo port as arp.* consumer
# addons). Declares the PRIVATE ang-ee/angee-arp repo as a source with its
# workspace slot, addon dir, and web globs — the addons stay out of
# INSTALLED_APPS until installed (the marketplace catalogs and composes them).
include_arp:
  type: bool
  default: false
  help: Declare the private ang-ee/angee-arp source (arpee's arp.* addons) with its slot, addon dir, and web globs.


django_port:
  type: int
  default: 8000

ui_port:
  type: int
  default: 5173

storybook_port:
  type: int
  default: 6006

operator_image:
  type: str
  default: "ghcr.io/ang-ee/angee-operator:latest"
  help: Operator daemon image for Docker-mode stacks (the daemon runs as a container over the docker socket).

operator_port:
  type: int
  default: 9000

postgres_port:
  type: int
  default: 5433
  help: Bundled mode leases this stack's published PostgreSQL port; external mode uses this server port literally.

redis_port:
  type: int
  default: 6379
  help: Bundled mode leases this stack's published Redis port; external mode uses this server port literally.

enable_ollama:
  type: bool
  default: false
  help: >-
    Run the shared Ollama container for local inference. Models are pulled
    manually and persist under the dev stack.

ollama_port:
  type: int
  default: 11434
  help: >-
    Host port published by the optional Ollama container. Set the inference
    provider base_url when this differs from 11434.

# Host port the Caddy edge publishes (ws://localhost:<edge_port>/<service>/). Defaults
# to 80 for the base stack; workspaces lease a distinct value from operator.port_pool.edge
# so parallel stacks on one host don't all contend for :80.
edge_port:
  type: int
  default: 80

process_compose_port:
  type: int
  default: 8080

# Extra Celery queues, comma-separated; each renders a dedicated `celery-<queue>`
# worker service (threads pool) beside the shared worker. An addon running
# long-lived tasks names its queue here — e.g. `whatsapp,telegram` for live
# channel sessions (messaging_integrate_whatsapp, messaging_integrate_telegram).
celery_queues:
  type: str
  default: ""
