_min_copier_version: "9.0"
_subdirectory: template
_templates_suffix: .jinja
_preserve_symlinks: true

_angee:
  schema: 1
  kind: addon
  name: repository
  description: >-
    Root of a consumer addon repository: the source slot a stack materializes
    beside the framework checkout (arpee is one). Renders the root `AGENTS.md`
    (consumer scope rules, the builder role, the skill route and where checks
    are owned), its `CLAUDE.md` link, and the empty `src/<namespace>/`
    package that `templates/addons/web` renders addons into. The operator does
    not render addon templates; render with Copier.

addon_namespace:
  type: str
  default: example
  help: Directory and import namespace of this repository's addons (src/<namespace>/<name> is <namespace>.<name>).

repository_title:
  type: str
  default: the product
  help: Human name of the product these addons build, used in prose only.
