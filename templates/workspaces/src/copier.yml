_min_copier_version: "9.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_preserve_symlinks: true

_angee:
  schema: 1
  kind: workspace
  name: src
  description: >-
    Conventional all-source workspace. Each Git slot is a worktree on
    workspace/<name>, cut from its declared base ref because the cache may
    already have that ref checked out. Update one slot through
    workspaceSourcePull (`angee ws source pull`); do not switch the worktree to
    its base ref.
  inputs:
    branch_prefix:
      type: str
      default: workspace
    base_ref:
      type: str
      default: main
      help: Mainline ref for every source slot except angee-django.
    angee_django_ref:
      type: str
      default: main
      help: Mainline ref for angee-django; override while a ratified change lives on another branch.
    work_state_source:
      type: str
      default: ""
      help: Stack source name for the private work-state slot; empty renders a slot the operator skips (a clean-machine stack has no private work-state source).
  sources:
    angee-django:
      source: angee-django
      mode: worktree
      ref: "${inputs.angee_django_ref}"
      branch: "${inputs.branch_prefix}/${name | slug}"
      subpath: angee-django
    angee-react:
      source: angee-react
      mode: worktree
      ref: "${inputs.base_ref}"
      branch: "${inputs.branch_prefix}/${name | slug}"
      subpath: angee-react
    angee-base:
      source: angee-base
      mode: worktree
      ref: "${inputs.base_ref}"
      branch: "${inputs.branch_prefix}/${name | slug}"
      subpath: angee-base
    angee-messaging-bridges:
      source: angee-messaging-bridges
      mode: worktree
      ref: "${inputs.base_ref}"
      branch: "${inputs.branch_prefix}/${name | slug}"
      subpath: angee-messaging-bridges
    angee-examples:
      source: angee-examples
      mode: worktree
      ref: "${inputs.base_ref}"
      branch: "${inputs.branch_prefix}/${name | slug}"
      subpath: angee-examples
    angee-templates:
      source: angee-templates
      mode: worktree
      ref: "${inputs.base_ref}"
      branch: "${inputs.branch_prefix}/${name | slug}"
      subpath: angee-templates
    angee-operator:
      source: angee-operator
      mode: worktree
      ref: "${inputs.base_ref}"
      branch: "${inputs.branch_prefix}/${name | slug}"
      subpath: angee-operator
    # Inherit the declared Source kind: Git sources clone, while local sources
    # materialize as symlinks. A fixed `kind: local` here breaks Git stacks.
    # The source name comes from the work_state_source input; when it is empty
    # the operator skips the slot (private work-state is strictly opt-in).
    work-state:
      source: "${inputs.work_state_source}"
      subpath: .work

branch_prefix:
  type: str
  default: workspace

base_ref:
  type: str
  default: main

angee_django_ref:
  type: str
  default: main

work_state_source:
  type: str
  default: ""

