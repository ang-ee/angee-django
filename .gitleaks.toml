# Repo-level gitleaks configuration. The CI lane (.github/workflows/gitleaks.yml)
# runs the gitleaks binary over full history; it picks this file up from the
# repository root. Keep the default ruleset and only allowlist known false
# positives with a pattern that cannot match a real credential.
title = "angee-django gitleaks"

[extend]
useDefault = true

[allowlist]
description = "A credential row next to an MCP placement enum trips generic-api-key."
regexTarget = "line"
regexes = [
  '''credential=[A-Za-z_]+,\s*placement=MCPPlacement\.[A-Z_]+''',
]

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Fake Django session keys in test fixtures."
condition = "AND"
paths = ['''^tests/''']
regexTarget = "line"
regexes = ['''Session\(session_key="[a-z0-9]{32}"\)''']
[[rules.allowlists]]
description = "A fixture name ending in key, then an empty idempotency key, reads as a key and its value."
condition = "AND"
paths = ['''^tests/''']
regexTarget = "line"
regexes = ['''name="Empty key", idempotency_key=""''']
[[rules.allowlists]]
description = "A calendar test's event identity (a series UID with its date) reads as a key and its value."
condition = "AND"
paths = ['''^tests/''']
regexTarget = "line"
regexes = ['''external_key="standup/20260316"''']

[[rules]]
id = "private-key"
[[rules.allowlists]]
description = "Test parameters that pass a bare PEM header as an invalid key file; a real key has a newline, never a closing quote, after its header."
condition = "AND"
paths = ['''^tests/''']
regexTarget = "match"
regexes = ['''^-----BEGIN PRIVATE KEY-----", ''']
