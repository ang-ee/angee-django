name: reusable checks

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for the uv test lane.
        required: false
        type: string
        default: "3.14"
      pytest-extra-args:
        description: Optional arguments appended to the pytest command.
        required: false
        type: string
        default: ""
      uv-enabled:
        description: Run the monorepo's standalone uv pytest lane.
        required: false
        type: boolean
        default: true
      pnpm-enabled:
        description: Run package typecheck, test, build, and distribution checks.
        required: false
        type: boolean
        default: true
      stack-enabled:
        description: Run composed addon fragment checks and optional bridge source tests.
        required: false
        type: boolean
        default: false
      addons-profile:
        description: Addon composition profile; full is the only lane that checks out bridges.
        required: false
        type: string
        default: full
      framework-repository:
        description: Repository containing the framework ref under test.
        required: false
        type: string
        default: ang-ee/angee-django
      framework-ref:
        description: Framework ref used when another repository calls the stack lane.
        required: false
        type: string
        default: main
      bridges-ref:
        description: Bridges ref used when another repository calls the stack lane.
        required: false
        type: string
        default: main
      angee-version:
        description: Release tag of the angee CLI the stack lane installs.
        required: false
        type: string
        default: latest
      consumer-sources:
        description: JSON array of additional addon sources with repository, path (sibling slot), and ref.
        required: false
        type: string
        default: "[]"
      consumer-roots:
        description: JSON array of explicit INSTALLED_APPS roots; empty preserves the framework profile.
        required: false
        type: string
        default: "[]"
      consumer-path:
        description: Sibling source slot to lint and test; empty disables consumer checks.
        required: false
        type: string
        default: ""
      consumer-tests:
        description: JSON array of test paths relative to the consumer slot, including addon tests.
        required: false
        type: string
        default: "[]"
      consumer-pytest-plugins:
        description: JSON array of additional owning test-fixture plugins for the consumer.
        required: false
        type: string
        default: "[]"
    secrets:
      ADDON_SOURCES_TOKEN:
        description: Token with read access to every private consumer dependency source.
        required: false
      BRIDGES_TOKEN:
        description: Token able to read the optional messaging-bridges repo while it is private.
        required: false

permissions:
  contents: read

jobs:
  python-quality:
    if: ${{ inputs.uv-enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: uv run --locked python -m ruff check . --no-cache
      - run: uv run --locked python -m mypy angee addons

  # The suite runs as six contiguous shards of equal stored time
  # (.test_durations, pytest-split); a test missing from it still runs in one.
  # loadfile keeps a file on one worker, so the heaviest files set a floor near
  # 25 minutes on CI: three campaign files of about 700 stored seconds each, whose
  # cost is per-test fixture setup (a rebac sync per test). Lowering that setup is
  # how this limit comes down; 40 minutes keeps that shard from being flaky.
  uv-shard:
    name: uv ${{ matrix.group }}/6
    if: ${{ inputs.uv-enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: >-
          uv run pytest -q -n auto --dist loadfile --durations=25
          --splits 6 --group ${{ matrix.group }} ${{ inputs.pytest-extra-args }}

  # The PostgreSQL selection is split the same way: every worker flushes the
  # whole schema between transactional tests, so one job no longer fits.
  uv-postgres:
    name: uv postgres ${{ matrix.group }}/3
    if: ${{ inputs.uv-enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: angee
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d angee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Size the lock table for one-pass schema creation
        # Each worker creates every table in one transaction, which the default
        # lock table (64 per transaction x 100 connections) no longer holds.
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d angee -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres -d angee; do sleep 1; done
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d angee -tAc "SHOW max_locks_per_transaction"
      - name: Verify workflow, decision and agent session contracts execute on PostgreSQL
        # These source tests register bare concrete Django models, so PostgreSQL
        # must create their tables in one sync-app pass.
        # Review concurrency includes simultaneous all seats, a requester-less
        # first seat, and recovery after a settlement signal skips a busy run.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/angee
        run: |
          uv run --locked python -m pytest -q -n 4 --dist loadfile --nomigrations --durations=25 --junitxml=workflow-concurrency.xml \
            --splits 3 --group ${{ matrix.group }} \
            tests/test_workflows_definition.py tests/test_workflows_concurrency.py \
            tests/test_workflows_runtime.py tests/test_workflows_install.py \
            tests/test_workflows_subject.py tests/test_workflows_publication.py \
            tests/test_workflows_testing.py tests/test_testing.py \
            tests/test_workflows_io.py tests/test_workflows_contract.py tests/test_workflows_graphql.py \
            tests/test_workflows_fix_round.py tests/test_workflows_run_graph.py \
            tests/test_workflows_cancel.py tests/test_workflows_cancel_concurrency.py \
            tests/test_workflows_review.py tests/test_workflows_review_concurrency.py \
            tests/test_workflows_review_graphql.py tests/test_decisions_inbox.py \
            tests/test_timeline_workflows.py \
            tests/test_decision_display_nested.py \
            tests/test_workflows_map_definition.py tests/test_workflows_map.py \
            tests/test_workflows_map_concurrency.py tests/test_workflows_map_surface.py \
            tests/test_workflows_await_definition.py tests/test_workflows_children.py \
            tests/test_workflows_children_concurrency.py tests/test_workflows_children_surface.py \
            tests/test_workflows_retention.py \
            tests/test_workflows_triggers.py tests/test_workflows_triggers_surface.py \
            tests/test_workflows_triggers_concurrency.py tests/test_workflows_messaging.py \
            tests/test_workflows_posts.py \
            tests/test_workflows_watches.py tests/test_workflows_watch_concurrency.py \
            tests/test_workflows_parties.py \
            tests/test_composed_note_workflow.py \
            tests/test_extraction_steps.py tests/test_extraction_decisions.py \
            tests/test_composed_extraction_workflow.py \
            tests/test_decisions_lifecycle.py tests/test_decisions_concurrency.py \
            tests/test_agent_sessions.py tests/test_agent_sessions_concurrency.py \
            tests/test_integrate_discovery_concurrency.py \
            tests/test_framework_integration.py \
            tests/test_messaging_delivery.py tests/test_messaging_delivery_concurrency.py
          uv run --locked python -c 'import xml.etree.ElementTree as ET; root = ET.parse("workflow-concurrency.xml").getroot(); cases = list(root.iter("testcase")); skipped = sum(any(child.tag.rsplit("}", 1)[-1] == "skipped" for child in case) for case in cases); assert cases and skipped == 0, f"expected executed PostgreSQL tests, got tests={len(cases)}, skipped={skipped}"; print(f"PostgreSQL tests={len(cases)}, skipped={skipped}")'

  # One verdict under the check name pull requests and callers already know:
  # a failed, cancelled or timed-out shard fails it.
  uv:
    if: ${{ always() && inputs.uv-enabled }}
    needs: [python-quality, uv-shard, uv-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "quality=${{ needs.python-quality.result }} shards=${{ needs.uv-shard.result }} postgres=${{ needs.uv-postgres.result }}"
          test "${{ needs.python-quality.result }}" = success
          test "${{ needs.uv-shard.result }}" = success
          test "${{ needs.uv-postgres.result }}" = success

  pnpm:
    if: ${{ inputs.pnpm-enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.3
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/**' typecheck
      - run: pnpm -r --filter './packages/**' test
      - run: pnpm -r --filter './packages/**' --filter '!@angee/storybook' build
      - run: node packages/scripts/check-dist-imports.mjs
      - run: node packages/ui/scripts/check-views-exports.mjs

  # The composed-stack lane dogfoods the two-command install path: install the
  # released angee CLI, render the in-repo framework-dev stack template,
  # compose it (angee build + schema + web codegen — no database needed), then
  # typecheck/test addon fragments (the stack root's runtime/ is the @angee/gql
  # fixture), and run the optional bridge source tests.
  # The consolidated checkout supplies core, packages, addons, examples, and
  # templates. Only the optional full-profile bridges remain external.
  stack:
    if: ${{ inputs.stack-enabled }}
    runs-on: ubuntu-latest
    # Composition, fragment checks and the serial bridges suite no longer fit
    # 30 minutes.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: angee
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d angee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.framework-repository }}
          ref: ${{ github.repository == 'ang-ee/angee-django' && github.sha || inputs.framework-ref }}
          path: stack/workspaces/src/angee
      - uses: actions/checkout@v5
        if: ${{ inputs.addons-profile == 'full' }}
        with:
          repository: ang-ee/angee-messaging-bridges
          ref: ${{ github.repository == 'ang-ee/angee-messaging-bridges' && github.sha || inputs.bridges-ref }}
          path: stack/workspaces/src/angee-messaging-bridges
          token: ${{ secrets.BRIDGES_TOKEN || github.token }}
      - name: Check out declared consumer addon sources
        if: ${{ inputs.consumer-path != '' }}
        env:
          GH_TOKEN: ${{ secrets.ADDON_SOURCES_TOKEN || github.token }}
          CONSUMER_SOURCES: ${{ inputs.consumer-sources }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          sources = json.loads(os.environ["CONSUMER_SOURCES"])
          assert sources, "Consumer checks require declared addon sources"
          subprocess.run(["gh", "auth", "setup-git"], check=True)
          for source in sources:
              slot = source["path"]
              assert Path(slot).name == slot and slot not in {".", "..", "angee"}, slot
              target = Path("stack/workspaces/src") / slot
              repository = source["repository"]
              ref = os.environ["CALLER_SHA"] if repository == os.environ["CALLER_REPOSITORY"] else source["ref"]
              subprocess.run(["gh", "repo", "clone", repository, str(target), "--", "--depth=1", "--no-checkout"], check=True)
              subprocess.run(["git", "-C", str(target), "fetch", "--depth=1", "origin", ref], check=True)
              subprocess.run(["git", "-C", str(target), "checkout", "--detach", "FETCH_HEAD"], check=True)
          PY
      - name: Install the angee CLI (the public install path)
        run: curl -fsSL https://raw.githubusercontent.com/ang-ee/angee-operator/main/scripts/install.sh | ANGEE_VERSION=${{ inputs.angee-version }} sh
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.3
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
      - name: Render the stack (local template ref — no registry round-trip)
        run: >-
          angee stack init "$GITHUB_WORKSPACE/stack/workspaces/src/angee/templates/stacks/dev"
          "$GITHUB_WORKSPACE/stack" --force --yes
          --input project_name=ci-stack
          --input addons_profile=${{ inputs.addons-profile }}
      - name: Configure the consumer composition and workspace
        if: ${{ inputs.consumer-path != '' }}
        working-directory: stack
        env:
          CONSUMER_SOURCES: ${{ inputs.consumer-sources }}
          CONSUMER_ROOTS: ${{ inputs.consumer-roots }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml

          sources = json.loads(os.environ["CONSUMER_SOURCES"])
          roots = json.loads(os.environ["CONSUMER_ROOTS"])
          assert roots, "Consumer checks require explicit installed app roots"
          path = Path("settings.yaml")
          settings = yaml.safe_load(path.read_text())
          settings["INSTALLED_APPS"] = roots
          settings["ANGEE_ADDON_DIRS"].extend(
              "{BASE_DIR}/workspaces/src/" + source["path"] + "/addons" for source in sources
          )
          path.write_text(yaml.safe_dump(settings, sort_keys=False))
          path = Path("pnpm-workspace.yaml")
          workspace = yaml.safe_load(path.read_text())
          workspace["packages"].extend(
              "workspaces/src/" + source["path"] + "/addons/*/*/web" for source in sources
          )
          path.write_text(yaml.safe_dump(workspace, sort_keys=False))
          PY
      - name: Enable Matrix to check every bridge web fragment
        if: ${{ inputs.addons-profile == 'full' }}
        working-directory: stack
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("settings.yaml")
          settings = yaml.safe_load(path.read_text())
          settings["INSTALLED_APPS"].append("angee.messaging_integrate_matrix")
          path.write_text(yaml.safe_dump(settings, sort_keys=False))
          PY
      - name: Compose the runtime and SDL (no database needed)
        working-directory: stack
        run: |
          uv sync
          uv run python -m angee.compose.bootstrap
          uv sync
          uv run manage.py angee build
          uv run manage.py schema
      - name: Provision the composed stack
        working-directory: stack
        run: |
          uv run manage.py angee provision
      - name: Export the framework's locked check tools
        if: ${{ inputs.consumer-path != '' || inputs.addons-profile == 'full' }}
        working-directory: stack/workspaces/src/angee
        run: uv export --locked --only-group dev --no-hashes --no-emit-project --output-file "$GITHUB_WORKSPACE/check-tools.txt"
      - name: Lint the consumer with the framework policy
        if: ${{ inputs.consumer-path != '' }}
        working-directory: stack
        env:
          CONSUMER_PATH: ${{ inputs.consumer-path }}
        run: uv run --with-requirements "$GITHUB_WORKSPACE/check-tools.txt" python -m ruff check "workspaces/src/$CONSUMER_PATH" --no-cache
      - name: Typecheck the consumer with the framework policy and native typing host
        if: ${{ inputs.consumer-path != '' }}
        working-directory: stack
        env:
          ANGEE_PROJECT_DIR: ${{ github.workspace }}/stack
          CONSUMER_PATH: ${{ inputs.consumer-path }}
        run: |
          uv run --with-requirements "$GITHUB_WORKSPACE/check-tools.txt" python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          slot = (Path("workspaces/src") / os.environ["CONSUMER_PATH"]).resolve()
          framework = Path("workspaces/src/angee").resolve()
          os.chdir(framework)
          sys.path.insert(0, str(framework))
          from tests import typing_settings

          os.environ["MYPYPATH"] = os.pathsep.join(filter(None, (
              *(str(path) for path in typing_settings.ANGEE_ADDON_DIRS),
              str(typing_settings.ANGEE_RUNTIME_DIR.parent),
              os.environ.get("MYPYPATH"),
          )))
          subprocess.run([
              sys.executable, "-m", "mypy", "--config-file", str(framework / "pyproject.toml"),
              str(slot / "addons"),
          ], check=True)
          PY
      - name: Size the PostgreSQL lock table for consumer test schemas
        if: ${{ inputs.consumer-path != '' }}
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d angee -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres -d angee; do sleep 1; done
      - name: Run the consumer's complete Python tests on PostgreSQL
        if: ${{ inputs.consumer-path != '' }}
        working-directory: stack
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/angee
          ANGEE_PROJECT_DIR: ${{ github.workspace }}/stack
          DJANGO_SETTINGS_MODULE: angee.compose.settings
          CONSUMER_PATH: ${{ inputs.consumer-path }}
          CONSUMER_TESTS: ${{ inputs.consumer-tests }}
          CONSUMER_PYTEST_PLUGINS: ${{ inputs.consumer-pytest-plugins }}
        run: |
          uv run --with-requirements "$GITHUB_WORKSPACE/check-tools.txt" python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          import django
          import pytest

          slot = (Path("workspaces/src") / os.environ["CONSUMER_PATH"]).resolve()
          paths = json.loads(os.environ["CONSUMER_TESTS"])
          assert paths, "Consumer checks require explicit test paths"
          os.chdir(slot)
          sys.path.insert(0, str(slot))
          # The native settings owner configures addon import paths before pytest
          # imports plugins contributed by those addons.
          django.setup()
          plugins = json.loads(os.environ["CONSUMER_PYTEST_PLUGINS"])
          raise SystemExit(pytest.main([
              "-c", "/dev/null", "--rootdir", str(slot), "--confcutdir", str(slot),
              "--import-mode=importlib", "--nomigrations", "-o", "python_files=test*.py",
              # Register pytest-django before the shared django_db_setup override.
              "-p", "django", "-p", "angee.testing.fixtures", "-p", "angee.parties.testing.fixtures",
              *(arg for plugin in plugins for arg in ("-p", plugin)),
              "-p", "no:randomly", "-n", "4", "--dist", "worksteal", "-q",
              *(str(slot / path) for path in paths),
          ]))
          PY
      - name: Install the stack JS workspace and generate typed documents
        working-directory: stack
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --dir web codegen
      - name: Typecheck and test all fragments against the composition
        working-directory: stack
        env:
          CONSUMER_PATH: ${{ inputs.consumer-path }}
        run: |
          if [ -n "$CONSUMER_PATH" ]; then
            pnpm -r --fail-if-no-match --filter "./workspaces/src/$CONSUMER_PATH/addons/**" typecheck
            pnpm -r --fail-if-no-match --filter "./workspaces/src/$CONSUMER_PATH/addons/**" test
          else
            pnpm -r typecheck
            pnpm -r test
          fi
      - name: Pytest the bridge source contracts
        if: ${{ inputs.addons-profile == 'full' }}
        working-directory: stack
        run: >-
          uv run --project "$GITHUB_WORKSPACE/stack"
          --directory "$GITHUB_WORKSPACE/stack/workspaces/src/angee-messaging-bridges"
          --with-requirements "$GITHUB_WORKSPACE/check-tools.txt"
          pytest -q ${{ inputs.pytest-extra-args }}
