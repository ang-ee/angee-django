name: reusable checks

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for the uv test lane.
        required: false
        type: string
        default: "3.14"
      pytest-extra-args:
        description: Optional arguments appended to the pytest command.
        required: false
        type: string
        default: ""
      uv-enabled:
        description: Run the monorepo's standalone uv pytest lane.
        required: false
        type: boolean
        default: true
      pnpm-enabled:
        description: Run package typecheck, test, build, and distribution checks.
        required: false
        type: boolean
        default: true
      stack-enabled:
        description: Run composed addon fragment checks and optional bridge source tests.
        required: false
        type: boolean
        default: false
      addons-profile:
        description: Addon composition profile; full is the only lane that checks out bridges.
        required: false
        type: string
        default: full
      framework-repository:
        description: Repository containing the framework ref under test.
        required: false
        type: string
        default: ang-ee/angee-django
      framework-ref:
        description: Framework ref used when another repository calls the stack lane.
        required: false
        type: string
        default: main
      bridges-ref:
        description: Bridges ref used when another repository calls the stack lane.
        required: false
        type: string
        default: main
      angee-version:
        description: Release version of the angee CLI the stack lane installs (without the v prefix).
        required: false
        type: string
        default: "0.27.0"
      consumer-sources:
        description: JSON array of additional addon sources with repository, path (sibling slot), and ref.
        required: false
        type: string
        default: "[]"
      consumer-roots:
        description: JSON array of explicit INSTALLED_APPS roots; empty preserves the framework profile.
        required: false
        type: string
        default: "[]"
      consumer-path:
        description: Sibling source slot to lint and test; empty disables consumer checks.
        required: false
        type: string
        default: ""
      consumer-tests:
        description: JSON array of test paths relative to the consumer slot, including addon tests.
        required: false
        type: string
        default: "[]"
      consumer-pytest-plugins:
        description: JSON array of additional owning test-fixture plugins for the consumer.
        required: false
        type: string
        default: "[]"
    secrets:
      ADDON_SOURCES_TOKEN:
        description: Token with read access to every private consumer dependency source.
        required: false
      BRIDGES_TOKEN:
        description: Token able to read the optional messaging-bridges repo while it is private.
        required: false

permissions:
  contents: read

jobs:
  python-quality:
    if: ${{ inputs.uv-enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: uv run --locked python -m ruff check . --no-cache
      - run: uv run --locked lint-imports --no-cache
      - run: uv run --locked python -m mypy src
        env:
          PYTHONPATH: src

  # The suite runs as six contiguous shards of equal stored time
  # (.test_durations, pytest-split); a test missing from it still runs in one.
  # loadfile keeps a file on one worker. Allow for long file-scoped campaigns
  # and runner cleanup; retain per-test timings for balancing the shards.
  uv-shard:
    name: uv ${{ matrix.group }}/6
    if: ${{ inputs.uv-enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: >-
          uv run pytest -q -n auto --dist loadfile --durations=25
          --splits 6 --group ${{ matrix.group }} ${{ inputs.pytest-extra-args }}

  # The PostgreSQL selection is balanced over its own timing map
  # (.test_durations_postgres, least_duration): every worker flushes the
  # whole schema between transactional tests, so one job no longer fits.
  # CI runs 1.9-2.6x the local timings the map records, so six groups under
  # the SQLite shards' 60-minute limit keep the margin the map cannot predict.
  uv-postgres:
    name: uv postgres ${{ matrix.group }}/6
    if: ${{ inputs.uv-enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: angee
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d angee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Size the lock table for one-pass schema creation
        # Each worker creates every table in one transaction, which the default
        # lock table (64 per transaction x 100 connections) no longer holds.
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d angee -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres -d angee; do sleep 1; done
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d angee -tAc "SHOW max_locks_per_transaction"
      - name: Enable pgvector for test databases
        # --nomigrations and composed hosts create tables without the pre_migrate
        # extension receiver; each native test database inherits template1.
        run: docker exec ${{ job.services.postgres.id }} psql -U postgres -d template1 -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm"
      - name: Verify PostgreSQL contracts execute without skips
        # Every PostgreSQL-only contract (row and advisory locks, MVCC reads,
        # two-writer campaigns, vendor branches by node id) with the workflow,
        # decision and agent-session selection, in six duration-balanced groups.
        # These source tests register bare concrete Django models, so PostgreSQL
        # must create their tables in one sync-app pass.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/angee
        run: |
          uv run --locked python -m pytest -q -n 4 --dist loadfile --nomigrations --durations=25 --junitxml=postgresql-contracts.xml \
            --splits 6 --group ${{ matrix.group }} --splitting-algorithm least_duration \
            --durations-path .test_durations_postgres \
            tests/test_workflows_definition.py tests/test_workflows_concurrency.py \
            tests/test_workflows_runtime.py tests/test_workflows_install.py \
            tests/test_workflows_subject.py tests/test_workflows_publication.py \
            tests/test_workflows_testing.py tests/test_testing.py \
            tests/test_workflows_io.py tests/test_workflows_contract.py tests/test_workflows_graphql.py \
            tests/test_workflows_fix_round.py tests/test_workflows_run_graph.py \
            tests/test_workflows_cancel.py tests/test_workflows_cancel_concurrency.py \
            tests/test_workflows_review.py tests/test_workflows_review_concurrency.py \
            tests/test_workflows_review_graphql.py tests/test_decisions_inbox.py \
            tests/test_timeline_workflows.py tests/test_timeline_subscriptions.py \
            tests/test_decision_display_nested.py \
            tests/test_workflows_map_definition.py tests/test_workflows_map.py \
            tests/test_workflows_map_concurrency.py tests/test_workflows_map_surface.py \
            tests/test_workflows_await_definition.py tests/test_workflows_children.py \
            tests/test_workflows_children_concurrency.py tests/test_workflows_children_surface.py \
            tests/test_workflows_retention.py \
            tests/test_workflows_triggers.py tests/test_workflows_triggers_surface.py \
            tests/test_workflows_triggers_concurrency.py \
            tests/test_workflows_watches.py tests/test_workflows_watch_concurrency.py \
            'tests/test_composed_workflows.py::test_composed_workflows[posts]' \
            'tests/test_composed_workflows.py::test_composed_workflows[messaging]' \
            'tests/test_composed_workflows.py::test_composed_workflows[parties]' \
            'tests/test_composed_workflows.py::test_composed_workflows[extraction]' \
            tests/test_composed_examples.py tests/test_composed_messaging.py \
            'tests/test_composed_intake.py::test_composed_intake[intake]' \
            'tests/test_composed_work.py::test_composed_work[work]' \
            tests/test_extraction_steps.py \
            tests/test_extraction_models.py::test_extraction_rejects_targets_outside_file_and_message \
            tests/test_extraction_models.py::test_competing_revision_requests_allocate_exactly_one_successor \
            tests/test_extraction_models.py::test_retention_waits_for_a_held_file_and_refuses_its_committed_change \
            tests/test_decisions_lifecycle.py tests/test_decisions_concurrency.py \
            tests/test_agent_sessions.py tests/test_agent_sessions_concurrency.py \
            tests/test_integrate_discovery_concurrency.py \
            tests/test_framework_integration.py \
            tests/test_base_row_lock.py \
            tests/test_connections.py::test_ensure_fresh_serializes_two_processes_on_postgresql \
            tests/test_hierarchy.py tests/test_iam_concurrency_campaign.py \
            tests/test_iam_graphql.py \
            tests/test_oidc.py::test_credential_disconnect_guard_blocks_last_oidc_sign_in \
            tests/test_oidc.py::test_credential_disconnect_preserves_other_sign_in_methods \
            tests/test_oidc.py::test_credential_disconnect_reads_current_sign_in_facts_despite_cached_relations \
            tests/test_oidc.py::test_disconnect_does_not_count_unusable_oidc_alternatives \
            tests/test_integrate_streams.py \
            tests/test_integrate_scheduler.py::test_scheduled_admission_uses_the_schedulers_single_row_lock \
            tests/test_integrate_scheduler.py::test_scheduler_skips_row_locked_bridge_and_enqueues_other_due_bridges \
            tests/test_knowledge_clone_concurrency_campaign.py tests/test_knowledge_search.py \
            tests/test_postgresql_extensions.py \
            tests/test_knowledge_graph_pgvector_extraction.py tests/test_knowledge_graph_pgvector_local.py \
            tests/test_knowledge_graph_pgvector_index.py tests/test_knowledge_graph_pgvector_jobs.py \
            tests/test_knowledge_graph_pgvector_evaluation.py \
            tests/test_knowledge_graph_pgvector_postgres.py tests/test_knowledge_graph_pgvector_resolution.py \
            tests/test_knowledge_access_campaign.py::test_record_note_and_binding_keep_locks_replay_and_rollback \
            tests/test_messaging.py tests/test_messaging_concurrency_campaign.py \
            tests/test_messaging_channel_concurrency.py \
            tests/test_messaging_inbox_read.py tests/test_inbox_explorer.py tests/test_inbox_part_reads.py \
            tests/test_group_rows.py \
            tests/test_optimistic_lock.py \
            tests/test_ownership_seams.py tests/test_portfolio_concurrency.py \
            tests/test_proposals_campaign_queries.py tests/test_proposals_concurrency.py \
            tests/test_resource_ledger.py::test_concurrent_upserts_converge_on_one_row_and_refuse_another_model \
            tests/test_sequence.py \
            tests/test_spaces_concurrency_campaign.py tests/test_stage_fractional_transition.py \
            tests/test_storage.py tests/test_storage_upload_campaign.py \
            tests/test_storage_access_campaign.py::test_download_urls_are_window_aligned_and_expire_from_the_window_start \
            tests/test_storage_access_campaign.py::test_download_url_changes_for_new_content_inside_one_window \
            tests/test_system_queryset.py::test_system_queryset_emits_for_update_on_postgresql \
            tests/test_task_locks.py \
            tests/test_transitions.py::test_a_guarded_transition_holds_its_row_lock_until_commit \
            tests/test_task_rank_allocation.py tests/test_projects_record_tasks.py \
            tests/test_projects_access_projections.py tests/test_timeline_concurrency.py \
            tests/test_work_intake_lock_campaign.py tests/test_work_stage_lock_campaign.py \
            tests/test_workflows_integrate_cycle.py tests/test_workflows_integrate_steps.py
          uv run --locked python -c 'import xml.etree.ElementTree as ET; root = ET.parse("postgresql-contracts.xml").getroot(); cases = list(root.iter("testcase")); skipped = sum(any(child.tag.rsplit("}", 1)[-1] == "skipped" for child in case) for case in cases); assert cases and skipped == 0, f"expected executed PostgreSQL tests, got tests={len(cases)}, skipped={skipped}"; print(f"PostgreSQL tests={len(cases)}, skipped={skipped}")'

  # One verdict under the check name pull requests and callers already know:
  # a failed, cancelled or timed-out shard fails it.
  uv:
    if: ${{ always() && inputs.uv-enabled }}
    needs: [python-quality, uv-shard, uv-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "quality=${{ needs.python-quality.result }} shards=${{ needs.uv-shard.result }} postgres=${{ needs.uv-postgres.result }}"
          test "${{ needs.python-quality.result }}" = success
          test "${{ needs.uv-shard.result }}" = success
          test "${{ needs.uv-postgres.result }}" = success

  pnpm:
    if: ${{ inputs.pnpm-enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.3
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/**' typecheck
      - run: pnpm -r --filter './packages/**' test
      - run: pnpm -r --filter './packages/**' --filter '!@angee/storybook' build
      - run: node packages/scripts/check-dist-imports.mjs
      - run: node packages/ui/scripts/check-views-exports.mjs

  # The composed-stack lane dogfoods the two-command install path: install the
  # released angee CLI, render the in-repo framework-dev stack template,
  # compose it (native compose + prebuilt schema check + web codegen — no database needed), then
  # typecheck/test addon fragments (the stack root's runtime/ is the @angee/gql
  # fixture), and run the optional bridge source tests.
  # The consolidated checkout supplies packages, src, examples, and
  # templates. Only the optional full-profile bridges remain external.
  # Consumer collections span independent PostgreSQL hosts; the first group
  # also checks lint, types and frontend fragments. The stack job keeps one verdict.
  stack-shard:
    name: stack ${{ matrix.group }}/${{ strategy.job-total }}
    if: ${{ inputs.stack-enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.consumer-path != '' && '[1,2,3,4,5,6]' || '[1]') }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: angee
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d angee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.framework-repository }}
          ref: ${{ github.repository == 'ang-ee/angee-django' && github.sha || inputs.framework-ref }}
          path: stack/workspaces/src/angee
      - uses: actions/checkout@v5
        if: ${{ inputs.addons-profile == 'full' }}
        with:
          repository: ang-ee/angee-messaging-bridges
          ref: ${{ github.repository == 'ang-ee/angee-messaging-bridges' && github.sha || inputs.bridges-ref }}
          path: stack/workspaces/src/angee-messaging-bridges
          token: ${{ secrets.BRIDGES_TOKEN || github.token }}
      - name: Check out declared consumer addon sources
        if: ${{ inputs.consumer-path != '' }}
        env:
          GH_TOKEN: ${{ secrets.ADDON_SOURCES_TOKEN || github.token }}
          CONSUMER_SOURCES: ${{ inputs.consumer-sources }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          sources = json.loads(os.environ["CONSUMER_SOURCES"])
          assert sources, "Consumer checks require declared addon sources"
          subprocess.run(["gh", "auth", "setup-git"], check=True)
          for source in sources:
              slot = source["path"]
              assert Path(slot).name == slot and slot not in {".", "..", "angee"}, slot
              target = Path("stack/workspaces/src") / slot
              repository = source["repository"]
              ref = os.environ["CALLER_SHA"] if repository == os.environ["CALLER_REPOSITORY"] else source["ref"]
              subprocess.run(["gh", "repo", "clone", repository, str(target), "--", "--depth=1", "--no-checkout"], check=True)
              subprocess.run(["git", "-C", str(target), "fetch", "--depth=1", "origin", ref], check=True)
              subprocess.run(["git", "-C", str(target), "checkout", "--detach", "FETCH_HEAD"], check=True)
          PY
      - name: Install the angee CLI (the public install path)
        run: curl -fsSL https://raw.githubusercontent.com/ang-ee/angee-operator/main/scripts/install.sh | ANGEE_VERSION=${{ inputs.angee-version }} sh
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.3
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
      - name: Render the stack (local template ref — no registry round-trip)
        run: >-
          angee stack init "$GITHUB_WORKSPACE/stack/workspaces/src/angee/templates/stacks/dev"
          "$GITHUB_WORKSPACE/stack" --force --yes
          --input project_name=ci-stack
          --input addons_profile=${{ inputs.addons-profile }}
      - name: Configure the consumer composition and workspace
        if: ${{ inputs.consumer-path != '' }}
        working-directory: stack
        env:
          CONSUMER_SOURCES: ${{ inputs.consumer-sources }}
          CONSUMER_ROOTS: ${{ inputs.consumer-roots }}
        run: |
          uv run --no-project --with pyyaml python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          import yaml

          sources = json.loads(os.environ["CONSUMER_SOURCES"])
          roots = json.loads(os.environ["CONSUMER_ROOTS"])
          assert roots, "Consumer checks require explicit installed app roots"
          path = Path("settings.yaml")
          settings = yaml.safe_load(path.read_text())
          settings["INSTALLED_APPS"] = roots
          path.write_text(yaml.safe_dump(settings, sort_keys=False))
          path = Path("pnpm-workspace.yaml")
          workspace = yaml.safe_load(path.read_text())
          workspace["packages"].extend(
              "workspaces/src/" + source["path"] + "/src/*/*/web" for source in sources
          )
          path.write_text(yaml.safe_dump(workspace, sort_keys=False))
          # Native uv reads each collection's pyproject and workspace sources.
          subprocess.run([
              "uv", "add", "--editable", "--no-workspace",
              *(str(Path("workspaces/src") / source["path"]) for source in sources),
          ], check=True)
          PY
      - name: Enable Matrix to check every bridge web fragment
        if: ${{ inputs.addons-profile == 'full' }}
        working-directory: stack
        run: |
          uv run --no-project --with pyyaml python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("settings.yaml")
          settings = yaml.safe_load(path.read_text())
          settings["INSTALLED_APPS"].append("angee.messaging_integrate_matrix")
          path.write_text(yaml.safe_dump(settings, sort_keys=False))
          PY
      - name: Export the framework's locked check tools
        if: ${{ inputs.consumer-path != '' || inputs.addons-profile == 'full' }}
        working-directory: stack/workspaces/src/angee
        run: uv export --locked --only-group dev --no-hashes --no-emit-workspace --output-file "$GITHUB_WORKSPACE/check-tools.txt"
      - name: Resolve check tools with the stack runtime
        if: ${{ inputs.consumer-path != '' || inputs.addons-profile == 'full' }}
        working-directory: stack
        # One environment keeps plugin entry points consistent with imported code.
        run: uv add --dev --requirements "$GITHUB_WORKSPACE/check-tools.txt" --no-sync
      - name: Enable pgvector for the host and test databases
        run: |
          # The host database already exists; worker databases inherit template1.
          for database in angee template1; do
            docker exec ${{ job.services.postgres.id }} psql -U postgres -d "$database" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm"
          done
      - name: Compose the runtime and SDL (no database needed)
        working-directory: stack
        run: |
          uv sync
          uv run --no-sync python manage.py compose
          # Author disposable native history, then verify the native composition:
          # the authored history must reproduce the composed models exactly.
          uv run --no-sync python manage.py makemigrations --noinput
          uv run --no-sync python manage.py makemigrations --check --dry-run
          uv run --no-sync python manage.py compose --check
          uv run --no-sync python manage.py schema --check
      - name: Provision the composed stack
        working-directory: stack
        run: |
          uv run --no-sync python manage.py provision
      # Composition escapes the bare source host cannot see: every system check on the
      # composed models, the demo tier loading, and every folded model with a row loading
      # one with only its primary key and saving it again (deferred-column reads,
      # MRO-ordered save overrides). Append-only models refuse edits by contract, so they
      # only load.
      - name: Smoke the composed models
        if: ${{ matrix.group == 1 }}
        working-directory: stack
        run: |
          uv run --no-sync python manage.py check --database default
          uv run --no-sync python manage.py resources load --include-demo
          uv run --no-sync python manage.py shell -c '
          from django.apps import apps
          from rebac import system_context

          from angee.base.addons import is_angee_addon
          from angee.base.models.append_only import AppendOnlyModel

          failures, loaded = [], 0
          with system_context(reason="ci.composed_model_smoke"):
              for model in apps.get_models():
                  if model._meta.managed and is_angee_addon(model._meta.app_config):
                      try:
                          for row in model._base_manager.only("pk")[:1]:
                              loaded += 1
                              if not issubclass(model, AppendOnlyModel):
                                  row.save()
                      except Exception as error:
                          failures.append(f"{model._meta.label}: {error!r}")
          print(f"Loaded and saved one row of {loaded} composed models.")
          assert not failures, "\n".join(failures)
          '
      - name: Lint the consumer with the framework policy
        if: ${{ inputs.consumer-path != '' && matrix.group == 1 }}
        working-directory: stack
        env:
          CONSUMER_PATH: ${{ inputs.consumer-path }}
        run: uv run --no-sync python -m ruff check "workspaces/src/$CONSUMER_PATH" --no-cache
      - name: Typecheck the consumer with the framework policy and native typing host
        if: ${{ inputs.consumer-path != '' && matrix.group == 1 }}
        working-directory: stack
        env:
          CONSUMER_PATH: ${{ inputs.consumer-path }}
          CONSUMER_SOURCES: ${{ inputs.consumer-sources }}
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          import tomlkit
          import yaml

          host = Path.cwd().resolve()
          slot = host / "workspaces/src" / os.environ["CONSUMER_PATH"]
          framework = host / "workspaces/src/angee"
          typing_root = host / ".mypy_cache/consumer_typing"
          typing_root.mkdir(parents=True, exist_ok=True)
          # Authored isolated settings use the same native configuration owner.
          (typing_root / "ci_consumer_typing.py").write_text((host / "settings.py").read_text())
          authored = yaml.safe_load((host / "settings.yaml").read_text())
          authored["COMPOSE_OUTPUT_DIR"] = str(typing_root / "ci_typing_runtime")
          authored["COMPOSE_OUTPUT_MODULE"] = "ci_typing_runtime"
          authored["DATABASES"] = {"default": {"ENGINE": "django.db.backends.sqlite3", "NAME": ":memory:"}}
          (typing_root / "settings.yaml").write_text(yaml.safe_dump(authored, sort_keys=False))
          # Locked angee-django-stubs gives its configured module priority over the env.
          # Reuse the full policy; change only that native project selection.
          policy = tomlkit.parse((framework / "pyproject.toml").read_text())
          policy["tool"]["django-stubs"]["django_settings_module"] = "ci_consumer_typing"
          config = typing_root / "mypy.toml"
          config.write_text(tomlkit.dumps(policy))
          os.environ["ANGEE_PROJECT_DIR"] = str(typing_root)
          os.environ.pop("DATABASE_URL", None)
          os.environ.pop("YAMLCONF_CONFFILE", None)
          os.environ["PYTHONPATH"] = os.pathsep.join(filter(None, (
              str(typing_root), str(framework), os.environ.get("PYTHONPATH"),
          )))
          source_roots = sorted(
              str(host / "workspaces/src" / source["path"] / "src")
              for source in json.loads(os.environ["CONSUMER_SOURCES"])
          )
          os.environ["MYPYPATH"] = os.pathsep.join(dict.fromkeys(filter(None, (
              str(typing_root), str(slot / "src"), *source_roots, os.environ.get("MYPYPATH"),
          ))))
          subprocess.run([
              sys.executable, "-m", "mypy", "--config-file", str(config),
              str(slot / "src"),
          ], cwd=framework, check=True)
          PY
      - name: Size the PostgreSQL lock table for consumer test schemas
        if: ${{ inputs.consumer-path != '' }}
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d angee -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres -d angee; do sleep 1; done
      - name: Run the consumer's PostgreSQL test shard
        if: ${{ inputs.consumer-path != '' }}
        working-directory: stack
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/angee
          ANGEE_PROJECT_DIR: ${{ github.workspace }}/stack
          DJANGO_SETTINGS_MODULE: settings
          CONSUMER_PATH: ${{ inputs.consumer-path }}
          CONSUMER_TESTS: ${{ inputs.consumer-tests }}
          CONSUMER_PYTEST_PLUGINS: ${{ inputs.consumer-pytest-plugins }}
          CONSUMER_SPLITS: ${{ strategy.job-total }}
          CONSUMER_GROUP: ${{ matrix.group }}
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          import django
          import pytest

          slot = (Path("workspaces/src") / os.environ["CONSUMER_PATH"]).resolve()
          paths = json.loads(os.environ["CONSUMER_TESTS"])
          assert paths, "Consumer checks require explicit test paths"
          host = Path.cwd().resolve()
          os.environ["PYTHONPATH"] = os.pathsep.join(filter(None, (
              str(host), os.environ.get("PYTHONPATH"),
          )))
          os.chdir(slot)
          sys.path[:0] = [str(slot), str(host)]
          # Populate the authored host before collecting consumer fixture plugins.
          # Native installed distributions already own addon importability.
          django.setup()
          plugins = json.loads(os.environ["CONSUMER_PYTEST_PLUGINS"])
          raise SystemExit(pytest.main([
              "-c", "/dev/null", "--rootdir", str(slot), "--confcutdir", str(slot),
              "--import-mode=importlib", "--nomigrations", "-o", "python_files=test*.py",
              # Register pytest-django before the shared django_db_setup override.
              "-p", "django", "-p", "angee.base.testing.fixtures", "-p", "angee.provenance.testing.fixtures",
              "-p", "angee.parties.testing.fixtures",
              *(arg for plugin in plugins for arg in ("-p", plugin)),
              "-p", "no:randomly", "-n", "4", "--dist", "worksteal", "-q",
              "--splits", os.environ["CONSUMER_SPLITS"], "--group", os.environ["CONSUMER_GROUP"],
              "--splitting-algorithm", "least_duration", "--durations=25",
              "-o", "faulthandler_timeout=300",
              *(str(slot / path) for path in paths),
          ]))
          PY
      - name: Install the stack JS workspace and generate typed documents
        if: ${{ matrix.group == 1 }}
        working-directory: stack
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            pnpm install --lockfile-only --no-frozen-lockfile
          fi
          pnpm install --frozen-lockfile
          pnpm --config.verify-deps-before-run=false --dir web exec angee-web-codegen --runtime ../runtime --web-root .
      - name: Typecheck and test all fragments against the composition
        if: ${{ matrix.group == 1 }}
        working-directory: stack
        env:
          CONSUMER_PATH: ${{ inputs.consumer-path }}
        run: |
          if [ -n "$CONSUMER_PATH" ]; then
            pnpm -r --fail-if-no-match --filter "./workspaces/src/$CONSUMER_PATH/src/**" typecheck
            pnpm -r --fail-if-no-match --filter "./workspaces/src/$CONSUMER_PATH/src/**" test
          else
            pnpm -r typecheck
            pnpm -r test
          fi
      - name: Pytest the bridge source contracts
        if: ${{ inputs.addons-profile == 'full' && matrix.group == 1 }}
        working-directory: stack
        run: >-
          uv run --no-sync --project "$GITHUB_WORKSPACE/stack"
          --directory "$GITHUB_WORKSPACE/stack/workspaces/src/angee-messaging-bridges"
          python -m pytest -q ${{ inputs.pytest-extra-args }}

  # Preserve the public check name and fail it for any unsuccessful matrix result.
  stack:
    if: ${{ always() && inputs.stack-enabled }}
    needs: [stack-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.stack-shard.result }}" = success
