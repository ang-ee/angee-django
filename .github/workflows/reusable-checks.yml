name: reusable checks

on:
  workflow_call:
    inputs:
      python-version:
        description: >-
          Python version for the uv lanes. Empty, uv reads the checked-out repository's
          .python-version, and the composed-stack lane the framework's
          (docs/checks.md#sqlite-version).
        required: false
        type: string
        default: ""
      pytest-extra-args:
        description: Optional arguments appended to the pytest command.
        required: false
        type: string
        default: ""
      uv-enabled:
        description: Run the monorepo's standalone uv pytest lane.
        required: false
        type: boolean
        default: true
      pnpm-enabled:
        description: Run package typecheck, test, build, and distribution checks.
        required: false
        type: boolean
        default: true
      stack-enabled:
        description: Run composed addon fragment checks and optional bridge source tests.
        required: false
        type: boolean
        default: false
      addons-profile:
        description: Addon composition profile; full is the only lane that checks out bridges.
        required: false
        type: string
        default: full
      framework-repository:
        description: Repository containing the framework ref under test.
        required: false
        type: string
        default: ang-ee/angee-django
      framework-ref:
        description: Framework ref used when another repository calls the stack lane.
        required: false
        type: string
        default: main
      bridges-ref:
        description: Bridges ref used when another repository calls the stack lane.
        required: false
        type: string
        default: main
      angee-version:
        description: Release version of the angee CLI the stack lane installs (without the v prefix).
        required: false
        type: string
        default: "0.28.0"
      consumer-sources:
        description: JSON array of additional addon sources with repository, path (sibling slot), and ref.
        required: false
        type: string
        default: "[]"
      consumer-roots:
        description: JSON array of explicit INSTALLED_APPS roots; empty preserves the framework profile.
        required: false
        type: string
        default: "[]"
      consumer-path:
        description: Sibling source slot to lint and test; empty disables consumer checks.
        required: false
        type: string
        default: ""
      consumer-extra:
        description: Native uv extra shared by the caller's selection proof and test workers.
        required: false
        type: string
        default: ""
      consumer-quality-tests:
        description: JSON array of source-only pytest files run in the consumer quality job.
        required: false
        type: string
        default: "[]"
      runs-on:
        description: >-
          Where every job runs, as a JSON runs-on value: "ubuntu-latest" for GitHub-hosted
          runners, or self-hosted labels such as ["self-hosted", "angee-local"]. Callers pass
          their CI_RUNS_ON variable.
        required: false
        type: string
        default: '"ubuntu-latest"'
    secrets:
      ADDON_SOURCES_TOKEN:
        description: Token with read access to every private consumer dependency source.
        required: false
      BRIDGES_TOKEN:
        description: Token able to read the optional messaging-bridges repo while it is private.
        required: false

permissions:
  contents: read

env:
  # uv runs its managed CPython, whose bundled SQLite the SQLite lanes need
  # (docs/checks.md#sqlite-version); a runner image's system Python links the
  # distribution's older library.
  UV_PYTHON_PREFERENCE: only-managed

  PRIMARY_SLOT: ${{ inputs.consumer-path || (github.repository == 'ang-ee/angee-messaging-bridges' && 'angee-messaging-bridges') || 'angee' }}
  COMPARE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  BRIDGE_SOURCE_GUARD: tests/test_layering.py
  FRAMEWORK_QUALITY_TESTS: >-
    tests/test_patch_targets.py tests/test_documentation_contracts.py tests/test_owner_index.py
    tests/test_agent_methodology.py tests/test_agent_owner_map_guard.py
    tests/test_agent_stack_root_policy.py tests/test_agent_work_state_policy.py
    tests/test_runtime_image.py tests/test_messaging_system_mail_callers.py tests/test_packaging.py
    tests/test_stack.py tests/test_layering.py tests/test_resource_fixtures.py
  FRAMEWORK_QUALITY_NODES: >-
    tests/test_stack_templates.py::test_stack_root_installs_with_the_framework_pnpm
    tests/test_stack_templates.py::test_playwright_image_matches_e2e_lock_version
    tests/test_stack_templates.py::test_stack_install_roots_compose_the_shared_pnpm_policy

jobs:
  python-quality:
    if: ${{ inputs.uv-enabled || inputs.consumer-path != '' || inputs.consumer-quality-tests != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        if: inputs.uv-enabled
      - uses: astral-sh/setup-uv@v7
        if: inputs.uv-enabled
        with:
          python-version: ${{ inputs.python-version }}
      - if: inputs.uv-enabled
        run: uv run --locked python -m ruff check . --no-cache
      - if: inputs.uv-enabled
        run: uv run --locked lint-imports --no-cache
      - if: inputs.uv-enabled
        run: uv run --locked python -m mypy src
        env:
          PYTHONPATH: src
      - name: Check framework source and emitted registry contracts without the shared host
        if: inputs.uv-enabled
        run: >-
          uv run --locked python -m pytest -p no:django --noconftest -c /dev/null --rootdir=. -q
          $FRAMEWORK_QUALITY_TESTS $FRAMEWORK_QUALITY_NODES
      - name: Start from an empty stack directory
        if: ${{ inputs.consumer-path != '' || inputs.consumer-quality-tests != '[]' }}
        run: rm -rf stack
      - uses: actions/checkout@v5
        if: ${{ inputs.consumer-path != '' || inputs.consumer-quality-tests != '[]' }}
        with:
          repository: ${{ inputs.framework-repository }}
          ref: ${{ github.repository == 'ang-ee/angee-django' && github.sha || inputs.framework-ref }}
          path: stack/workspaces/src/angee
      - uses: ./stack/workspaces/src/angee/.github/actions/prepare-checks
        if: ${{ inputs.consumer-path != '' || inputs.consumer-quality-tests != '[]' }}
        id: prepare
        with:
          slot: ${{ env.PRIMARY_SLOT }}
          extra: ${{ inputs.consumer-extra }}
          profile: ${{ inputs.addons-profile }}
          bridges-ref: ${{ inputs.bridges-ref }}
          sources: ${{ inputs.consumer-sources }}
          sources-token: ${{ secrets.ADDON_SOURCES_TOKEN || github.token }}
          bridges-token: ${{ secrets.BRIDGES_TOKEN || github.token }}
          angee-version: ${{ inputs.angee-version }}
          python-version: ${{ inputs.python-version }}
          roots: ${{ inputs.consumer-roots }}
      - name: Check consumer source without the shared host
        if: ${{ inputs.consumer-path != '' || inputs.consumer-quality-tests != '[]' }}
        working-directory: stack
        env:
          QUALITY_TESTS: ${{ inputs.consumer-quality-tests }}
        run: |
          .venv/bin/python -m ruff check "workspaces/src/$PRIMARY_SLOT" --no-cache
          mapfile -t tests < <(jq -r '.[]' <<< "$QUALITY_TESTS")
          if (("${#tests[@]}")); then
            cd "workspaces/src/$PRIMARY_SLOT"
            "$GITHUB_WORKSPACE/stack/.venv/bin/python" -m pytest -p no:django --noconftest -c /dev/null --rootdir=. -q "${tests[@]}"
          fi
      - name: Typecheck the consumer with the framework policy and native typing host
        if: ${{ inputs.consumer-path != '' }}
        working-directory: stack
        env:
          CONSUMER_PATH: ${{ inputs.consumer-path }}
          CONSUMER_SOURCES: ${{ inputs.consumer-sources }}
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          import tomlkit
          import yaml

          host = Path.cwd().resolve()
          slot = host / "workspaces/src" / os.environ["CONSUMER_PATH"]
          framework = host / "workspaces/src/angee"
          typing_root = host / ".mypy_cache/consumer_typing"
          typing_root.mkdir(parents=True, exist_ok=True)
          # Authored isolated settings use the same native configuration owner.
          (typing_root / "ci_consumer_typing.py").write_text((host / "settings.py").read_text())
          authored = yaml.safe_load((host / "settings.yaml").read_text())
          authored["COMPOSE_OUTPUT_DIR"] = str(typing_root / "ci_typing_runtime")
          authored["COMPOSE_OUTPUT_MODULE"] = "ci_typing_runtime"
          authored["DATABASES"] = {"default": {"ENGINE": "django.db.backends.sqlite3", "NAME": ":memory:"}}
          (typing_root / "settings.yaml").write_text(yaml.safe_dump(authored, sort_keys=False))
          # Locked angee-django-stubs gives its configured module priority over the env.
          # Reuse the full policy; change only that native project selection.
          policy = tomlkit.parse((framework / "pyproject.toml").read_text())
          policy["tool"]["django-stubs"]["django_settings_module"] = "ci_consumer_typing"
          config = typing_root / "mypy.toml"
          config.write_text(tomlkit.dumps(policy))
          os.environ["ANGEE_PROJECT_DIR"] = str(typing_root)
          os.environ.pop("DATABASE_URL", None)
          os.environ.pop("YAMLCONF_CONFFILE", None)
          os.environ["PYTHONPATH"] = os.pathsep.join(filter(None, (
              str(typing_root), str(framework), os.environ.get("PYTHONPATH"),
          )))
          source_roots = sorted(
              str(host / "workspaces/src" / source["path"] / "src")
              for source in json.loads(os.environ["CONSUMER_SOURCES"])
          )
          os.environ["MYPYPATH"] = os.pathsep.join(dict.fromkeys(filter(None, (
              str(typing_root), str(slot / "src"), *source_roots, os.environ.get("MYPYPATH"),
          ))))
          subprocess.run([
              sys.executable, "-m", "mypy", "--config-file", str(config),
              str(slot / "src"),
          ], cwd=framework, check=True)
          PY

  # One plan for scripts, isolated addon suites, workspace packages and composed checks.
  select:
    if: ${{ inputs.uv-enabled || inputs.stack-enabled || inputs.pnpm-enabled }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      sqlite-groups: ${{ steps.select.outputs.sqlite-groups }}
      postgres-tests: ${{ steps.select.outputs.postgres-tests }}
      postgres-groups: ${{ steps.select.outputs.postgres-groups }}
      stack-matrix: ${{ steps.select.outputs.stack-matrix }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ inputs.uv-enabled && !inputs.stack-enabled }}
      - uses: astral-sh/setup-uv@v7
        if: ${{ inputs.uv-enabled && !inputs.stack-enabled }}
        with:
          python-version: ${{ inputs.python-version }}
      # The selector uses the same managed install and donor as the worker.
      - name: Start from an empty stack directory
        if: ${{ inputs.stack-enabled || !inputs.uv-enabled }}
        run: rm -rf stack
      - uses: actions/checkout@v5
        if: ${{ inputs.stack-enabled || !inputs.uv-enabled }}
        with:
          repository: ${{ inputs.framework-repository }}
          ref: ${{ github.repository == 'ang-ee/angee-django' && github.sha || inputs.framework-ref }}
          path: stack/workspaces/src/angee
      - uses: ./stack/workspaces/src/angee/.github/actions/prepare-checks
        if: ${{ inputs.stack-enabled || !inputs.uv-enabled }}
        id: prepare
        with:
          slot: ${{ env.PRIMARY_SLOT }}
          extra: ${{ inputs.consumer-extra }}
          profile: ${{ inputs.addons-profile }}
          bridges-ref: ${{ inputs.bridges-ref }}
          sources: ${{ inputs.consumer-sources }}
          sources-token: ${{ secrets.ADDON_SOURCES_TOKEN || github.token }}
          bridges-token: ${{ secrets.BRIDGES_TOKEN || github.token }}
          angee-version: ${{ inputs.angee-version }}
          python-version: ${{ inputs.python-version }}
          roots: ${{ inputs.consumer-roots }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.3
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Check the pinned bridge source boundary
        if: ${{ inputs.uv-enabled && inputs.stack-enabled && inputs.addons-profile == 'full' }}
        working-directory: stack/workspaces/src/angee-messaging-bridges
        run: >-
          "$GITHUB_WORKSPACE/stack/.venv/bin/python" -m pytest -q -p no:django --noconftest "$BRIDGE_SOURCE_GUARD"
      - id: select
        shell: bash
        env:
          UV_ENABLED: ${{ inputs.uv-enabled }}
          USE_STACK: ${{ inputs.stack-enabled || !inputs.uv-enabled }}
          HEAD_SHA: ${{ github.sha }}
          DONOR: ${{ steps.prepare.outputs.donor }}
          EXTRA: ${{ inputs.consumer-extra }}
          ROOTS: ${{ inputs.consumer-roots }}
          QUALITY_TESTS: ${{ inputs.consumer-quality-tests }}
        run: |
          base=$COMPARE_BASE
          if [[ "$base" =~ ^0+$ ]]; then base=; fi
          slot=$PWD
          python=( uv run --locked python )
          if [ "$USE_STACK" = true ]; then
            slot="$PWD/stack/workspaces/src/$PRIMARY_SLOT"
            python=( "$PWD/stack/.venv/bin/python" )
          fi
          if [ -n "$base" ] && ! git -C "$slot" cat-file -e "$base^{commit}"; then
            git -C "$slot" fetch --depth=1 origin "$base" || echo "::warning::Comparison base unavailable; running full tests"
          fi
          compare=( --base "$base" --head "$HEAD_SHA" )
          if [ -n "$DONOR" ]; then compare+=( --donor "$DONOR" ); fi
          args=()
          if [ "$UV_ENABLED" = true ]; then
            for test_path in $FRAMEWORK_QUALITY_TESTS; do args+=( --ignore "$test_path" ); done
            for node in $FRAMEWORK_QUALITY_NODES; do args+=( --deselect "$node" ); done
            plan=$(cd "$slot" && "${python[@]}" scripts/changed_path_selection.py framework "${compare[@]}" -- "${args[@]}")
            postgres=( scripts/postgres_selection.py )
            if [ "$(jq -r '.shared.mode' <<< "$plan")" = full ]; then postgres+=( --all ); fi
            reached=$(jq -r '.shared.paths[]' <<< "$plan")
            postgres_tests=$(cd "$slot" && "${python[@]}" "${postgres[@]}" <<< "$reached")
            postgres_groups=$(cd "$slot" && "${python[@]}" "${postgres[@]}" --groups <<< "$reached")
          else
            if [ -n "$EXTRA" ]; then args+=( --extra "$EXTRA" ); fi
            while IFS= read -r app; do args+=( --app "$app" ); done < <(jq -r '.[]' <<< "$ROOTS")
            ignore=()
            while IFS= read -r test_path; do ignore+=( --ignore "$test_path" ); done < <(jq -r '.[]' <<< "$QUALITY_TESTS")
            plan=$("${python[@]}" stack/workspaces/src/angee/scripts/changed_path_selection.py \
              plan --root "$slot" "${compare[@]}" "${args[@]}" -- "${ignore[@]}")
            postgres_tests=
            postgres_groups='[]'
          fi
          jq . <<< "$plan"
          matrix=$(jq -c --arg slot "$PRIMARY_SLOT" '
            .shared.mode as $shared |
            (if .stack.mode != "empty" or ($slot == "angee-messaging-bridges" and $shared != "empty")
             then [{kind: "integration", group: 1, splits: 1}] else [] end)
            + (if $slot != "angee" and $slot != "angee-messaging-bridges" then
                (if $shared == "full" then 5 elif $shared == "selected" then 1 else 0 end) as $splits |
                [range(1; $splits + 1) | {kind: "consumer", group: ., splits: $splits}]
               else [] end)
          ' <<< "$plan")
          {
            echo "plan=$(jq -c . <<< "$plan")"
            echo "sqlite-groups=$(jq -c '.groups // []' <<< "$plan")"
            echo "postgres-tests=$(printf '%s' "$postgres_tests" | tr '\n' ' ')"
            echo "postgres-groups=$postgres_groups"
            echo "stack-matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  uv-shard:
    name: uv ${{ matrix.group }}/${{ strategy.job-total }}
    needs: select
    if: ${{ inputs.uv-enabled && needs.select.outputs.sqlite-groups != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.select.outputs.sqlite-groups) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - shell: bash
        env:
          TESTS: ${{ toJSON(fromJSON(needs.select.outputs.plan).shared.paths) }}
          MODE: ${{ fromJSON(needs.select.outputs.plan).shared.mode }}
          GROUP: ${{ matrix.group }}
          SPLITS: ${{ strategy.job-total }}
        run: |
          mapfile -t tests < <(jq -r '.[]' <<< "$TESTS")
          args=()
          for test_path in $FRAMEWORK_QUALITY_TESTS; do args+=( --ignore "$test_path" ); done
          for node in $FRAMEWORK_QUALITY_NODES; do args+=( --deselect "$node" ); done
          if [ "$SPLITS" -gt 1 ]; then args+=( --splits "$SPLITS" --group "$GROUP" ); fi
          uv run --locked pytest -q -n auto --dist loadfile --durations=25 \
            ${{ inputs.pytest-extra-args }} "${args[@]}" "${tests[@]}" \
            || { [ $? -eq 5 ] && [ "$MODE" = selected ] && [ "$SPLITS" -gt 1 ]; }

  # The PostgreSQL selection is balanced over its own timing map
  # (.test_durations_postgres, least_duration): every worker flushes the
  # whole schema between transactional tests, so one job no longer fits.
  # Six groups under the SQLite shards' 60-minute limit keep the margin the
  # map cannot predict. The select job sets the entries and the groups.
  uv-postgres:
    name: uv postgres ${{ matrix.group }}/${{ strategy.job-total }}
    needs: select
    if: ${{ inputs.uv-enabled && needs.select.outputs.postgres-groups != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    env:
      # A push to main measures the tests each group runs and keeps the measurements
      # for the timing map refresh in docs/checks.md; CI never writes the map itself.
      RECORD_DURATIONS: ${{ github.ref == 'refs/heads/main' && fromJSON(needs.select.outputs.plan).shared.mode == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.select.outputs.postgres-groups) }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: angee
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d angee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Size the lock table for one-pass schema creation
        # Each worker creates every table in one transaction, which the default
        # lock table (64 per transaction x 100 connections) no longer holds.
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d angee -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres -d angee; do sleep 1; done
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d angee -tAc "SHOW max_locks_per_transaction"
          # Docker published the service on a free host port, so jobs sharing one Docker
          # host never collide; the restart can move it, so the URL is read after it.
          port=$(docker inspect --format '{{ (index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort }}' ${{ job.services.postgres.id }})
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:$port/angee" >> "$GITHUB_ENV"
      - name: Enable pgvector for test databases
        # --nomigrations and composed hosts create tables without the pre_migrate
        # extension receiver; each native test database inherits template1.
        run: docker exec ${{ job.services.postgres.id }} psql -U postgres -d template1 -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm"
      - name: Verify PostgreSQL contracts execute without skips
        # Every PostgreSQL-only contract (row and advisory locks, MVCC reads,
        # two-writer campaigns, vendor branches by node id) with the workflow,
        # decision and agent-session selection, and the authorization contracts
        # the PostgreSQL lane's rule in docs/checks.md admits, in up to six
        # duration-balanced groups.
        # These source tests register bare concrete Django models, so PostgreSQL
        # must create their tables in one sync-app pass.
        # The selection is .github/postgres-selection.txt; a pull request runs the
        # entries its changed paths reach. The examples profile's planner-memory
        # gate follows its declared inputs, including changes to permissions.
        env:
          TESTS: ${{ needs.select.outputs.postgres-tests }}
        run: |
          # read splits without globbing, so a parametrized node id stays one argument.
          read -ra tests <<< "$TESTS"
          # Recording, the group splits by its own copy of the map, which pytest-split
          # then overwrites with the durations of exactly the tests the group ran.
          durations=.test_durations_postgres
          record=()
          if [ "$RECORD_DURATIONS" = true ]; then
            durations=postgres-durations-${{ matrix.group }}.json
            cp .test_durations_postgres "$durations"
            record=(--store-durations --clean-durations)
          fi
          uv run --locked python -m pytest -q -n 4 --dist loadfile --nomigrations --durations=25 --junitxml=postgresql-contracts.xml \
            --splits ${{ strategy.job-total }} --group ${{ matrix.group }} --splitting-algorithm least_duration \
            --durations-path "$durations" "${record[@]}" "${tests[@]}"
          uv run --locked python -c 'import xml.etree.ElementTree as ET; root = ET.parse("postgresql-contracts.xml").getroot(); cases = list(root.iter("testcase")); skipped = sum(any(child.tag.rsplit("}", 1)[-1] == "skipped" for child in case) for case in cases); assert cases and skipped == 0, f"expected executed PostgreSQL tests, got tests={len(cases)}, skipped={skipped}"; print(f"PostgreSQL tests={len(cases)}, skipped={skipped}")'
      - name: Keep the group's measured durations
        # A green group's measurements and its JUnit report, for two weeks.
        if: env.RECORD_DURATIONS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: postgres-durations-${{ matrix.group }}
          path: |
            postgres-durations-${{ matrix.group }}.json
            postgresql-contracts.xml
          retention-days: 14

  addon-hosts:
    name: addon hosts
    needs: select
    if: ${{ toJSON(fromJSON(needs.select.outputs.plan).hosts.paths) != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: inputs.uv-enabled
      - uses: astral-sh/setup-uv@v7
        if: inputs.uv-enabled
        with:
          python-version: ${{ inputs.python-version }}
      - uses: actions/cache@v4
        if: inputs.uv-enabled
        with:
          path: .test-hosts/*/composed_test_runtime
          key: test-hosts-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/**/*.py', 'src/**/*.zed', 'src/**/pyproject.toml', '!src/**/tests/**') }}
          restore-keys: test-hosts-${{ hashFiles('uv.lock') }}-
      - name: Start from an empty stack directory
        if: ${{ !inputs.uv-enabled }}
        run: rm -rf stack
      - uses: actions/checkout@v5
        if: ${{ !inputs.uv-enabled }}
        with:
          repository: ${{ inputs.framework-repository }}
          ref: ${{ github.repository == 'ang-ee/angee-django' && github.sha || inputs.framework-ref }}
          path: stack/workspaces/src/angee
      - uses: ./stack/workspaces/src/angee/.github/actions/prepare-checks
        if: ${{ !inputs.uv-enabled }}
        id: prepare
        with:
          slot: ${{ env.PRIMARY_SLOT }}
          extra: ${{ inputs.consumer-extra }}
          profile: ${{ inputs.addons-profile }}
          bridges-ref: ${{ inputs.bridges-ref }}
          sources: ${{ inputs.consumer-sources }}
          sources-token: ${{ secrets.ADDON_SOURCES_TOKEN || github.token }}
          bridges-token: ${{ secrets.BRIDGES_TOKEN || github.token }}
          angee-version: ${{ inputs.angee-version }}
          python-version: ${{ inputs.python-version }}
          roots: ${{ inputs.consumer-roots }}
      - shell: bash
        env:
          UV_ENABLED: ${{ inputs.uv-enabled }}
          ADDON_HOSTS: ${{ toJSON(fromJSON(needs.select.outputs.plan).hosts.paths) }}
        run: |
          python=( uv run --locked python )
          if [ "$UV_ENABLED" = false ]; then
            python=( "$PWD/stack/.venv/bin/python" )
            cd "stack/workspaces/src/$PRIMARY_SLOT"
          fi
          mapfile -t addons < <(jq -r '.[]' <<< "$ADDON_HOSTS")
          status=0
          for addon in "${addons[@]}"; do
            echo "::group::$addon"
            "${python[@]}" -m angee.base.testing.host "$addon" -q --durations=10 || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # Preserve the required check name and accept only skips justified by the plan.
  uv:
    if: ${{ always() && inputs.uv-enabled }}
    needs: [python-quality, select, uv-shard, uv-postgres, addon-hosts]
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          PLAN: ${{ needs.select.outputs.plan }}
          SELECT: ${{ needs.select.result }}
          QUALITY: ${{ needs.python-quality.result }}
          SQLITE: ${{ needs.uv-shard.result }}
          SQLITE_GROUPS: ${{ needs.select.outputs.sqlite-groups }}
          POSTGRES: ${{ needs.uv-postgres.result }}
          POSTGRES_GROUPS: ${{ needs.select.outputs.postgres-groups }}
          HOSTS: ${{ needs.addon-hosts.result }}
        run: |
          test "$SELECT" = success
          test "$QUALITY" = success
          test "$SQLITE" = success || { test "$SQLITE" = skipped && test "$SQLITE_GROUPS" = '[]'; } || exit 1
          test "$POSTGRES" = success || { test "$POSTGRES" = skipped && test "$POSTGRES_GROUPS" = '[]'; } || exit 1
          test "$HOSTS" = success || { test "$HOSTS" = skipped && jq -e '.hosts.paths == []' <<< "$PLAN"; } || exit 1

  pnpm:
    needs: select
    if: ${{ inputs.pnpm-enabled && fromJSON(needs.select.outputs.plan).packages.mode != 'empty' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # The action empties its destination first, so on runners sharing one home its
      # default ~/setup-pnpm lets one job delete another's pnpm mid-run.
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.3
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          # GitHub's cache only on GitHub-hosted runners; a self-hosted runner installs from
          # the registry and leaves the repository's cache space to them.
          # package-manager-cache turns off the caching v5 otherwise starts on its own
          # from package.json's packageManager.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check reached framework packages
        env:
          PACKAGES: ${{ toJSON(fromJSON(needs.select.outputs.plan).packages) }}
        run: |
          filters=( --filter './packages/**' )
          if [ "$(jq -r '.mode' <<< "$PACKAGES")" = selected ]; then
            filters=( --filter '!./src/**' --filter '!./examples/**' )
            while IFS= read -r directory; do filters+=( --filter "...{./$directory}" ); done < <(
              jq -r '.paths[]' <<< "$PACKAGES"
            )
          fi
          pnpm -r --fail-if-no-match "${filters[@]}" typecheck
          pnpm -r --fail-if-no-match "${filters[@]}" test
      - run: pnpm -r --filter './packages/**' --filter '!@angee/storybook' build
      - run: node packages/scripts/check-dist-imports.mjs
      - run: node packages/ui/scripts/check-views-exports.mjs

  # Consumers keep their authored project roots for legacy tests and use native
  # addon roots for a focused integration. The matrix does not encode test policy.
  stack-shard:
    name: stack ${{ matrix.kind }} ${{ matrix.group }}/${{ matrix.splits }}
    needs: select
    if: ${{ inputs.stack-enabled && needs.select.outputs.stack-matrix != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.stack-matrix) }}
    services:
      postgres:
        image: >-
          ${{ (matrix.kind == 'consumer' || fromJSON(needs.select.outputs.plan).stack.mode == 'full' ||
          (fromJSON(needs.select.outputs.plan).stack.mode == 'selected' &&
          fromJSON(needs.select.outputs.plan).packages.mode == 'empty')) && 'pgvector/pgvector:pg17' || '' }}
        env:
          POSTGRES_DB: angee
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d angee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Start from an empty stack directory
        run: rm -rf stack
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.framework-repository }}
          ref: ${{ github.repository == 'ang-ee/angee-django' && github.sha || inputs.framework-ref }}
          path: stack/workspaces/src/angee
      - uses: ./stack/workspaces/src/angee/.github/actions/prepare-checks
        id: prepare
        with:
          slot: ${{ env.PRIMARY_SLOT }}
          extra: ${{ inputs.consumer-extra }}
          profile: ${{ inputs.addons-profile }}
          bridges-ref: ${{ inputs.bridges-ref }}
          sources: ${{ inputs.consumer-sources }}
          sources-token: ${{ secrets.ADDON_SOURCES_TOKEN || github.token }}
          bridges-token: ${{ secrets.BRIDGES_TOKEN || github.token }}
          angee-version: ${{ inputs.angee-version }}
          python-version: ${{ inputs.python-version }}
          roots: >-
            ${{ matrix.kind == 'integration' &&
            fromJSON(needs.select.outputs.plan).stack.mode == 'selected' &&
            fromJSON(needs.select.outputs.plan).packages.mode == 'empty' &&
            toJSON(fromJSON(needs.select.outputs.plan).stack.paths) || inputs.consumer-roots }}
      - name: Fetch the verified comparison base for native pytest
        if: ${{ env.PRIMARY_SLOT != 'angee' && fromJSON(needs.select.outputs.plan).shared.mode == 'selected' }}
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          slot="stack/workspaces/src/$PRIMARY_SLOT"
          if ! git -C "$slot" cat-file -e "$COMPARE_BASE^{commit}"; then
            git -C "$slot" fetch --depth=1 origin "$COMPARE_BASE"
          fi
          test "$(git -C "$slot" rev-parse HEAD)" = "$HEAD_SHA"
          {
            echo "TEST_BASE=$COMPARE_BASE"
            echo "TEST_HEAD=$HEAD_SHA"
          } >> "$GITHUB_ENV"
      - name: Enable pgvector for provision or PostgreSQL pytest
        if: >-
          ${{ matrix.kind == 'consumer' || fromJSON(needs.select.outputs.plan).stack.mode == 'full' ||
          (fromJSON(needs.select.outputs.plan).stack.mode == 'selected' &&
          fromJSON(needs.select.outputs.plan).packages.mode == 'empty') }}
        run: |
          for database in angee template1; do
            docker exec ${{ job.services.postgres.id }} psql -U postgres -d "$database" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm"
          done
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/angee" >> "$GITHUB_ENV"
      - name: Compose the runtime
        if: ${{ matrix.kind == 'consumer' || fromJSON(needs.select.outputs.plan).stack.mode != 'empty' }}
        working-directory: stack
        run: .venv/bin/python manage.py compose
      - name: Verify native migration history and SDL
        if: ${{ matrix.kind == 'integration' && fromJSON(needs.select.outputs.plan).stack.mode != 'empty' }}
        working-directory: stack
        run: |
          .venv/bin/python manage.py makemigrations --noinput
          .venv/bin/python manage.py makemigrations --check --dry-run
          .venv/bin/python manage.py compose --check
          .venv/bin/python manage.py schema --check
      - name: Validate resources on the selected composition
        if: >-
          ${{ matrix.kind == 'integration' && fromJSON(needs.select.outputs.plan).stack.mode == 'selected' &&
          fromJSON(needs.select.outputs.plan).packages.mode == 'empty' }}
        working-directory: stack
        run: |
          resources=$(.venv/bin/python manage.py shell --verbosity 0 -c \
            'from django.apps import apps; print(apps.is_installed("angee.resources"))')
          if [ "$resources" = False ]; then exit 0; fi
          test "$resources" = True
          .venv/bin/python manage.py migrate --noinput
          # Populate the empty test database's permission schema before system checks.
          .venv/bin/python manage.py rebac --skip-checks sync
          .venv/bin/python manage.py check --database default
          .venv/bin/python manage.py resources validate --include-demo
      - name: Provision the composed stack
        if: ${{ matrix.kind == 'integration' && fromJSON(needs.select.outputs.plan).stack.mode == 'full' }}
        working-directory: stack
        run: .venv/bin/python manage.py provision
      # Composition escapes the bare source host cannot see: every system check on the
      # composed models, the demo tier loading, and every folded model with a row loading
      # one with only its primary key and saving it again (deferred-column reads,
      # MRO-ordered save overrides). Append-only models refuse edits by contract, so they
      # only load.
      - name: Smoke the composed models
        if: ${{ matrix.kind == 'integration' && fromJSON(needs.select.outputs.plan).stack.mode == 'full' }}
        working-directory: stack
        run: |
          .venv/bin/python manage.py check --database default
          .venv/bin/python manage.py resources load --include-demo
          .venv/bin/python manage.py shell -c '
          from django.apps import apps
          from rebac import system_context

          from angee.base.addons import is_angee_addon
          from angee.base.models.append_only import AppendOnlyModel

          failures, loaded = [], 0
          with system_context(reason="ci.composed_model_smoke"):
              for model in apps.get_models():
                  if model._meta.managed and is_angee_addon(model._meta.app_config):
                      try:
                          for row in model._base_manager.only("pk")[:1]:
                              loaded += 1
                              if not issubclass(model, AppendOnlyModel):
                                  row.save()
                      except Exception as error:
                          failures.append(f"{model._meta.label}: {error!r}")
          print(f"Loaded and saved one row of {loaded} composed models.")
          assert not failures, "\n".join(failures)
          '
      - name: Size the PostgreSQL lock table for consumer test schemas
        if: ${{ matrix.kind == 'consumer' }}
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d angee -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres -d angee; do sleep 1; done
          # Docker published the service on a free host port, so jobs sharing one Docker
          # host never collide; the restart can move it, so the URL is read after it.
          port=$(docker inspect --format '{{ (index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort }}' ${{ job.services.postgres.id }})
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:$port/angee" >> "$GITHUB_ENV"
      - name: Run the consumer's PostgreSQL test shard
        if: ${{ matrix.kind == 'consumer' }}
        working-directory: stack
        env:
          ANGEE_PROJECT_DIR: ${{ github.workspace }}/stack
          DJANGO_SETTINGS_MODULE: settings
          QUALITY_TESTS: ${{ inputs.consumer-quality-tests }}
          CONSUMER_ROOTS: ${{ inputs.consumer-roots }}
          CONSUMER_EXTRA: ${{ inputs.consumer-extra }}
          CONSUMER_SPLITS: ${{ matrix.splits }}
          CONSUMER_GROUP: ${{ matrix.group }}
          DONOR: ${{ steps.prepare.outputs.donor }}
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          import django

          host = Path.cwd().resolve()
          slot = (host / "workspaces/src" / os.environ["PRIMARY_SLOT"]).resolve()
          os.environ["PYTHONPATH"] = os.pathsep.join(filter(None, (str(host), os.environ.get("PYTHONPATH"))))
          os.chdir(slot)
          sys.path[:0] = [str(slot), str(host), str(host / "workspaces/src/angee/scripts")]
          from changed_path_selection import run_selected

          django.setup()
          args = ["-n", "4", "--dist", "worksteal", "-q", "--durations=25", "-o", "faulthandler_timeout=300"]
          for test_path in json.loads(os.environ["QUALITY_TESTS"]):
              args.extend(("--ignore", test_path))
          splits = os.environ["CONSUMER_SPLITS"]
          if int(splits) > 1:
              args.extend((
                  "--splits", splits, "--group", os.environ["CONSUMER_GROUP"],
                  "--splitting-algorithm", "least_duration",
              ))
          extra = os.environ["CONSUMER_EXTRA"]
          donor = os.environ["DONOR"]
          raise SystemExit(run_selected(
              args, root=slot, base=os.environ.get("TEST_BASE"), head=os.environ.get("TEST_HEAD"),
              apps=json.loads(os.environ["CONSUMER_ROOTS"]), extra=(extra,) if extra else (),
              donor=Path(donor) if donor else None,
          ))
          PY
      - name: Identify the composed web projects
        id: fragments
        if: ${{ matrix.kind == 'integration' && fromJSON(needs.select.outputs.plan).stack.mode != 'empty' }}
        working-directory: stack
        env:
          PLAN: ${{ needs.select.outputs.plan }}
        run: |
          filters=()
          mode=$(jq -r '.stack.mode' <<< "$PLAN")
          package_mode=$(jq -r '.packages.mode' <<< "$PLAN")
          if [ "$mode" = full ] || [ "$package_mode" = full ]; then
            if [ "$PRIMARY_SLOT" = angee ] || [ "$PRIMARY_SLOT" = angee-messaging-bridges ]; then
              filters+=( --filter '!./workspaces/src/angee/packages/**' )
            else
              filters+=( --filter "./workspaces/src/$PRIMARY_SLOT/src/**" )
            fi
          else
            if [ -f runtime/web/manifest.json ]; then
              roots=$(jq -c '.stack.paths' <<< "$PLAN")
              while IFS= read -r name; do filters+=( --filter "...$name" ); done < <(
                jq -r --argjson roots "$roots" '
                  .addonPackages[] | .app as $app | select($roots | index($app)) | .package
                ' runtime/web/manifest.json
              )
            fi
            while IFS= read -r directory; do
              filters+=( --filter "...{./workspaces/src/$PRIMARY_SLOT/$directory}" )
            done < <(jq -r '.packages.paths[]' <<< "$PLAN")
            if (("${#filters[@]}")); then filters+=( --filter '!./workspaces/src/angee/packages/**' ); fi
          fi
          if (("${#filters[@]}")); then
            printf '%s\n' "${filters[@]}" > .ci-fragment-filters
            echo "reached=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v5
        if: steps.fragments.outputs.reached == 'true'
        with:
          version: 11.1.3
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v5
        if: steps.fragments.outputs.reached == 'true'
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Check reached fragments against generated documents
        if: steps.fragments.outputs.reached == 'true'
        working-directory: stack
        run: |
          cp "workspaces/src/$PRIMARY_SLOT/.github/ci/pnpm-lock.yaml" pnpm-lock.yaml
          pnpm install --frozen-lockfile
          pnpm --config.verify-deps-before-run=false --dir web exec angee-web-codegen --runtime ../runtime --web-root .
          mapfile -t filters < .ci-fragment-filters
          pnpm -r --fail-if-no-match "${filters[@]}" typecheck
          pnpm -r --fail-if-no-match --workspace-concurrency=1 "${filters[@]}" test
      - name: Pytest the bridge source contracts
        if: >-
          ${{ matrix.kind == 'integration' &&
          ((env.PRIMARY_SLOT == 'angee-messaging-bridges' && fromJSON(needs.select.outputs.plan).shared.mode != 'empty') ||
           (env.PRIMARY_SLOT == 'angee' && inputs.addons-profile == 'full' && fromJSON(needs.select.outputs.plan).stack.mode != 'empty')) }}
        working-directory: stack/workspaces/src/angee-messaging-bridges
        env:
          DONOR: ${{ steps.prepare.outputs.donor }}
          QUALITY_TESTS: ${{ inputs.consumer-quality-tests }}
          STACK_MODE: ${{ fromJSON(needs.select.outputs.plan).stack.mode }}
          REACHED_ROOTS: ${{ toJSON(fromJSON(needs.select.outputs.plan).stack.paths) }}
        run: |
          if [ "$PRIMARY_SLOT" = angee ] && [ "$STACK_MODE" = selected ]; then
            reached=$("$GITHUB_WORKSPACE/stack/.venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          from django_compose.components import inspect_apps

          roots = json.loads(os.environ["REACHED_ROOTS"])
          entries = inspect_apps(roots, group="angee.addons")["app_entries"] if roots else []
          print(any(
              entry["name"] in roots and Path(entry["path"]).is_relative_to(Path.cwd())
              for entry in entries
          ))
          PY
            )
            if [ "$reached" = False ]; then
              echo "No bridge source provider reached."
              exit 0
            fi
          fi
          args=()
          ignore=()
          if [ -n "$DONOR" ]; then args+=( --donor "$DONOR" ); fi
          if [ "$PRIMARY_SLOT" = angee ]; then ignore+=( --ignore "$BRIDGE_SOURCE_GUARD" ); fi
          while IFS= read -r test_path; do ignore+=( --ignore "$test_path" ); done < <(jq -r '.[]' <<< "$QUALITY_TESTS")
          env -u DATABASE_URL "$GITHUB_WORKSPACE/stack/.venv/bin/python" ../angee/scripts/changed_path_selection.py pytest \
            --base "${TEST_BASE:-}" --head "${TEST_HEAD:-}" "${args[@]}" -- -q "${ignore[@]}" ${{ inputs.pytest-extra-args }}

  # A green aggregate requires the exact plan and each enabled worker's verdict.
  stack:
    if: ${{ always() && inputs.stack-enabled }}
    needs: [select, stack-shard, addon-hosts, python-quality]
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          PLAN: ${{ needs.select.outputs.plan }}
          SELECT: ${{ needs.select.result }}
          MATRIX: ${{ needs.select.outputs.stack-matrix }}
          SHARDS: ${{ needs.stack-shard.result }}
          HOSTS: ${{ needs.addon-hosts.result }}
          QUALITY: ${{ needs.python-quality.result }}
          QUALITY_ENABLED: ${{ inputs.consumer-path != '' || inputs.consumer-quality-tests != '[]' }}
        run: |
          test "$SELECT" = success
          test "$SHARDS" = success || { test "$SHARDS" = skipped && test "$MATRIX" = '[]'; } || exit 1
          test "$HOSTS" = success || { test "$HOSTS" = skipped && jq -e '.hosts.paths == []' <<< "$PLAN"; } || exit 1
          if [ "$QUALITY_ENABLED" = true ]; then test "$QUALITY" = success; fi
