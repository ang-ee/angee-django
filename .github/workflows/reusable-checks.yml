name: reusable checks

on:
  workflow_call:
    inputs:
      python-version:
        description: >-
          Python version for the uv lanes. Empty, uv reads the checked-out repository's
          .python-version, and the composed-stack lane the framework's
          (docs/checks.md#sqlite-version).
        required: false
        type: string
        default: ""
      pytest-extra-args:
        description: Optional arguments appended to the pytest command.
        required: false
        type: string
        default: ""
      uv-enabled:
        description: Run the monorepo's standalone uv pytest lane.
        required: false
        type: boolean
        default: true
      pnpm-enabled:
        description: Run package typecheck, test, build, and distribution checks.
        required: false
        type: boolean
        default: true
      stack-enabled:
        description: Run composed addon fragment checks and optional bridge source tests.
        required: false
        type: boolean
        default: false
      pr-checks-enabled:
        description: >-
          Run the lanes a pull request's own run already ran on the tree a merge commit gives main
          (the packages and the composed stack). A caller passes false on a push to main, where the
          SQLite suite and the PostgreSQL selection, which a pull request runs in part, run whole.
        required: false
        type: boolean
        default: true
      addons-profile:
        description: Addon composition profile; full is the only lane that checks out bridges.
        required: false
        type: string
        default: full
      framework-repository:
        description: Repository containing the framework ref under test.
        required: false
        type: string
        default: ang-ee/angee-django
      framework-ref:
        description: Framework ref used when another repository calls the stack lane.
        required: false
        type: string
        default: main
      bridges-ref:
        description: Bridges ref used when another repository calls the stack lane.
        required: false
        type: string
        default: main
      angee-version:
        description: Release version of the angee CLI the stack lane installs (without the v prefix).
        required: false
        type: string
        default: "0.28.0"
      consumer-sources:
        description: JSON array of additional addon sources with repository, path (sibling slot), and ref.
        required: false
        type: string
        default: "[]"
      consumer-roots:
        description: JSON array of explicit INSTALLED_APPS roots; empty preserves the framework profile.
        required: false
        type: string
        default: "[]"
      consumer-path:
        description: Sibling source slot to lint and test; empty disables consumer checks.
        required: false
        type: string
        default: ""
      consumer-tests:
        description: JSON array of test paths relative to the consumer slot, including addon tests.
        required: false
        type: string
        default: "[]"
      consumer-pytest-plugins:
        description: JSON array of additional owning test-fixture plugins for the consumer.
        required: false
        type: string
        default: "[]"
      runs-on:
        description: >-
          Where every job runs, as a JSON runs-on value: "ubuntu-latest" for GitHub-hosted
          runners, or self-hosted labels such as ["self-hosted", "angee-local"]. Callers pass
          their CI_RUNS_ON variable.
        required: false
        type: string
        default: '"ubuntu-latest"'
    secrets:
      ADDON_SOURCES_TOKEN:
        description: Token with read access to every private consumer dependency source.
        required: false
      BRIDGES_TOKEN:
        description: Token able to read the optional messaging-bridges repo while it is private.
        required: false

permissions:
  contents: read

env:
  # uv runs its managed CPython, whose bundled SQLite the SQLite lanes need
  # (docs/checks.md#sqlite-version); a runner image's system Python links the
  # distribution's older library.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  python-quality:
    if: ${{ inputs.uv-enabled }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: uv run --locked python -m ruff check . --no-cache
      - run: uv run --locked lint-imports --no-cache
      - run: uv run --locked python -m mypy src
        env:
          PYTHONPATH: src
      # Static test contracts read source and docs without Django: patch
      # targets, documentation links and recipes, the agent methodology, and the
      # runtime image's Dockerfile, whose Python follows .python-version.
      - run: >-
          uv run --locked python -m pytest -p no:django --noconftest -c /dev/null --rootdir=. -q
          tests/test_patch_targets.py tests/test_documentation_contracts.py tests/test_owner_index.py
          tests/test_agent_methodology.py tests/test_agent_owner_map_guard.py
          tests/test_agent_stack_root_policy.py tests/test_agent_work_state_policy.py
          tests/test_runtime_image.py

  # One selection for the framework's SQLite shards, PostgreSQL groups and addon hosts.
  select:
    if: ${{ inputs.uv-enabled }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    outputs:
      sqlite-mode: ${{ steps.select.outputs.sqlite-mode }}
      sqlite-tests: ${{ steps.select.outputs.sqlite-tests }}
      addon-hosts: ${{ steps.select.outputs.addon-hosts }}
      addon-host-count: ${{ steps.select.outputs.addon-host-count }}
      postgres-tests: ${{ steps.select.outputs.postgres-tests }}
      postgres-groups: ${{ steps.select.outputs.postgres-groups }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request's merge commit and its base give the changed paths.
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - id: select
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE" ] && ! git cat-file -e "$BASE^{commit}"; then
            git fetch --depth=1 origin "$BASE" || echo "::warning::Comparison base unavailable; running full tests"
          fi
          plan=$(uv run --locked python scripts/changed_path_selection.py framework --base "$BASE" --head "$HEAD_SHA")
          echo "$plan"
          sqlite_mode=$(jq -er '.shared.mode' <<< "$plan")
          reached=$(jq -er '.shared.paths[]?' <<< "$plan" || test "$sqlite_mode" = empty)
          postgres=(scripts/postgres_selection.py)
          if [ "$sqlite_mode" = full ]; then postgres+=(--all); fi
          postgres_tests=$(uv run --locked python "${postgres[@]}" <<< "$reached")
          postgres_groups=$(uv run --locked python "${postgres[@]}" --groups <<< "$reached")
          echo "PostgreSQL groups $postgres_groups: $postgres_tests"
          {
            echo "sqlite-mode=$sqlite_mode"
            echo "sqlite-tests=$(jq -ce '.shared.paths' <<< "$plan")"
            echo "addon-hosts=$(jq -ce '.hosts.paths' <<< "$plan")"
            echo "addon-host-count=$(jq -er '.hosts.paths | length' <<< "$plan")"
            echo "postgres-tests=$(printf '%s' "$postgres_tests" | tr '\n' ' ')"
            echo "postgres-groups=$postgres_groups"
          } >> "$GITHUB_OUTPUT"

  # The suite runs as six contiguous shards of equal stored time
  # (.test_durations, pytest-split); a test missing from it still runs in one.
  # loadfile keeps a file on one worker. Allow for long file-scoped campaigns
  # and runner cleanup; retain per-test timings for balancing the shards.
  uv-shard:
    name: uv ${{ matrix.group }}/6
    needs: select
    if: ${{ inputs.uv-enabled && needs.select.outputs.sqlite-mode != 'empty' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - shell: bash
        env:
          TESTS: ${{ needs.select.outputs.sqlite-tests }}
          MODE: ${{ needs.select.outputs.sqlite-mode }}
        run: |
          mapfile -t tests < <(jq -r '.[]' <<< "$TESTS")
          # A small selection can leave a shard nothing to run: pytest's exit code 5.
          uv run --locked pytest -q -n auto --dist loadfile --durations=25 \
            --splits 6 --group ${{ matrix.group }} ${{ inputs.pytest-extra-args }} "${tests[@]}" \
            || { [ $? -eq 5 ] && [ "$MODE" = selected ]; }

  # The PostgreSQL selection is balanced over its own timing map
  # (.test_durations_postgres, least_duration): every worker flushes the
  # whole schema between transactional tests, so one job no longer fits.
  # Six groups under the SQLite shards' 60-minute limit keep the margin the
  # map cannot predict. The select job sets the entries and the groups.
  uv-postgres:
    name: uv postgres ${{ matrix.group }}/${{ strategy.job-total }}
    needs: select
    if: ${{ inputs.uv-enabled && needs.select.outputs.postgres-groups != '[]' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    env:
      # A push to main measures the tests each group runs and keeps the measurements
      # for the timing map refresh in docs/checks.md; CI never writes the map itself.
      RECORD_DURATIONS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.select.outputs.postgres-groups) }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: angee
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d angee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Size the lock table for one-pass schema creation
        # Each worker creates every table in one transaction, which the default
        # lock table (64 per transaction x 100 connections) no longer holds.
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d angee -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres -d angee; do sleep 1; done
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d angee -tAc "SHOW max_locks_per_transaction"
          # Docker published the service on a free host port, so jobs sharing one Docker
          # host never collide; the restart can move it, so the URL is read after it.
          port=$(docker inspect --format '{{ (index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort }}' ${{ job.services.postgres.id }})
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:$port/angee" >> "$GITHUB_ENV"
      - name: Enable pgvector for test databases
        # --nomigrations and composed hosts create tables without the pre_migrate
        # extension receiver; each native test database inherits template1.
        run: docker exec ${{ job.services.postgres.id }} psql -U postgres -d template1 -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm"
      - name: Verify PostgreSQL contracts execute without skips
        # Every PostgreSQL-only contract (row and advisory locks, MVCC reads,
        # two-writer campaigns, vendor branches by node id) with the workflow,
        # decision and agent-session selection, and the authorization contracts
        # the PostgreSQL lane's rule in docs/checks.md admits, in up to six
        # duration-balanced groups.
        # These source tests register bare concrete Django models, so PostgreSQL
        # must create their tables in one sync-app pass.
        # The selection is .github/postgres-selection.txt; a pull request runs the
        # entries its changed paths reach. The examples profile's planner-memory
        # gate follows its declared inputs, including changes to permissions.
        env:
          TESTS: ${{ needs.select.outputs.postgres-tests }}
        run: |
          # read splits without globbing, so a parametrized node id stays one argument.
          read -ra tests <<< "$TESTS"
          # Recording, the group splits by its own copy of the map, which pytest-split
          # then overwrites with the durations of exactly the tests the group ran.
          durations=.test_durations_postgres
          record=()
          if [ "$RECORD_DURATIONS" = true ]; then
            durations=postgres-durations-${{ matrix.group }}.json
            cp .test_durations_postgres "$durations"
            record=(--store-durations --clean-durations)
          fi
          uv run --locked python -m pytest -q -n 4 --dist loadfile --nomigrations --durations=25 --junitxml=postgresql-contracts.xml \
            --splits ${{ strategy.job-total }} --group ${{ matrix.group }} --splitting-algorithm least_duration \
            --durations-path "$durations" "${record[@]}" "${tests[@]}"
          uv run --locked python -c 'import xml.etree.ElementTree as ET; root = ET.parse("postgresql-contracts.xml").getroot(); cases = list(root.iter("testcase")); skipped = sum(any(child.tag.rsplit("}", 1)[-1] == "skipped" for child in case) for case in cases); assert cases and skipped == 0, f"expected executed PostgreSQL tests, got tests={len(cases)}, skipped={skipped}"; print(f"PostgreSQL tests={len(cases)}, skipped={skipped}")'
      - name: Keep the group's measured durations
        # A green group's measurements and its JUnit report, for two weeks.
        if: env.RECORD_DURATIONS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: postgres-durations-${{ matrix.group }}
          path: |
            postgres-durations-${{ matrix.group }}.json
            postgresql-contracts.xml
          retention-days: 14

  # One bounded job for every selected addon host.
  addon-hosts:
    name: addon hosts
    needs: select
    if: ${{ inputs.uv-enabled && needs.select.outputs.addon-host-count != '0' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      # The newest hosts composed against this lockfile; compose --if-stale recomposes a
      # host whose composition inputs, the composer's own snapshot of its apps' sources
      # and settings, changed since, so a stale host never runs.
      - uses: actions/cache@v4
        with:
          path: .test-hosts/*/composed_test_runtime
          key: test-hosts-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/**/*.py', 'src/**/*.zed', 'src/**/pyproject.toml', '!src/**/tests/**') }}
          restore-keys: test-hosts-${{ hashFiles('uv.lock') }}-
      - shell: bash
        env:
          ADDON_HOSTS: ${{ needs.select.outputs.addon-hosts }}
        run: |
          mapfile -t addons < <(jq -r '.[]' <<< "$ADDON_HOSTS")
          status=0
          for addon in "${addons[@]}"; do
            echo "::group::$addon"
            uv run --locked python -m angee.base.testing.host "$addon" -q --durations=10 || status=1
            echo "::endgroup::"
          done
          exit $status

  # Preserve the required check name and accept only intentional skips.
  uv:
    if: ${{ always() && inputs.uv-enabled }}
    needs: [python-quality, select, uv-shard, uv-postgres, addon-hosts]
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - run: |
          echo "quality=${{ needs.python-quality.result }} select=${{ needs.select.result }} shards=${{ needs.uv-shard.result }} postgres=${{ needs.uv-postgres.result }} hosts=${{ needs.addon-hosts.result }}"
          test "${{ needs.python-quality.result }}" = success
          test "${{ needs.select.result }}" = success
          # The shards are skipped where select turned them off: the changed paths reach
          # no Python test.
          test "${{ needs.uv-shard.result }}" = success || {
            test "${{ needs.select.outputs.sqlite-mode }}" = empty && test "${{ needs.uv-shard.result }}" = skipped
          } || exit 1
          test "${{ needs.uv-postgres.result }}" = success || {
            test "${{ needs.select.outputs.postgres-groups }}" = '[]' && test "${{ needs.uv-postgres.result }}" = skipped
          } || exit 1
          test "${{ needs.addon-hosts.result }}" = success || {
            test "${{ needs.select.outputs.addon-host-count }}" = 0 && test "${{ needs.addon-hosts.result }}" = skipped
          } || exit 1

  pnpm:
    if: ${{ inputs.pnpm-enabled && inputs.pr-checks-enabled }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # The action empties its destination first, so on runners sharing one home its
      # default ~/setup-pnpm lets one job delete another's pnpm mid-run.
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.3
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          # GitHub's cache only on GitHub-hosted runners; a self-hosted runner installs from
          # the registry and leaves the repository's cache space to them.
          # package-manager-cache turns off the caching v5 otherwise starts on its own
          # from package.json's packageManager.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/**' typecheck
      - run: pnpm -r --filter './packages/**' test
      - run: pnpm -r --filter './packages/**' --filter '!@angee/storybook' build
      - run: node packages/scripts/check-dist-imports.mjs
      - run: node packages/ui/scripts/check-views-exports.mjs

  # The composed-stack lane dogfoods the two-command install path: install the
  # released angee CLI, render the in-repo framework-dev stack template,
  # compose it (native compose + prebuilt schema check + web codegen — no database needed), then
  # typecheck/test addon fragments (the stack root's runtime/ is the @angee/gql
  # fixture), and run the optional bridge source tests.
  # The consolidated checkout supplies packages, src, examples, and
  # templates. Only the optional full-profile bridges remain external.
  # A consumer call runs six groups: the first provisions and smokes the host and
  # checks lint, types and frontend fragments; the other five split the consumer's
  # Python collection, each on its own PostgreSQL host. The stack job keeps one verdict.
  stack-shard:
    name: stack ${{ matrix.group }}/${{ strategy.job-total }}
    if: ${{ inputs.stack-enabled && inputs.pr-checks-enabled }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.consumer-path != '' && '[1,2,3,4,5,6]' || '[1]') }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: angee
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d angee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # The checkouts below clean only their own paths; a reused self-hosted runner keeps
      # the previous job's stack/ beside them, so start from an empty one.
      - name: Start from an empty stack directory
        run: rm -rf stack
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.framework-repository }}
          ref: ${{ github.repository == 'ang-ee/angee-django' && github.sha || inputs.framework-ref }}
          path: stack/workspaces/src/angee
      - uses: actions/checkout@v5
        if: ${{ inputs.addons-profile == 'full' }}
        with:
          repository: ang-ee/angee-messaging-bridges
          ref: ${{ github.repository == 'ang-ee/angee-messaging-bridges' && github.sha || inputs.bridges-ref }}
          path: stack/workspaces/src/angee-messaging-bridges
          token: ${{ secrets.BRIDGES_TOKEN || github.token }}
      - name: Check out declared consumer addon sources
        if: ${{ inputs.consumer-path != '' }}
        env:
          GH_TOKEN: ${{ secrets.ADDON_SOURCES_TOKEN || github.token }}
          CONSUMER_SOURCES: ${{ inputs.consumer-sources }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          sources = json.loads(os.environ["CONSUMER_SOURCES"])
          assert sources, "Consumer checks require declared addon sources"
          subprocess.run(["gh", "auth", "setup-git"], check=True)
          for source in sources:
              slot = source["path"]
              assert Path(slot).name == slot and slot not in {".", "..", "angee"}, slot
              target = Path("stack/workspaces/src") / slot
              repository = source["repository"]
              ref = os.environ["CALLER_SHA"] if repository == os.environ["CALLER_REPOSITORY"] else source["ref"]
              subprocess.run(["gh", "repo", "clone", repository, str(target), "--", "--depth=1", "--no-checkout"], check=True)
              subprocess.run(["git", "-C", str(target), "fetch", "--depth=1", "origin", ref], check=True)
              subprocess.run(["git", "-C", str(target), "checkout", "--detach", "FETCH_HEAD"], check=True)
          PY
      - name: Fetch the caller's pull-request base for test selection
        if: ${{ github.event_name == 'pull_request' && (inputs.consumer-path != '' || (inputs.addons-profile == 'full' && github.repository == 'ang-ee/angee-messaging-bridges')) }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          CONSUMER_PATH: ${{ inputs.consumer-path }}
          CONSUMER_SOURCES: ${{ inputs.consumer-sources }}
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          slot=$CONSUMER_PATH
          if [ -n "$slot" ]; then
            source=$(jq -r --arg slot "$slot" '.[] | select(.path == $slot) | .repository' <<< "$CONSUMER_SOURCES")
            if [ "$source" != "$CALLER_REPOSITORY" ]; then exit 0; fi
          else
            slot=angee-messaging-bridges
          fi
          target="stack/workspaces/src/$slot"
          if ! git -C "$target" cat-file -e "$BASE^{commit}"; then
            git -C "$target" fetch --depth=1 origin "$BASE" || echo "::warning::Comparison base unavailable; running full tests"
          fi
          {
            echo "TEST_BASE=$BASE"
            echo "TEST_HEAD=$HEAD_SHA"
          } >> "$GITHUB_ENV"
      # Into the job's own directory: no root, and nothing outlives the job on a reused
      # self-hosted runner.
      - name: Install the angee CLI (the public install path)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://raw.githubusercontent.com/ang-ee/angee-operator/main/scripts/install.sh | ANGEE_VERSION=${{ inputs.angee-version }} ANGEE_INSTALL_DIR="$RUNNER_TEMP/bin" sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # uv runs from the stack root, above the framework checkout, where it would not
      # find the framework's .python-version.
      - name: Use the framework's Python
        if: ${{ inputs.python-version == '' }}
        run: echo "UV_PYTHON=$(cat stack/workspaces/src/angee/.python-version)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
      # The action empties its destination first, so on runners sharing one home its
      # default ~/setup-pnpm lets one job delete another's pnpm mid-run.
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.3
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          # This job caches nothing, but on a reused runner the workspace root can hold
          # another job's package.json, from whose packageManager v5 would start a cache.
          package-manager-cache: false
      - name: Render the stack (local template ref — no registry round-trip)
        run: >-
          angee stack init "$GITHUB_WORKSPACE/stack/workspaces/src/angee/templates/stacks/dev"
          "$GITHUB_WORKSPACE/stack" --force --yes
          --input project_name=ci-stack
          --input addons_profile=${{ inputs.addons-profile }}
      - name: Configure the consumer composition and workspace
        if: ${{ inputs.consumer-path != '' }}
        working-directory: stack
        env:
          CONSUMER_SOURCES: ${{ inputs.consumer-sources }}
          CONSUMER_ROOTS: ${{ inputs.consumer-roots }}
        run: |
          uv run --no-project --with pyyaml python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          import yaml

          sources = json.loads(os.environ["CONSUMER_SOURCES"])
          roots = json.loads(os.environ["CONSUMER_ROOTS"])
          assert roots, "Consumer checks require explicit installed app roots"
          path = Path("settings.yaml")
          settings = yaml.safe_load(path.read_text())
          settings["INSTALLED_APPS"] = roots
          path.write_text(yaml.safe_dump(settings, sort_keys=False))
          path = Path("pnpm-workspace.yaml")
          workspace = yaml.safe_load(path.read_text())
          workspace["packages"].extend(
              "workspaces/src/" + source["path"] + "/src/*/*/web" for source in sources
          )
          path.write_text(yaml.safe_dump(workspace, sort_keys=False))
          # Native uv reads each collection's pyproject and workspace sources.
          subprocess.run([
              "uv", "add", "--editable", "--no-workspace",
              *(str(Path("workspaces/src") / source["path"]) for source in sources),
          ], check=True)
          PY
      - name: Enable Matrix to check every bridge web fragment
        if: ${{ inputs.addons-profile == 'full' }}
        working-directory: stack
        run: |
          uv run --no-project --with pyyaml python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("settings.yaml")
          settings = yaml.safe_load(path.read_text())
          settings["INSTALLED_APPS"].append("angee.messaging_integrate_matrix")
          path.write_text(yaml.safe_dump(settings, sort_keys=False))
          PY
      - name: Export the framework's locked check tools
        if: ${{ inputs.consumer-path != '' || inputs.addons-profile == 'full' }}
        working-directory: stack/workspaces/src/angee
        run: uv export --locked --only-group dev --no-hashes --no-emit-workspace --output-file "$GITHUB_WORKSPACE/check-tools.txt"
      - name: Resolve check tools with the stack runtime
        if: ${{ inputs.consumer-path != '' || inputs.addons-profile == 'full' }}
        working-directory: stack
        # One environment keeps plugin entry points consistent with imported code.
        run: uv add --dev --requirements "$GITHUB_WORKSPACE/check-tools.txt" --no-sync
      - name: Enable pgvector for the host and test databases
        run: |
          # The host database already exists; worker databases inherit template1.
          for database in angee template1; do
            docker exec ${{ job.services.postgres.id }} psql -U postgres -d "$database" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm"
          done
      - name: Compose the runtime and SDL (no database needed)
        working-directory: stack
        run: |
          uv sync
          uv run --no-sync python manage.py compose
          # Author disposable native history, then verify the native composition:
          # the authored history must reproduce the composed models exactly.
          uv run --no-sync python manage.py makemigrations --noinput
          uv run --no-sync python manage.py makemigrations --check --dry-run
          uv run --no-sync python manage.py compose --check
          uv run --no-sync python manage.py schema --check
      # Only the smoke reads the host database; consumer shards test in pytest-django's own.
      - name: Provision the composed stack
        if: ${{ matrix.group == 1 }}
        working-directory: stack
        run: |
          uv run --no-sync python manage.py provision
      # Composition escapes the bare source host cannot see: every system check on the
      # composed models, the demo tier loading, and every folded model with a row loading
      # one with only its primary key and saving it again (deferred-column reads,
      # MRO-ordered save overrides). Append-only models refuse edits by contract, so they
      # only load.
      - name: Smoke the composed models
        if: ${{ matrix.group == 1 }}
        working-directory: stack
        run: |
          uv run --no-sync python manage.py check --database default
          uv run --no-sync python manage.py resources load --include-demo
          uv run --no-sync python manage.py shell -c '
          from django.apps import apps
          from rebac import system_context

          from angee.base.addons import is_angee_addon
          from angee.base.models.append_only import AppendOnlyModel

          failures, loaded = [], 0
          with system_context(reason="ci.composed_model_smoke"):
              for model in apps.get_models():
                  if model._meta.managed and is_angee_addon(model._meta.app_config):
                      try:
                          for row in model._base_manager.only("pk")[:1]:
                              loaded += 1
                              if not issubclass(model, AppendOnlyModel):
                                  row.save()
                      except Exception as error:
                          failures.append(f"{model._meta.label}: {error!r}")
          print(f"Loaded and saved one row of {loaded} composed models.")
          assert not failures, "\n".join(failures)
          '
      - name: Lint the consumer with the framework policy
        if: ${{ inputs.consumer-path != '' && matrix.group == 1 }}
        working-directory: stack
        env:
          CONSUMER_PATH: ${{ inputs.consumer-path }}
        run: uv run --no-sync python -m ruff check "workspaces/src/$CONSUMER_PATH" --no-cache
      - name: Typecheck the consumer with the framework policy and native typing host
        if: ${{ inputs.consumer-path != '' && matrix.group == 1 }}
        working-directory: stack
        env:
          CONSUMER_PATH: ${{ inputs.consumer-path }}
          CONSUMER_SOURCES: ${{ inputs.consumer-sources }}
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          import tomlkit
          import yaml

          host = Path.cwd().resolve()
          slot = host / "workspaces/src" / os.environ["CONSUMER_PATH"]
          framework = host / "workspaces/src/angee"
          typing_root = host / ".mypy_cache/consumer_typing"
          typing_root.mkdir(parents=True, exist_ok=True)
          # Authored isolated settings use the same native configuration owner.
          (typing_root / "ci_consumer_typing.py").write_text((host / "settings.py").read_text())
          authored = yaml.safe_load((host / "settings.yaml").read_text())
          authored["COMPOSE_OUTPUT_DIR"] = str(typing_root / "ci_typing_runtime")
          authored["COMPOSE_OUTPUT_MODULE"] = "ci_typing_runtime"
          authored["DATABASES"] = {"default": {"ENGINE": "django.db.backends.sqlite3", "NAME": ":memory:"}}
          (typing_root / "settings.yaml").write_text(yaml.safe_dump(authored, sort_keys=False))
          # Locked angee-django-stubs gives its configured module priority over the env.
          # Reuse the full policy; change only that native project selection.
          policy = tomlkit.parse((framework / "pyproject.toml").read_text())
          policy["tool"]["django-stubs"]["django_settings_module"] = "ci_consumer_typing"
          config = typing_root / "mypy.toml"
          config.write_text(tomlkit.dumps(policy))
          os.environ["ANGEE_PROJECT_DIR"] = str(typing_root)
          os.environ.pop("DATABASE_URL", None)
          os.environ.pop("YAMLCONF_CONFFILE", None)
          os.environ["PYTHONPATH"] = os.pathsep.join(filter(None, (
              str(typing_root), str(framework), os.environ.get("PYTHONPATH"),
          )))
          source_roots = sorted(
              str(host / "workspaces/src" / source["path"] / "src")
              for source in json.loads(os.environ["CONSUMER_SOURCES"])
          )
          os.environ["MYPYPATH"] = os.pathsep.join(dict.fromkeys(filter(None, (
              str(typing_root), str(slot / "src"), *source_roots, os.environ.get("MYPYPATH"),
          ))))
          subprocess.run([
              sys.executable, "-m", "mypy", "--config-file", str(config),
              str(slot / "src"),
          ], cwd=framework, check=True)
          PY
      - name: Size the PostgreSQL lock table for consumer test schemas
        if: ${{ inputs.consumer-path != '' && matrix.group != 1 }}
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d angee -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U postgres -d angee; do sleep 1; done
          # Docker published the service on a free host port, so jobs sharing one Docker
          # host never collide; the restart can move it, so the URL is read after it.
          port=$(docker inspect --format '{{ (index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort }}' ${{ job.services.postgres.id }})
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:$port/angee" >> "$GITHUB_ENV"
      - name: Run the consumer's PostgreSQL test shard
        if: ${{ inputs.consumer-path != '' && matrix.group != 1 }}
        working-directory: stack
        env:
          ANGEE_PROJECT_DIR: ${{ github.workspace }}/stack
          DJANGO_SETTINGS_MODULE: settings
          CONSUMER_PATH: ${{ inputs.consumer-path }}
          CONSUMER_TESTS: ${{ inputs.consumer-tests }}
          CONSUMER_ROOTS: ${{ inputs.consumer-roots }}
          CONSUMER_PYTEST_PLUGINS: ${{ inputs.consumer-pytest-plugins }}
          CONSUMER_SPLITS: ${{ strategy.job-total }}
          CONSUMER_GROUP: ${{ matrix.group }}
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          import django

          slot = (Path("workspaces/src") / os.environ["CONSUMER_PATH"]).resolve()
          paths = json.loads(os.environ["CONSUMER_TESTS"])
          assert paths, "Consumer checks require explicit test paths"
          host = Path.cwd().resolve()
          os.environ["PYTHONPATH"] = os.pathsep.join(filter(None, (
              str(host), os.environ.get("PYTHONPATH"),
          )))
          os.chdir(slot)
          sys.path[:0] = [str(slot), str(host), str(host / "workspaces/src/angee/scripts")]
          from changed_path_selection import run_selected

          # Populate the authored host before collecting consumer fixture plugins.
          # Native installed distributions already own addon importability.
          django.setup()
          plugins = json.loads(os.environ["CONSUMER_PYTEST_PLUGINS"])
          raise SystemExit(run_selected([
              "-c", "/dev/null", "--rootdir", str(slot), "--confcutdir", str(slot),
              "--import-mode=importlib", "--nomigrations", "-o", "python_files=test*.py",
              # Register pytest-django before the shared django_db_setup override.
              "-p", "django", "-p", "angee.base.testing.fixtures", "-p", "angee.provenance.testing.fixtures",
              *(arg for plugin in plugins for arg in ("-p", plugin)),
              "-p", "no:randomly", "-n", "4", "--dist", "worksteal", "-q",
              # Group 1 carries the composed checks; the other groups split the collection.
              "--splits", str(int(os.environ["CONSUMER_SPLITS"]) - 1),
              "--group", str(int(os.environ["CONSUMER_GROUP"]) - 1),
              "--splitting-algorithm", "least_duration", "--durations=25",
              "-o", "faulthandler_timeout=300",
              *(str(slot / path) for path in paths),
          ], root=slot, base=os.environ.get("TEST_BASE"), head=os.environ.get("TEST_HEAD"),
              apps=json.loads(os.environ["CONSUMER_ROOTS"])))
          PY
      - name: Install the stack JS workspace and generate typed documents
        if: ${{ matrix.group == 1 }}
        working-directory: stack
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            pnpm install --lockfile-only --no-frozen-lockfile
          fi
          pnpm install --frozen-lockfile
          pnpm --config.verify-deps-before-run=false --dir web exec angee-web-codegen --runtime ../runtime --web-root .
      # The framework's packages job checks its packages hermetically, so the
      # composition checks fragments only. Each Vitest run sizes its worker pool
      # to the whole runner, so fragments test one package at a time.
      - name: Typecheck and test all fragments against the composition
        if: ${{ matrix.group == 1 }}
        working-directory: stack
        env:
          CONSUMER_PATH: ${{ inputs.consumer-path }}
        run: |
          if [ -n "$CONSUMER_PATH" ]; then
            fragments="./workspaces/src/$CONSUMER_PATH/src/**"
          else
            fragments="!./workspaces/src/angee/packages/**"
          fi
          pnpm -r --fail-if-no-match --filter "$fragments" typecheck
          pnpm -r --fail-if-no-match --workspace-concurrency=1 --filter "$fragments" test
      - name: Pytest the bridge source contracts
        if: ${{ inputs.addons-profile == 'full' && matrix.group == 1 }}
        working-directory: stack
        run: |
          uv run --no-sync --project "$GITHUB_WORKSPACE/stack" \
            --directory "$GITHUB_WORKSPACE/stack/workspaces/src/angee-messaging-bridges" \
            python "$GITHUB_WORKSPACE/stack/workspaces/src/angee/scripts/changed_path_selection.py" pytest \
            --base "${TEST_BASE:-}" --head "${TEST_HEAD:-}" -- -q ${{ inputs.pytest-extra-args }}

  # Preserve the public check name and fail it for any unsuccessful matrix result.
  stack:
    if: ${{ always() && inputs.stack-enabled }}
    needs: [stack-shard]
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.stack-shard.result }}" = success || { test "${{ inputs.pr-checks-enabled }}" = false && test "${{ needs.stack-shard.result }}" = skipped; }
