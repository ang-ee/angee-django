name: reusable checks

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for the uv test lane.
        required: false
        type: string
        default: "3.14"
      pytest-extra-args:
        description: Optional arguments appended to the pytest command.
        required: false
        type: string
        default: ""
      uv-enabled:
        description: Run the standalone uv pytest lane (repos whose suites need sibling sources run pytest in the stack lane instead).
        required: false
        type: boolean
        default: true
      pnpm-enabled:
        description: Run the pnpm typecheck and test lane.
        required: false
        type: boolean
        default: true
      stack-enabled:
        description: Run the composed-stack lane (render a stack, build + codegen, check this repo's fragments and tests against the real composition).
        required: false
        type: boolean
        default: false
      angee-version:
        description: Release tag of the angee CLI the stack lane installs.
        required: false
        type: string
        default: latest
    secrets:
      SIBLINGS_TOKEN:
        description: Token able to read the sibling ang-ee repos (needed while they are private; the default token suffices once they are public).
        required: false

permissions:
  contents: read

jobs:
  uv:
    if: ${{ inputs.uv-enabled }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ inputs.python-version }}
      - run: uv run pytest -q ${{ inputs.pytest-extra-args }}

  pnpm:
    if: ${{ inputs.pnpm-enabled }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo
    steps:
      # The caller's workspace links the framework React packages from the
      # sibling angee-react checkout (the stack's sources/ layout), so CI
      # reproduces that layout: the repo under ./repo, the sibling beside it.
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ang-ee/angee-react
          path: angee-react
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  # The composed-stack lane dogfoods the two-command install path: install the
  # released angee CLI, render the framework-dev stack from angee-templates,
  # compose it (angee build + schema + web codegen — no database needed), then
  # typecheck/test THIS repo's fragments and run its pytest suite against the
  # real composition (the stack root's runtime/ is the @angee/gql fixture).
  # CI pre-places the checkouts in the stack's workspace-slot layout, so the
  # committed stack-relative paths resolve exactly as they do in a dev stack.
  stack:
    if: ${{ inputs.stack-enabled }}
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: stack/workspaces/src/${{ github.event.repository.name }}
      - uses: actions/checkout@v4
        if: github.event.repository.name != 'angee-django'
        with:
          repository: ang-ee/angee-django
          path: stack/workspaces/src/angee-django
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        if: github.event.repository.name != 'angee-react'
        with:
          repository: ang-ee/angee-react
          path: stack/workspaces/src/angee-react
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        if: github.event.repository.name != 'angee-base'
        with:
          repository: ang-ee/angee-base
          path: stack/workspaces/src/angee-base
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        if: github.event.repository.name != 'angee-messaging-bridges'
        with:
          repository: ang-ee/angee-messaging-bridges
          path: stack/workspaces/src/angee-messaging-bridges
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        if: github.event.repository.name != 'angee-examples'
        with:
          repository: ang-ee/angee-examples
          path: stack/workspaces/src/angee-examples
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ang-ee/angee-templates
          path: templates-repo
          token: ${{ secrets.SIBLINGS_TOKEN || github.token }}
      - name: Install the angee CLI (the public install path)
        run: curl -fsSL https://raw.githubusercontent.com/ang-ee/angee-operator/main/scripts/install.sh | ANGEE_VERSION=${{ inputs.angee-version }} sh
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ inputs.python-version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Render the stack (local template ref — no registry round-trip)
        run: >-
          angee stack init "$GITHUB_WORKSPACE/templates-repo/templates/stacks/dev"
          "$GITHUB_WORKSPACE/stack" --force --yes
          --input project_name=ci-stack
          --input addons_profile=full
          --input olm_cxxflags=
      - name: Compose the runtime and SDL (no database needed)
        working-directory: stack
        run: |
          uv run manage.py angee build
          uv run manage.py schema
      - name: Install the stack JS workspace and generate typed documents
        working-directory: stack
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --dir web codegen
      - name: Typecheck and test this repo's fragments against the composition
        working-directory: stack
        run: |
          pnpm -r --filter "{./workspaces/src/$REPO_NAME/**}" typecheck
          pnpm -r --filter "{./workspaces/src/$REPO_NAME/**}" test
      - name: Pytest against the composed stack
        working-directory: stack/workspaces/src/${{ github.event.repository.name }}
        run: uv run pytest -q ${{ inputs.pytest-extra-args }}
