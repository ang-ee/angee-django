name: CLA

# Gates every pull request on a signed Contributor License Agreement.
#
# Angee is licensed LGPL-3.0-or-later and dual-licenses commercially, so every
# Contribution needs an express right to relicense (CLA.md section 3). A DCO
# sign-off does not grant that right — it only certifies provenance.
#
# One signature covers all `ang-ee` repositories. Signatures are stored in the
# private `ang-ee/cla-signatures` register, not in this public repo, so no
# contributor's name and email land in the public mirror.
#
# Setup this workflow requires:
#   1. A private repo `ang-ee/cla-signatures` with an empty `main` branch.
#   2. Repository secret `CLA_SIGNATURES_TOKEN` — a fine-grained PAT scoped to
#      that one repo with Contents: read & write. The default GITHUB_TOKEN
#      cannot write across repositories.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signature
        # Runs on pull request events, and on the two comment bodies the action
        # recognises: the signature phrase and `recheck`.
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # Pinned to the v2.6.1 commit. The action publishes no floating `v2`
        # tag, so `@v2` never resolved and every pull request failed before the
        # step ran. A commit pin also matters more than usual here: this job is
        # `pull_request_target`, so it runs with repository secrets — including
        # a cross-repo PAT — in scope, and the upstream action is archived.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writes the signature register in the separate private repo below.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/ang-ee/angee-django/blob/main/CLA.md
          remote-organization-name: ang-ee
          remote-repository-name: cla-signatures
          path-to-signatures: signatures/v1/cla.json
          branch: main
          # Maintainers and bots are covered outside the pull request flow:
          # employees by employment agreement, corporations by CLA-CORPORATE.md.
          allowlist: ayushin,dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Thanks for your contribution. Before we can merge it, please sign the
            [Angee Contributor License Agreement](https://github.com/ang-ee/angee-django/blob/main/CLA.md).
            You keep the copyright in your work — the agreement grants Angee the
            right to relicense it, which is what lets Angee ship both an LGPL
            release and commercial builds. Contributing on behalf of a company?
            See [CLA-CORPORATE.md](https://github.com/ang-ee/angee-django/blob/main/CLA-CORPORATE.md).
            To sign, comment below with:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
