name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run it supersedes, and a new push to main cancels
# main's run still in progress, whose tree the new one contains; each pull request and main
# have a group of their own. A pull request's run tests its merge commit (`framework-ref` is
# `github.sha`), which is the tree main gets, so a push to main repeats only what a pull
# request runs in part: the quality lane, the whole SQLite suite and the PostgreSQL selection.
# The packages and the composed stack hold while main has not moved since the pull request's
# run started; merge only then, or run the pull request again.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # Reusable-workflow callers cannot set timeout-minutes; each called job does.
    uses: ./.github/workflows/reusable-checks.yml
    secrets: inherit
    with:
      # Packages are checked hermetically; addon fragments are checked again
      # against generated GraphQL documents in the composed-stack lane.
      pnpm-enabled: true
      stack-enabled: true
      pr-checks-enabled: ${{ github.event_name == 'pull_request' }}
      framework-repository: ${{ github.repository }}
      framework-ref: ${{ github.sha }}
      # Match the bridge dependency artifacts to this framework's manifests.
      bridges-ref: "b5bfc0aa85b95f9c7655f61c9fcdcc51ad91c349"
      # CI_RUNS_ON (a JSON runs-on value) moves every job to self-hosted runners; a
      # pull request from a fork always runs on GitHub-hosted ones. This public
      # repository leaves it unset (docs/checks.md#what-ci-actually-runs).
      runs-on: ${{ (github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || vars.CI_RUNS_ON || '"ubuntu-latest"' }}

  # The public repository's guards, one job: no secret anywhere in the history
  # and no private work-state path tracked (AGENTS.md -> Where Knowledge Lives).
  guards:
    runs-on: ${{ fromJSON((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The gitleaks CLI is MIT and license-free; gitleaks-action@v2 demands a
      # paid org license secret. Run the binary directly.
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
      - name: Reject tracked .work/ paths
        run: |
          if git ls-files | grep -E '^\.work(/|$)'; then
            echo "::error::Private .work/ content must never be committed to the public repo."
            exit 1
          fi
          echo "OK: no .work/ paths tracked."
