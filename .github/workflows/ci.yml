name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Reusable-workflow callers cannot set timeout-minutes; each called job does.
    uses: ./.github/workflows/reusable-checks.yml
    secrets: inherit
    with:
      python-version: "3.14"
      # Packages are checked hermetically; addon fragments are checked again
      # against generated GraphQL documents in the composed-stack lane.
      pnpm-enabled: true
      stack-enabled: true
      framework-repository: ${{ github.repository }}
      framework-ref: ${{ github.sha }}
      # Match the bridge dependency artifacts to this framework's manifests.
      bridges-ref: "d2c46ab06d7f02463738ff61c008b4746dc3a3dc"
