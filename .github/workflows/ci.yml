name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/reusable-checks.yml
    secrets: inherit
    with:
      python-version: "3.14"
      # Packages are checked hermetically; addon fragments are checked again
      # against generated GraphQL documents in the composed-stack lane.
      pnpm-enabled: true
      stack-enabled: true
      # The compatibility companion is merged after the shared workflow lands.
      bridges-ref: workspace/django-native-composition
