name: no private paths

# Guards against committing legacy checkout-local .work paths. Current private
# work-state belongs to the workspace-sibling slot, outside this source repo.
# See AGENTS.md -> Where Knowledge Lives.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject tracked .work/ paths
        run: |
          if git ls-files | grep -E '^\.work(/|$)'; then
            echo "::error::Private .work/ content must never be committed to the public repo."
            exit 1
          fi
          echo "OK: no .work/ paths tracked."
