name: Publish Python distributions

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/reusable-checks.yml
    with:
      python-version: "3.14"
      pnpm-enabled: false
      stack-enabled: false

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: python-index
    env:
      UV_PUBLISH_URL: ${{ vars.ANGEE_PYTHON_PUBLISH_URL }}
      UV_PUBLISH_TOKEN: ${{ secrets.ANGEE_PYTHON_PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Build each native workspace wheel directly
        run: uv run --only-group dev python scripts/release.py --build
      - name: Validate target channel metadata
        run: uv publish --dry-run --trusted-publishing never dist/*
      - name: Publish to the configured Angee Python index
        run: uv publish --trusted-publishing never dist/*
