build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-webforms"
version = "3.0.0"
description = "Public web forms and surveys: versioned multilingual definitions, kept responses, and targets that turn a response into a record."
keywords = ["webforms", "forms", "surveys", "questionnaire", "public", "responses"]
dependencies = ["angee-base>=3,<4", "angee-server>=3,<4", "angee-provenance>=3,<4", "angee-iam>=3,<4", "angee-jobs>=3,<4", "angee-resources>=3,<4", "angee-graphql>=3,<4"]
dynamic = ["entry-points"]

[tool.angee]

[tool.angee.platform]
category = "Productivity"
