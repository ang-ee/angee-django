<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The page's colour runs to the edges of a phone's screen; form.css keeps its content clear of a notch and the home bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      This document carries no inline script and no inline event handler. The
      ingress serves it under a content security policy that runs neither, so the
      markup staff write into a form's `html` elements and its completed page
      cannot run script; everything the page does is in form.ts. The build gives
      the document the design tokens and the installed themes as stylesheets, and
      in development writes that policy into it.
    -->
    <!-- The blank page before the theme applies follows the visitor's colour scheme. -->
    <meta name="color-scheme" content="light dark" />
    <!-- The page names itself after the form, in the language it is shown in. -->
    <title></title>
    <link rel="stylesheet" href="./form.css" />
  </head>
  <!-- Nothing shows until the page's script has applied the form's theme (form.css). -->
  <body class="starting">
    <header>
      <!-- Named by the page's script, in the language of the form. -->
      <select id="language" hidden autocomplete="off"></select>
    </header>
    <main id="form"></main>
    <!-- What the page says in place of a form. Until its script speaks, this is all the document says. -->
    <p id="notice" role="status" dir="auto">This form could not be loaded. Reload the page to try again.</p>
    <!-- Named by the server, never shown: a person leaves it empty. -->
    <input id="honeypot" hidden tabindex="-1" autocomplete="off" aria-hidden="true" />
    <script type="module" src="./form.ts"></script>
  </body>
</html>
