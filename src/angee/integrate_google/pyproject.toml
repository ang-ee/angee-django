build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-integrate-google"
version = "3.0.0"
description = "Google OAuth — the provider preset, its scope catalogue and the deployment's Google client"
keywords = ["google", "oauth", "oidc"]
dependencies = ["angee-integrate>=3,<4"]
dynamic = ["entry-points"]

[tool.angee]

[[tool.angee.resources.install]]
path = "install/010_integrate.oauthclient.yaml"
adopt = ["slug", "environment"]

[tool.angee.platform]
category = "Integration"

[tool.angee.rebac]
evaluated_policy = true
