# Google OAuth client seeds (install tier). Model inferred from the
# `integrate.oauthclient` filename; adopted by (slug, environment) so a
# pre-existing row is linked, not duplicated.
#
# `google` is the deployment's own Google client: Google forbids publishing
# client credentials, so every deployment registers one in its Google Cloud
# project (docs/howto/google-oauth-client.md). The row leaves `client_id` and
# `client_secret` blank and reads `needs_client` until an admin pastes the two
# values; endpoints, OIDC metadata, claims and the scope catalogue come from the
# `google` preset when the row is created.
- xref: oauth_google
  slug: google
  environment: prod
  provider_type: google
  display_name: Google
  icon: google
# Google's public Gemini CLI client: a fixed, published client id with no secret
# and its own scopes. Its content is the row integrate released, so the declared
# ledger move (compose_migrations/resources) keeps existing rows untouched.
- xref: oauth_gemini
  slug: gemini
  environment: prod
  display_name: Google Gemini
  icon: google
  client_id: 681255809395-oo8ft2oprdrnp9e3aqf6av3hmdib135j.apps.googleusercontent.com
  authorize_endpoint: https://accounts.google.com/o/oauth2/v2/auth
  token_endpoint: https://oauth2.googleapis.com/token
  discovery_url: https://accounts.google.com/.well-known/openid-configuration
  # Clear the former v2 profile override; discovery supplies the preset's OIDC profile.
  userinfo_endpoint: ""
  is_enabled: true
  supports_pkce: true
  supports_refresh: true
  scopes_catalogue:
    - https://www.googleapis.com/auth/cloud-platform
    - https://www.googleapis.com/auth/userinfo.email
    - https://www.googleapis.com/auth/userinfo.profile
  default_scopes:
    - https://www.googleapis.com/auth/cloud-platform
    - https://www.googleapis.com/auth/userinfo.email
    - https://www.googleapis.com/auth/userinfo.profile
  authorize_params:
    access_type: offline
  external_id_claim: sub
  email_claim: email
  display_name_claim: name
  avatar_url_claim: picture
