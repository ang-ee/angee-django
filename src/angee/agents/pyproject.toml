build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-agents"
version = "3.0.0"
description = "AI agents — the inference provider/model catalogue and the runtimes agents run on"
keywords = ["agents", "ai", "inference"]
dependencies = ["angee-base>=3,<4", "angee-integrate>=3,<4", "angee-integrate-vcs>=3,<4", "angee-operator>=3,<4", "angee-mcp>=3,<4", "angee-iam>=3,<4", "angee-jobs>=3,<4", "angee-graphql>=3,<4", "angee-resources>=3,<4", "angee-provenance>=3,<4", "angee-web>=3,<4", "pydantic-ai-slim>=2.13", "httpx>=0.28.1,<0.29", "agent-client-protocol==1.0.0rc2", "django-compose>=0.1.0.dev1,<0.2"]

[project.entry-points]
"angee.addons" = {"angee.agents" = "angee.agents"}

[tool.angee]

[[tool.angee.resources.demo]]
path = "demo/010_integrate.credential.yaml"
depends_on = "iam:demo/010_iam.user.yaml"
adopt = ["user", "name"]

[[tool.angee.resources.demo]]
path = "demo/020_agents.mcpserver.yaml"
depends_on = "demo/010_integrate.credential.yaml"
adopt = "name"

[tool.angee.platform]
category = "Agents"
