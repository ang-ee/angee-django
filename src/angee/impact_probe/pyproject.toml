build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-impact-probe"
version = "3.0.0"
description = "Impact Probe: impactprobe records owned by their creator."
keywords = ["impact_probe"]
dependencies = [
  "angee-base>=3,<4",
  "angee-iam>=3,<4",
  "angee-graphql>=3,<4",
  "angee-resources>=3,<4",

  "angee-web>=3,<4",

]
dynamic = ["entry-points"]

[tool.angee.resources]
demo = [
  { path = "demo/010_impact_probe.impactprobe.yaml", depends_on = "iam:demo/010_iam.user.yaml" },
]
