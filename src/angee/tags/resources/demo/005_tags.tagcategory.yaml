# Demo tag categories (demo tier), shared vocabulary like the tags they group.
# They set no maximum per record: demo data loads on every host, and a host may
# require a capped category to have an owner the framework does not seed (arp
# requires one company). Idempotency is the resource ledger's (source_addon,
# xref) identity; positions append in file order.
_meta:
  model: tags.TagCategory
rows:
  - xref: relationship
    fields:
      name: Relationship
      description: How the organization stands with the record.
  - xref: segment
    fields:
      name: Segment
      description: Market segments the record belongs to.
