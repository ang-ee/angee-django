build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-tags"
version = "3.0.0"
description = "Polymorphic tags: a shared vocabulary attachable to any row."
keywords = ["tags", "labels", "taxonomy", "categories", "polymorphic"]
dependencies = ["angee-base>=3,<4", "angee-provenance>=3,<4", "angee-iam>=3,<4", "angee-resources>=3,<4", "angee-graphql>=3,<4", "angee-web>=3,<4"]
dynamic = ["entry-points"]

[tool.angee]

[tool.angee.resources]
demo = ["demo/005_tags.tagcategory.yaml", {path = "demo/010_tags.tag.yaml", depends_on = "demo/005_tags.tagcategory.yaml"}]

[tool.angee.platform]
category = "Foundation"
