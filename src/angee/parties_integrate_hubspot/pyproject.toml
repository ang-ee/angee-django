build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-parties-integrate-hubspot"
version = "3.0.0"
description = "HubSpot CRM contacts read one way into parties over HubSpot's date-versioned REST API"
keywords = ["hubspot", "crm", "contacts", "sync"]
dependencies = ["angee-parties>=3,<4", "angee-integrate>=3,<4", "angee-web>=3,<4", "angee-base>=3,<4"]
dynamic = ["entry-points"]

[tool.angee]

[[tool.angee.resources.master]]
path = "master/010_integrate.vendor.yaml"
adopt = "slug"

[tool.angee.platform]
category = "Integration"

[tool.angee.rebac]
evaluated_policy = true
