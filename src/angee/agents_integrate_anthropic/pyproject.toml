build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-agents-integrate-anthropic"
version = "3.0.0"
description = "Anthropic (Claude) inference backend — adds the Claude client to the agents catalogue"
keywords = ["anthropic", "claude", "inference"]
dependencies = ["angee-agents>=3,<4", "angee-integrate>=3,<4", "anthropic>=0.109.2", "pydantic-ai-slim[anthropic]>=2.13"]
dynamic = ["entry-points"]

[tool.angee]

[[tool.angee.resources.install]]
path = "install/010_integrate.oauthclient.yaml"
adopt = ["slug", "environment"]

[[tool.angee.resources.install]]
path = "install/030_agents.inferenceprovider.yaml"
depends_on = "integrate:master/010_integrate.vendor.yaml"

[[tool.angee.resources.demo]]
path = "demo/010_integrate.credential.yaml"
depends_on = "iam:demo/010_iam.user.yaml"
adopt = ["user", "name"]

[[tool.angee.resources.demo]]
path = "demo/040_agents.inferencemodel.yaml"
depends_on = "install/030_agents.inferenceprovider.yaml"
adopt = ["provider", "name"]

[tool.angee.platform]
category = "Integration"
