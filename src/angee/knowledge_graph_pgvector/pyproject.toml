build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-knowledge-graph-pgvector"
version = "3.0.0"
description = "Permission-scoped passage retrieval with pgvector, PostgreSQL full-text search and wikilink neighbours"
keywords = ["pgvector", "embeddings", "knowledge"]
dependencies = [
    "angee-knowledge>=3,<4",
    "angee-mcp>=3,<4",
    "angee-agents>=3,<4",
    "angee-jobs>=3,<4",
    "pgvector>=0.5.1,<0.6",
    "semantic-text-splitter>=0.33,<0.34",
]
dynamic = ["entry-points"]

[tool.angee]

[tool.angee.platform]
category = "Integration"
