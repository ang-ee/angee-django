# OAuth registration seeds (install tier). Model inferred from the
# `integrate.oauthclient` filename; adopted by (slug, environment) so a pre-existing
# row is linked, not duplicated. Public clients omit client secrets; confidential
# registrations acquire app credentials from host settings. A vendor addon seeds
# its own registrations (Google's live in integrate_google); the OIDC login policy
# for login-capable providers is owned and seeded by the iam_integrate_oidc addon.
- xref: oauth_grok
  slug: grok
  environment: prod
  display_name: Grok
  icon: grok
  client_id: b1a00492-073a-47ea-816f-4c329264a828
  authorize_endpoint: https://auth.x.ai/oauth2/authorize
  token_endpoint: https://auth.x.ai/oauth2/token
  discovery_url: https://auth.x.ai/.well-known/openid-configuration
  issuer: https://auth.x.ai
  is_enabled: false
  supports_pkce: true
  supports_refresh: true
  scopes_catalogue:
    - openid
    - profile
    - email
    - offline_access
    - grok-cli:access
    - api:access
  default_scopes:
    - openid
    - profile
    - email
    - offline_access
    - grok-cli:access
    - api:access
  authorize_params:
    plan: generic
  external_id_claim: sub
  email_claim: email
  display_name_claim: name
  avatar_url_claim: picture
