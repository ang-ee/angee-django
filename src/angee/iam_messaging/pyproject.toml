build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-iam-messaging"
version = "3.0.0"
description = "Emailed sign-in links: an administrator sends a person a single-use link that signs them in"
keywords = ["sign-in link", "login", "email"]
dependencies = ["angee-base>=3,<4", "angee-iam>=3,<4", "angee-graphql>=3,<4", "angee-web>=3,<4", "angee-parties>=3,<4", "angee-messaging>=3,<4", "angee-messaging-templates>=3,<4", "django-compose>=0.1.0.dev14,<0.2"]
dynamic = ["entry-points"]

[tool.angee]

# The link's mail, after the template library's layout, which loads after its blocks and parts.
[tool.angee.resources]
install = [
  { path = "install/010_messaging_templates.messagetemplate.yaml", depends_on = "messaging_templates:install/030_messaging_templates.messagetemplate.yaml" },
]

[tool.angee.platform]
category = "Integration"
