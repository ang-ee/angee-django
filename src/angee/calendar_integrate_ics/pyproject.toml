build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-calendar-integrate-ics"
version = "3.0.0"
description = "Read-only ICS (iCalendar) feed subscriptions as calendars, polled with conditional GETs"
keywords = ["calendar", "ics", "icalendar", "webcal", "subscription", "sync"]
dependencies = ["angee-calendar>=3,<4", "angee-integrate>=3,<4", "angee-scheduling>=3,<4", "angee-graphql>=3,<4", "angee-web>=3,<4", "icalendar>=6.3,<8", "angee-base>=3,<4"]
dynamic = ["entry-points"]

[tool.angee]

[tool.angee.platform]
category = "Integration"
