build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-messaging-templates"
version = "3.0.0"
description = "Message templates: the layouts, templates, blocks and parts outgoing mail is written from, shipped by addons and overridden by a deployment."
keywords = ["message templates", "email templates", "mail layout", "shipped defaults", "overrides"]
dependencies = ["angee-base>=3,<4", "angee-provenance>=3,<4", "angee-iam>=3,<4", "angee-resources>=3,<4", "angee-graphql>=3,<4", "angee-parties>=3,<4"]
dynamic = ["entry-points"]

[tool.angee]

[tool.angee.platform]
category = "Data"
