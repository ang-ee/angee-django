build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-money"
version = "3.0.0"
description = "Currencies, dated exchange rates, and money semantics (rounding + conversion)."
keywords = ["money", "currency", "exchange-rate", "iso-4217"]
dependencies = ["angee-base>=3,<4", "angee-provenance>=3,<4", "angee-iam>=3,<4", "angee-resources>=3,<4", "angee-graphql>=3,<4", "angee-web>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.money" = "angee.money"}

[tool.angee]

[[tool.angee.resources.master]]
path = "master/010_money.currency.yaml"
adopt = "code"

[[tool.angee.resources.demo]]
path = "demo/020_money.currencyrate.yaml"
depends_on = "master/010_money.currency.yaml"

[tool.angee.platform]
category = "Foundation"
