build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-decisions-messaging"
version = "3.0.0"
description = "Open decisions mailed to the people they can be put to: when asked, when a reminder is due, and in a daily digest"
keywords = ["decisions", "messaging", "message templates", "email", "reminders", "daily digest"]
dependencies = [
  "angee-base>=3,<4",
  "angee-brandkit>=3,<4",
  "angee-iam>=3,<4",
  "angee-jobs>=3,<4",
  "angee-decisions>=3,<4",
  "angee-parties>=3,<4",
  "angee-messaging>=3,<4",
  "angee-messaging-templates>=3,<4",
]
dynamic = ["entry-points"]

[tool.angee]

# The mails' shipped rows, after the message template library's layout, blocks and parts.
[tool.angee.resources]
install = [
  { path = "install/010_messaging_templates.messagetemplate.yaml", depends_on = "messaging_templates:install/030_messaging_templates.messagetemplate.yaml" },
]

[tool.angee.platform]
category = "Productivity"
