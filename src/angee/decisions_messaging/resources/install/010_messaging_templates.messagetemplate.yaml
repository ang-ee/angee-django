- xref: template.decisions_messaging.decision_digest.en
  kind: template
  key: decisions_messaging.decision_digest
  language: en
  name: Decision digest
  description: Sent once a day to each person with open questions waiting on them; it lists them, due first.
  format: markdown
  layout: base
  subject: '{{ count }} decision{{ count|pluralize }} waiting for you'
  preheader: The open questions you can answer, as of today.
  source: |-
    {% include "parts/greeting" with person=person only %}

    {{ count }} question{{ count|pluralize }} {{ count|pluralize:"is,are" }} waiting for your decision.

    {% for question in questions %}

    {% include "parts/decisions_messaging.question" with question=question only %}

    {% endfor %}

    {% if more %}

    {{ more }} more {{ more|pluralize:"is,are" }} waiting in the app.

    {% endif %}

    {% include "parts/signature" only %}
  variables:
    person.first_name: The recipient's first name; may be empty.
    count: How many questions are waiting.
    more: How many of them the list leaves out.
    questions.*.title: What kind of question it is.
    questions.*.reason: Why it is asked; may be empty.
    questions.*.records.*: The labels of the records it concerns that the reader reads, the first few.
    questions.*.more_records: How many more of those records there are than it names.
    questions.*.asked_by: Who asked it; empty when no person did.
    questions.*.due_at: When an answer is due; empty when it is undated.
    questions.*.url: Where the question opens in the app.
    questions.*.choices.*: The labels of the alternatives it offers.
  sample:
    person:
      first_name: Ana
    count: 2
    more: 0
    questions:
      - title: Supplier choice
        reason: Two suppliers match this invoice.
        records:
          - Invoice INV-0042
        more_records: 2
        asked_by: Tomás Rey
        due_at: '2027-03-01T09:00:00+00:00'
        url: https://app.example.test/decisions/dcn_18
        choices:
          - Use the proposed supplier
          - Choose another supplier
      - title: Access request
        reason: ''
        records: []
        more_records: 0
        asked_by: ''
        due_at: ''
        url: https://app.example.test/decisions/dcn_19
        choices:
          - Approve access
          - Deny access
