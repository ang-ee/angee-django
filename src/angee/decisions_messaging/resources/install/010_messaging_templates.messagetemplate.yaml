# Decision mail: one part saying what a question is, and the three mails that include
# it. Each links the question's page in the app, where the person decides; the mail
# itself decides nothing. The part loads first, since the templates that include it
# are walked when they save.
- xref: part.decisions_messaging.question.en
  kind: part
  key: decisions_messaging.question
  language: en
  name: Decision question
  description: One open question in a mail; what it is about, its choices, and the button that opens it in the app.
  format: markdown
  source: |-
    **{{ question.title }}**

    {% if question.reason %}

    {{ question.reason }}

    {% endif %}

    {% if question.records|length %}

    Concerns: {% for record in question.records %}{{ record }}{% if not forloop.last %}, {% endif %}{% endfor %}{% if question.more_records %} and {{ question.more_records }} more{% endif %}

    {% endif %}

    Choices: {% for choice in question.choices %}{{ choice }}{% if not forloop.last %}; {% endif %}{% endfor %}

    {% if question.asked_by %}

    Asked by {{ question.asked_by }}

    {% endif %}

    {% if question.due_at %}

    Answer due {{ question.due_at|date:"DATETIME_FORMAT" }}

    {% endif %}

    {% include "blocks/button" with label="Open the decision" url=question.url only %}
  variables:
    question.title: What kind of question it is.
    question.reason: Why it is asked; may be empty.
    question.records.*: The labels of the records it concerns that the reader reads, the first few.
    question.more_records: How many more of those records there are than it names.
    question.asked_by: Who asked it; empty when no person did.
    question.due_at: When an answer is due; empty when it is undated.
    question.url: Where the question opens in the app.
    question.choices.*: The labels of the alternatives it offers.
  sample:
    question:
      title: Supplier choice
      reason: Two suppliers match this invoice.
      records:
        - Invoice INV-0042
      more_records: 2
      asked_by: Tomás Rey
      due_at: '2027-03-01T09:00:00+00:00'
      url: https://app.example.test/decisions/dcn_18
      choices:
        - Use the proposed supplier
        - Choose another supplier
- xref: template.decisions_messaging.decision_asked.en
