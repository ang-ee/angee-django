# Demo sharing (demo tier): Bob reads Alice's calendar, and Alice sees only Bob's
# busy time. An event's readers read its attendees' addresses through the
# calendar's handle arm, so the addresses need no grant of their own.
- resource: "calendar.alice_calendar"
  relation: "reader"
  subject: "iam.user_bob"
- resource: "calendar.bob_calendar"
  relation: "free_busy"
  subject: "iam.user_alice"
