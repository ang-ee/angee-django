build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-graphql"
version = "3.0.0"
description = "The GraphQL runtime — schema buckets, auto-CRUD, subscriptions, and SDL"
keywords = ["graphql", "schema", "api"]
dependencies = ["django-compose>=0.1.0.dev10,<0.2", "angee-base>=3,<4", "sentry-sdk>=2.71.0", "pydantic>=2.14", "graphql-core>=3.3.1,<3.4", "channels>=4.0", "channels-redis>=4.2", "django-zed-rebac[strawberry-django]>=0.32.1,<0.33", "strawberry-django-aggregates>=0.14.1,<0.15", "strawberry-django-hasura>=0.15,<0.16", "strawberry-graphql @ git+https://github.com/ang-ee/strawberry.git@273bf0456d914d4df535222c4cbae73dff46a376", "strawberry-graphql-django @ git+https://github.com/ang-ee/strawberry-django.git@091238ecd4ae07798ef12e9eb24281540da41ced", "angee-server>=3,<4"]
dynamic = ["entry-points"]

[tool.angee]

[tool.angee.graphql]
schema = "records.schemas"

[tool.angee.platform]
category = "Foundation"
