build-system = { requires = ["hatch-angee>=1.1,<2"], build-backend = "hatch_angee" }

[project]
name = "angee-operator"
version = "3.0.0"
description = "Bridge to the operator daemon — drives the local stack and the admin console"
keywords = ["operator", "daemon", "stack"]
dependencies = ["angee-base>=3,<4", "angee-iam>=3,<4", "angee-integrate>=3,<4", "angee-web>=3,<4"]

[project.entry-points]
"angee.addons" = {"angee.operator" = "angee.operator"}

[tool.angee]

[tool.angee.platform]
category = "Platform"
